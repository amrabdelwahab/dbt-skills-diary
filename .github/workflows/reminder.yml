name: Daily reminder

on:
  schedule:
    - cron: '0,30 * * * *'   # every 30 min; per-user time is handled in the script
  workflow_dispatch:
    inputs:
      force:
        description: 'Send to everyone now, ignoring the time window (test)'
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i web-push@3 --no-save
      - run: node scripts/send-reminder.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          LIST_SECRET: ${{ secrets.LIST_SECRET }}
          FORCE: ${{ inputs.force }}
