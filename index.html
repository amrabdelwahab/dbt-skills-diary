<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>DBT Skills Diary</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22DBT%20Skills%20Diary%22%2C%22short_name%22%3A%22Diary%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111827%22%2C%22theme_color%22%3A%22%234f46e5%22%7D" />
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#6366f1; --accent2:#22c55e; --line:#334155;
    --m:#38bdf8; --i:#f472b6; --e:#fbbf24; --s:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#111827,#0f172acc);
    backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .htext{flex:1;min-width:0}
  h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  .date{color:var(--muted);font-size:13px;margin-top:2px}
  .nav{flex:none;display:flex;gap:6px}
  .nav button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    width:38px;height:38px;border-radius:10px;font-size:18px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 140px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .panel h2{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  label.scale{display:block;margin:0 0 10px;color:var(--muted);font-size:13px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .seg button{flex:1;min-width:36px;padding:10px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:15px;font-weight:600}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:10px;font:inherit;resize:vertical;min-height:64px}
  .group{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%}
  .group h3{margin:0;font-size:15px;font-weight:700}
  .group .count{margin-left:auto;color:var(--muted);font-size:13px}
  .skill{display:flex;align-items:center;gap:12px;padding:12px 12px;margin:7px 0;
    background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;
    transition:background .12s,border-color .12s}
  .skill.on{background:#14321f;border-color:var(--accent2)}
  .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);
    display:grid;place-items:center;font-size:15px;color:#fff;transition:.12s}
  .skill.on .box{background:var(--accent2);border-color:var(--accent2)}
  .skill .name{font-size:15px;font-weight:600}
  .skill .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0b1220ee;backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:640px;margin:0 auto}
  .bar button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-size:15px;font-weight:700;color:#fff}
  .wa{background:#25d366;color:#04331a}
  .em{background:var(--accent)}
  .more{background:var(--card2);color:var(--ink);flex:0 0 52px}
  .menu{position:fixed;inset:0;z-index:30;background:#0008;display:none}
  .menu.show{display:block}
  .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:10px 14px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;
    max-height:80vh;overflow:auto}
  .sheet button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
    color:var(--ink);padding:16px 4px;font-size:16px}
  .sheet button:last-child{border-bottom:0}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;
    padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px;margin:2px 2px 0}
  /* archive */
  .arow{display:flex;align-items:center;gap:12px;padding:14px 12px;margin:8px 0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .arow .ad{flex:1}
  .arow .ad b{font-size:15px}
  .arow .ad small{display:block;color:var(--muted);font-size:12px}
  .pill{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:20px;
    padding:6px 10px;font-size:13px;font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  /* lock */
  .lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  .lock.show{display:flex}
  .lock h2{margin:0;font-weight:700}
  .lock input{font-size:28px;letter-spacing:8px;text-align:center;width:200px;padding:12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
  .lock button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700}
  .lock .err{color:#f87171;font-size:14px;min-height:18px}
  /* check-the-facts wizard */
  .ctf{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  .ctf.show{display:flex}
  .ctf .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ctf .top h2{margin:0;font-size:16px;flex:1}
  .ctf .x{background:var(--card2);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:18px}
  .prog{height:4px;background:var(--card2)}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .ctf .body{flex:1;overflow:auto;padding:18px 16px 20px;max-width:640px;margin:0 auto;width:100%}
  .ctf .step-q{font-size:20px;font-weight:700;margin:0 0 6px}
  .ctf .step-h{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
  .ctf textarea{min-height:90px}
  .ctf .lab{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .chips button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:20px;font-size:14px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .emogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .emogrid button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:16px 10px;border-radius:12px;font-size:16px;font-weight:600;text-align:left}
  .emogrid button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .iscale{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .iscale button{flex:1;min-width:30px;padding:14px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:16px;font-weight:700}
  .iscale button.on{color:#fff}
  .iscale button.lo.on{background:var(--accent2);border-color:var(--accent2)}
  .iscale button.hi.on{background:#ef4444;border-color:#ef4444}
  .canttell{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:13px;border-radius:10px;font-size:15px}
  .canttell.on{background:#ef4444;border-color:#ef4444;color:#fff}
  .alert{background:#3b1d1d;border:1px solid #7f1d1d;border-radius:12px;padding:16px;margin:6px 0 2px}
  .alert h3{margin:0 0 8px;font-size:16px;color:#fca5a5}
  .alert ul{margin:8px 0 0;padding-left:18px}.alert li{margin:5px 0}
  .ctf .nav{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    display:flex;gap:10px;max-width:640px;margin:0 auto;width:100%}
  .ctf .nav button{flex:1;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700}
  .ctf .nav .back{background:var(--card2);color:var(--ink);flex:0 0 90px}
  .ctf .nav .next{background:var(--accent);color:#fff}
  .fitbtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    color:var(--ink);padding:15px;border-radius:12px;font-size:15px;margin:8px 0;font-weight:600}
  .fitbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fitbtn small{display:block;font-weight:400;color:var(--muted);margin-top:3px}.fitbtn.on small{color:#dbeafe}
  .ctfopen{display:block;width:100%;margin:12px 0;background:linear-gradient(90deg,#f59e0b,#ef4444);
    color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700}
  .sumbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;
    white-space:pre-wrap;font-size:14px;line-height:1.5}
</style>
</head>
<body>

<div class="lock" id="lock">
  <h2>🔒 DBT Diary</h2>
  <div class="hint">Enter your passcode</div>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" />
  <div class="err" id="pinErr"></div>
  <button onclick="tryUnlock()">Unlock</button>
</div>

<header>
  <div class="htext">
    <h1 id="title">DBT Skills Diary</h1>
    <div class="date" id="dateLine"></div>
  </div>
  <div class="nav">
    <button onclick="step(-1)" title="Previous day">‹</button>
    <button onclick="step(1)" title="Next day">›</button>
  </div>
</header>

<div class="wrap" id="dayView">
  <div class="panel">
    <label class="scale">How much did you use skills today? <span class="hint">(0 = not at all · 7 = used them and they helped)</span></label>
    <div class="seg" id="useScale"></div>
  </div>
  <div id="skills"></div>
  <div class="panel">
    <h2>Notes for my therapist</h2>
    <textarea id="notes" placeholder="Anything you want to add — urges, wins, what was hard…"></textarea>
  </div>
  <button class="ctfopen" onclick="openCTF()">🧭 Check the Facts — guided walkthrough</button>
</div>

<div class="wrap" id="archiveView" style="display:none">
  <div id="archiveList"></div>
</div>

<div class="bar" id="dayBar">
  <button class="wa" onclick="share('wa')">WhatsApp</button>
  <button class="em" onclick="share('email')">Email</button>
  <button class="more" onclick="openMenu()">⋯</button>
</div>

<div class="bar" id="archiveBar" style="display:none">
  <button class="em" onclick="showDay()">← Back to entry</button>
</div>

<div class="menu" id="menu" onclick="if(event.target.id==='menu')closeMenu()">
  <div class="sheet">
    <button onclick="showArchive()">🗂️ View archive (all days)</button>
    <button onclick="share('copy')">📋 Copy this day as text</button>
    <button onclick="setTherapist()">👤 Set therapist's WhatsApp number</button>
    <button onclick="setEmail()">✉️ Set therapist's email</button>
    <button onclick="reminder()">⏰ Add daily reminder (download .ics)</button>
    <button onclick="setPin()">🔑 Set / change passcode</button>
    <button onclick="removePin()">🔓 Remove passcode</button>
    <button onclick="exportAll()">⬇️ Export backup (all days)</button>
    <button onclick="importAll()">⬆️ Restore from backup</button>
    <button onclick="closeMenu()">Close</button>
  </div>
</div>

<!-- Check the Facts guided wizard -->
<div class="ctf" id="ctf">
  <div class="top">
    <button class="x" onclick="closeCTF()">✕</button>
    <h2>Check the Facts</h2>
  </div>
  <div class="prog"><i id="ctfProg"></i></div>
  <div class="body" id="ctfBody"></div>
  <div class="nav" id="ctfNav"></div>
</div>

<input type="file" id="fileIn" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
const GROUPS = [
  { name:"Mindfulness", color:"var(--m)", skills:[
    ["Wise mind",""],["Observe","just notice"],["Describe","put words on, just the facts"],
    ["Participate","enter into the experience"],["Non-judgmental",""],["One-mindfully","present moment"],
    ["Effectiveness","focus on what works"] ]},
  { name:"Interpersonal Effectiveness", color:"var(--i)", skills:[
    ["Figure out interpersonal goals",""],["DEAR","Describe, Express, Assert, Reinforce"],
    ["MAN-Mindful","Broken Record, Ignore Attacks"],["MAN","Appear confident, Negotiate"],
    ["GIVE","Gentle, Interested, Validate, Easy manner"],["FAST","Fair, no-Apologies, Stick to values, Truthful"],
    ["Attend to relationships",""] ]},
  { name:"Emotion Regulation", color:"var(--e)", skills:[
    ["Describing emotions",""],["Check the facts",""],["Opposite-to-emotion action",""],["Problem solving",""],
    ["Accumulate positives","positive events or valued actions"],["Build Mastery / Cope ahead",""],
    ["PLEASE","Physical ills, Eating, Avoid drugs, Sleep, Exercise"],["Mindfulness of current emotion",""] ]},
  { name:"Survival & Acceptance", color:"var(--s)", skills:[
    ["STOP","Stop, Take a step back, Observe, Proceed mindfully"],
    ["TIP","Temperature, Intense exercise, Progressive relax"],["Pros and Cons",""],
    ["Distract / Self-soothe / Improve the moment",""],["Radical Acceptance",""],["Willingness",""],
    ["Mindfulness of current thoughts",""],["Half-smiling",""],["Willing hands",""] ]},
];

const cfg = JSON.parse(localStorage.getItem('dbt_cfg')||'{}');
let curKey;        // 'YYYY-MM-DD' currently shown
let state = {};

function pad(n){return String(n).padStart(2,'0');}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// You log the previous day, so the app opens on yesterday by default.
function defaultKey(){return shiftKey(todayKey(),-1);}
function keyToDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function pretty(k){return keyToDate(k).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});}
function prettyShort(k){return keyToDate(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}

/* ---------- passcode ---------- */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  if(!cfg.pinHash){document.getElementById('lock').classList.remove('show');return;}
  document.getElementById('lock').classList.add('show');
  document.getElementById('pinInput').focus();
}
async function tryUnlock(){
  const v=document.getElementById('pinInput').value;
  if(await sha(v)===cfg.pinHash){document.getElementById('lock').classList.remove('show');
    document.getElementById('pinInput').value='';}
  else{document.getElementById('pinErr').textContent='Wrong passcode';}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
async function setPin(){const v=prompt('Choose a passcode (digits or text):');
  if(v){cfg.pinHash=await sha(v);localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast('Passcode set ✓');}closeMenu();}
function removePin(){delete cfg.pinHash;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast('Passcode removed');closeMenu();}

/* ---------- day load/save ---------- */
function load(){
  state=JSON.parse(localStorage.getItem('dbt_'+curKey)||'{}');
  if(!state.skills)state.skills={};
  render();
}
function save(){localStorage.setItem('dbt_'+curKey,JSON.stringify(state));}

function render(){
  const rel=curKey===todayKey()?'Today · ':curKey===defaultKey()?'Yesterday · ':'';
  document.getElementById('dateLine').textContent=rel+pretty(curKey);
  let seg='';for(let i=0;i<=7;i++)seg+=`<button class="${state.use==i?'on':''}" onclick="setUse(${i})">${i}</button>`;
  document.getElementById('useScale').innerHTML=seg;
  let html='';
  GROUPS.forEach((g,gi)=>{
    const done=g.skills.filter((_,si)=>state.skills[gi+'_'+si]).length;
    html+=`<div class="group"><span class="dot" style="background:${g.color}"></span>
      <h3>${g.name}</h3><span class="count">${done}/${g.skills.length}</span></div>`;
    g.skills.forEach((s,si)=>{const id=gi+'_'+si,on=state.skills[id]?'on':'';
      html+=`<div class="skill ${on}" onclick="toggle('${id}')"><div class="box">${state.skills[id]?'✓':''}</div>
        <div class="name">${s[0]}${s[1]?`<span class="sub">${s[1]}</span>`:''}</div></div>`;});
  });
  document.getElementById('skills').innerHTML=html;
  document.getElementById('notes').value=state.notes||'';
}
function toggle(id){state.skills[id]=!state.skills[id];save();render();}
function setUse(n){state.use=n;save();render();}
document.getElementById('notes').addEventListener('input',e=>{state.notes=e.target.value;save();});
function step(d){curKey=shiftKey(curKey,d);load();window.scrollTo(0,0);}
function shiftKey(k,d){const dt=keyToDate(k);dt.setDate(dt.getDate()+d);
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}

/* ---------- views ---------- */
function showDay(){if(location.hash)history.replaceState(null,'','./');document.getElementById('dayView').style.display='';
  document.getElementById('archiveView').style.display='none';
  document.getElementById('dayBar').style.display='flex';
  document.getElementById('archiveBar').style.display='none';
  document.getElementById('title').textContent='DBT Skills Diary';
  curKey=defaultKey();load();window.scrollTo(0,0);}
function showArchive(){closeMenu();
  if(location.hash!=='#archive')history.replaceState(null,'','#archive');
  document.getElementById('dayView').style.display='none';
  document.getElementById('archiveView').style.display='';
  document.getElementById('dayBar').style.display='none';
  document.getElementById('archiveBar').style.display='flex';
  document.getElementById('title').textContent='Archive';
  document.getElementById('dateLine').textContent='All saved days';
  const keys=Object.keys(localStorage).filter(k=>/^dbt_\d{4}-\d{2}-\d{2}$/.test(k))
    .map(k=>k.slice(4)).sort().reverse();
  const list=document.getElementById('archiveList');
  if(!keys.length){list.innerHTML='<div class="empty">No days saved yet.<br>Fill out today and it will appear here.</div>';return;}
  list.innerHTML=keys.map(k=>{
    const s=JSON.parse(localStorage.getItem('dbt_'+k)||'{}');const sk=s.skills||{};
    const n=Object.values(sk).filter(Boolean).length;
    return `<div class="arow" onclick="openArchiveDay('${k}')">
      <div class="ad"><b>${prettyShort(k)}</b><small>${n} skill${n===1?'':'s'} · ${s.notes?'has notes':'—'}</small></div>
      <div class="pill">${s.use!=null?s.use+'/7':'–'}</div></div>`;
  }).join('');
  window.scrollTo(0,0);
}
function openArchiveDay(k){document.getElementById('dayView').style.display='';
  document.getElementById('archiveView').style.display='none';
  document.getElementById('dayBar').style.display='flex';
  document.getElementById('archiveBar').style.display='none';
  document.getElementById('title').textContent='DBT Skills Diary';
  curKey=k;load();window.scrollTo(0,0);}

/* ---------- summary + share ---------- */
function summary(){
  let out='DBT Skills Diary — '+pretty(curKey)+'\n';
  if(state.use!=null)out+='Skills used today: '+state.use+'/7\n';out+='\n';let any=false;
  GROUPS.forEach((g,gi)=>{const used=g.skills.filter((s,si)=>state.skills[gi+'_'+si]).map(s=>s[0]);
    if(used.length){any=true;out+=g.name+': '+used.join(', ')+'\n';}});
  if(!any)out+='(No skills checked)\n';
  if(state.notes&&state.notes.trim())out+='\nNotes: '+state.notes.trim()+'\n';
  return out;
}
function share(how){const text=summary();
  if(how==='wa'){const num=(cfg.wa||'').replace(/[^0-9]/g,'');
    location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(text);}
  else if(how==='email'){location.href='mailto:'+(cfg.email||'')+'?subject='+
    encodeURIComponent('DBT Diary — '+pretty(curKey))+'&body='+encodeURIComponent(text);}
  else if(how==='copy'){navigator.clipboard.writeText(text).then(()=>toast('Copied ✓'));closeMenu();}
}
function setTherapist(){const v=prompt('Therapist WhatsApp number (country code + number, digits only):',cfg.wa||'');
  if(v!=null){cfg.wa=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast('Saved ✓');}closeMenu();}
function setEmail(){const v=prompt("Therapist's email:",cfg.email||'');
  if(v!=null){cfg.email=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast('Saved ✓');}closeMenu();}

/* ---------- reminder ---------- */
function reminder(){
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DBT Diary//EN','BEGIN:VEVENT',
    'UID:dbt-diary-daily@local','DTSTART:20240101T200000','RRULE:FREQ=DAILY',
    'SUMMARY:Fill out DBT Skills Diary',
    'DESCRIPTION:Open your diary card and send it to your therapist.',
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:DBT Diary','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  dl(new Blob([ics],{type:'text/calendar'}),'dbt-daily-reminder.ics');
  closeMenu();toast('Open the file to add a daily 8pm reminder');
}

/* ---------- backup / restore ---------- */
function exportAll(){
  const data={};Object.keys(localStorage).filter(k=>k.startsWith('dbt_')).forEach(k=>data[k]=localStorage.getItem(k));
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'dbt-diary-backup-'+todayKey()+'.json');
  closeMenu();toast('Backup downloaded ✓');
}
function importAll(){closeMenu();document.getElementById('fileIn').click();}
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);
    Object.keys(data).forEach(k=>{if(k.startsWith('dbt_'))localStorage.setItem(k,data[k]);});
    toast('Backup restored ✓');showDay();}catch(_){toast('Could not read that file');}};
  r.readAsText(f);e.target.value='';
});
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}

/* ---------- ui ---------- */
function openMenu(){document.getElementById('menu').classList.add('show');}
function closeMenu(){document.getElementById('menu').classList.remove('show');}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ===================== Check the Facts (guided) ===================== */
const PRIMARY=['Anger','Fear','Sadness','Shame','Guilt','Disgust','Envy','Jealousy','Love','Happiness'];
const BODY=['Tight chest','Racing heart','Hot / flushed','Tense muscles','Shaky','Stomach knot','Heavy','Short of breath','Restless','Numb'];
const URGES=['Withdraw / hide','Lash out','Run / escape','Cry','Shut down','Avoid it','Seek reassurance','Apologize','Check / control','Numb out'];
const ORDER=['intro','emotion','intensity','event','interp','body','urges','threat','catastrophe','fit','summary'];
let ctf={};

function openCTF(){ctf={step:'intro',bodyChips:[],urgeChips:[]};document.getElementById('ctf').classList.add('show');renderCTF();}
function closeCTF(){document.getElementById('ctf').classList.remove('show');}
function gotoStep(s){ctf.step=s;renderCTF();document.getElementById('ctfBody').scrollTop=0;}
function triggered(){return ctf.cantTell||ctf.intensity>=8;}

function ctfNext(){
  const s=ctf.step;
  if(s==='emotion'&&!ctf.emotion){return toast('Pick an emotion first');}
  if(s==='intensity'&&ctf.intensity==null&&!ctf.cantTell){return toast('Tap a number, or “Can’t tell”');}
  if(s==='intensity'){return gotoStep(triggered()?'dt':'event');}
  if(s==='dt'){return gotoStep('event');}
  const i=ORDER.indexOf(s); if(i>=0&&i<ORDER.length-1)gotoStep(ORDER[i+1]);
}
function ctfPrev(){
  const s=ctf.step;
  if(s==='dt')return gotoStep('intensity');
  if(s==='event')return gotoStep(triggered()?'dt':'intensity');
  const i=ORDER.indexOf(s); if(i>0)gotoStep(ORDER[i-1]); else closeCTF();
}
function ctfEmo(n){ctf.emotion=n;renderCTF();}
function ctfInt(n){ctf.intensity=n;ctf.cantTell=false;renderCTF();}
function ctfCant(){ctf.cantTell=!ctf.cantTell;ctf.intensity=null;renderCTF();}
function ctfChip(field,label){const a=ctf[field];const i=a.indexOf(label);i>=0?a.splice(i,1):a.push(label);renderCTF();}
function ctfFit(v){ctf.fit=v;renderCTF();}

function nav(extra){
  const back=`<button class="back" onclick="ctfPrev()">Back</button>`;
  document.getElementById('ctfNav').innerHTML=back+(extra||`<button class="next" onclick="ctfNext()">Next ▸</button>`);
}
function chips(field,list){return `<div class="chips">`+list.map(l=>
  `<button class="${ctf[field].includes(l)?'on':''}" onclick="ctfChip('${field}','${l}')">${l}</button>`).join('')+`</div>`;}

function renderCTF(){
  const b=document.getElementById('ctfBody'); const s=ctf.step;
  const idx=Math.max(0,ORDER.indexOf(s==='dt'?'intensity':s));
  document.getElementById('ctfProg').style.width=(idx/(ORDER.length-1)*100)+'%';
  let h='';
  if(s==='intro'){
    h=`<p class="step-q">Let’s check the facts.</p>
    <p class="step-h">A DBT skill (Linehan) to see whether an emotion — and how strong it is — actually fits the situation, or fits your <i>interpretation</i> of it. Takes a few minutes. Nothing is sent anywhere unless you choose to at the end.</p>`;
    nav(`<button class="next" onclick="ctfNext()">Start ▸</button>`);
  }
  else if(s==='emotion'){
    h=`<p class="step-q">What is the emotion you want to check?</p>
    <p class="step-h">Pick the one that fits best. (DBT primary emotions.)</p>
    <div class="emogrid">`+PRIMARY.map(e=>`<button class="${ctf.emotion===e?'on':''}" onclick="ctfEmo('${e}')">${e}</button>`).join('')+`</div>
    <div class="lab">A more specific word for it (optional)</div>
    <input class="canttell" style="text-align:left" placeholder="e.g. resentful, anxious, humiliated…" value="${ctf.emotionWord||''}" oninput="ctf.emotionWord=this.value">`;
    nav();
  }
  else if(s==='intensity'){
    h=`<p class="step-q">How intense is it, 0–10?</p>
    <p class="step-h">0 = not at all · 10 = the most you’ve ever felt it.</p>
    <div class="iscale">`+Array.from({length:11},(_,n)=>
      `<button class="${n>=8?'hi':'lo'} ${ctf.intensity===n?'on':''}" onclick="ctfInt(${n})">${n}</button>`).join('')+`</div>
    <button class="canttell ${ctf.cantTell?'on':''}" onclick="ctfCant()">I can’t tell how intense it is</button>`;
    nav();
  }
  else if(s==='dt'){
    h=`<div class="alert"><h3>⚠️ Let’s lower the intensity first</h3>
      <p style="margin:0">When an emotion is this strong (or hard to read), the thinking brain is offline — Check the Facts won’t land yet. Use a <b>Distress Tolerance</b> skill to take the edge off, <i>then</i> come back to this.</p>
      <ul>
        <li><b>TIP</b> — cold water on your face / hold ice, or intense exercise for a few minutes, then paced breathing (out longer than in)</li>
        <li><b>STOP</b> — Stop, Take a step back, Observe, Proceed mindfully</li>
        <li><b>Distract & Self-soothe</b> — change activity; soothe your five senses</li>
      </ul></div>
    <p class="step-h">Come back when you’re at roughly a 7 or below. You can continue now if you want, but it may be harder.</p>`;
    nav(`<button class="next" onclick="ctfNext()">I’ve eased it — continue ▸</button>`);
  }
  else if(s==='event'){
    h=`<p class="step-q">What actually happened?</p>
    <p class="step-h">Describe <b>only the facts you observed</b> — what you literally saw and heard, like a camera would. No judgments, no “they meant…”, no assumptions. That part comes next.</p>
    <textarea placeholder="Just the observable facts: who, what, where, what was said/done…" oninput="ctf.event=this.value">${ctf.event||''}</textarea>
    <p class="step-h" style="margin-top:10px">✓ “He said ‘we’ll talk later’ and left the room.”<br>✗ “He blew me off because he doesn’t care.” (that’s an interpretation)</p>`;
    nav();
  }
  else if(s==='interp'){
    h=`<p class="step-q">What are your interpretations & assumptions?</p>
    <p class="step-h">The thoughts, meanings and assumptions you’re adding to the facts.</p>
    <textarea placeholder="What I’m telling myself it means…" oninput="ctf.interp=this.value">${ctf.interp||''}</textarea>
    <div class="lab">Now — what are other possible interpretations? (look at all sides)</div>
    <textarea placeholder="Other ways a reasonable person might read the same facts…" oninput="ctf.otherInterp=this.value">${ctf.otherInterp||''}</textarea>`;
    nav();
  }
  else if(s==='body'){
    h=`<p class="step-q">What do you notice in your body?</p>
    <p class="step-h">Tap any that fit; add your own.</p>${chips('bodyChips',BODY)}
    <textarea placeholder="Anything else you feel in your body…" oninput="ctf.bodyText=this.value">${ctf.bodyText||''}</textarea>`;
    nav();
  }
  else if(s==='urges'){
    h=`<p class="step-q">What is the emotion urging you to do?</p>
    <p class="step-h">Every emotion has an action urge. Name it — you don’t have to act on it.</p>${chips('urgeChips',URGES)}
    <textarea placeholder="What you feel pulled to do or say…" oninput="ctf.urgeText=this.value">${ctf.urgeText||''}</textarea>`;
    nav();
  }
  else if(s==='threat'){
    h=`<p class="step-q">Are you assuming a threat?</p>
    <p class="step-h">Name the threat you’re sensing, then weigh it honestly.</p>
    <textarea placeholder="The threat/danger I’m assuming is…" oninput="ctf.threat=this.value">${ctf.threat||''}</textarea>
    <div class="lab">How likely is it to actually happen? (0–100%)</div>
    <input class="canttell" style="text-align:left" inputmode="numeric" placeholder="e.g. 20%" value="${ctf.threatProb||''}" oninput="ctf.threatProb=this.value">
    <div class="lab">What other outcomes are possible?</div>
    <textarea placeholder="Other things that could happen instead…" oninput="ctf.otherOutcomes=this.value">${ctf.otherOutcomes||''}</textarea>`;
    nav();
  }
  else if(s==='catastrophe'){
    h=`<p class="step-q">What’s the catastrophe — and could you cope?</p>
    <p class="step-h">Picture the worst case. Then picture yourself actually coping with it (problem-solving, coping ahead, or radical acceptance).</p>
    <textarea placeholder="Worst case that could realistically happen…" oninput="ctf.catastrophe=this.value">${ctf.catastrophe||''}</textarea>
    <div class="lab">How I could cope even if it happened</div>
    <textarea placeholder="I could handle it by…" oninput="ctf.coping=this.value">${ctf.coping||''}</textarea>`;
    nav();
  }
  else if(s==='fit'){
    const opt=(v,t,d)=>`<button class="fitbtn ${ctf.fit===v?'on':''}" onclick="ctfFit('${v}')">${t}<small>${d}</small></button>`;
    h=`<p class="step-q">Does the emotion — and its intensity — fit the facts?</p>
    <p class="step-h">Looking at everything above, decide honestly.</p>
    ${opt('fits','✅ It fits the facts','The emotion makes sense and so does its strength → problem-solve / act on it skilfully.')}
    ${opt('partly','🟡 The emotion fits, but the intensity doesn’t','Real concern, but turned up too high → check the facts, then act opposite to the extra intensity.')}
    ${opt('doesnt','❌ It doesn’t fit the facts','It’s driven by the interpretation, not the facts → try acting opposite to the urge.')}`;
    nav();
  }
  else if(s==='summary'){
    h=`<p class="step-q">Here’s your Check the Facts</p>
    <div class="sumbox">${ctfSummary().replace(/</g,'&lt;')}</div>
    <button class="ctfopen" style="background:var(--accent2)" onclick="ctfToNotes()">＋ Add to ${curKey===todayKey()?'today':'this day'}’s notes</button>
    <button class="canttell" onclick="ctfShare()">📲 Send this to my therapist (WhatsApp)</button>
    <button class="canttell" onclick="navigator.clipboard.writeText(ctfSummary()).then(()=>toast('Copied ✓'))">📋 Copy</button>`;
    document.getElementById('ctfNav').innerHTML=`<button class="back" onclick="ctfPrev()">Back</button><button class="next" onclick="closeCTF()">Done</button>`;
    b.innerHTML=h;return;
  }
  b.innerHTML=h;
}

function ctfSummary(){
  const L=[]; L.push('🧭 Check the Facts — '+pretty(curKey));
  let e=ctf.emotion||'—'; if(ctf.emotionWord)e+=' ('+ctf.emotionWord+')';
  L.push('Emotion: '+e+'  ·  Intensity: '+(ctf.cantTell?'hard to tell':(ctf.intensity!=null?ctf.intensity+'/10':'—')));
  const add=(t,v)=>{if(v&&String(v).trim())L.push('\n'+t+': '+String(v).trim());};
  add('What happened (just the facts)',ctf.event);
  add('My interpretation',ctf.interp);
  add('Other interpretations',ctf.otherInterp);
  const body=[...(ctf.bodyChips||[]),ctf.bodyText].filter(x=>x&&String(x).trim()).join(', ');
  add('Body sensations',body);
  const urge=[...(ctf.urgeChips||[]),ctf.urgeText].filter(x=>x&&String(x).trim()).join(', ');
  add('Action urges',urge);
  if((ctf.threat||'').trim()){let t=ctf.threat.trim();if(ctf.threatProb)t+='  (likelihood: '+ctf.threatProb+')';L.push('\nThreat I’m assuming: '+t);}
  add('Other possible outcomes',ctf.otherOutcomes);
  add('Worst case',ctf.catastrophe);
  add('How I could cope',ctf.coping);
  const fitTxt={fits:'The emotion fits the facts.',partly:'The emotion fits, but its intensity doesn’t.',doesnt:'The emotion does NOT fit the facts.'}[ctf.fit];
  if(fitTxt)L.push('\nConclusion: '+fitTxt);
  return L.join('\n');
}
function ctfToNotes(){
  const t=ctfSummary();
  state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+t;
  save();render();toast('Added to notes ✓');closeCTF();
}
function ctfShare(){
  const num=(cfg.wa||'').replace(/[^0-9]/g,'');
  location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(ctfSummary());
}

curKey=defaultKey();load();gate();
if(location.hash==='#archive')showArchive();
</script>
