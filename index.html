function closeLearn(){if(!document.getElementById('learn').classList.contains('show'))return;
  const d=(history.state&&history.state.depth)||0;document.getElementById('learn').classList.remove('show');render();if(d)history.go(-d);}
function learnModule(gi){const d=(history.state&&history.state.depth)||1;learn.view='module';learn.gi=gi;history.pushState({lv:'module',depth:d+1},'');renderLearn();}
function learnSkill(gi,si){const d=(history.state&&history.state.depth)||1;learn.view='skill';learn.gi=gi;learn.si=si;history.pushState({lv:'skill',depth:d+1},'');renderLearn();}
window.addEventListener('popstate',e=>{
  if(!document.getElementById('learn').classList.contains('show'))return;
  const lv=e.state&&e.state.lv;
  if(lv==='home'){learn.view='home';renderLearn();}
  else if(lv==='module'){learn.view='module';renderLearn();}
  else if(lv==='skill'){learn.view='skill';renderLearn();}
  else{document.getElementById('learn').classList.remove('show');render();}  // backed out → diary
});
function renderLearn(){
  const chev=LANG==='ar'?'‹':'›';const b=document.getElementById('learnBody');b.scrollTop=0;
  const lb=document.getElementById('learnBack');if(lb)lb.textContent=LANG==='ar'?'›':'‹';
  if(learn.view==='home'){
    document.getElementById('learnTitle').textContent=t('learnTitle');
    let h=GROUPS.map((g,gi)=>`<button class="lrow" onclick="learnModule(${gi})"><span class="dot" style="background:${g.color}"></span><span class="lt"><b>${grName(g)}</b><small>${g.skills.length} ${L('skills','مهارة')}</small></span><span class="chev" dir="ltr">${chev}</span></button>`).join('');
    h+=`<button class="lrow" onclick="closeLearn();openMyths()"><span style="font-size:22px">🧠</span><span class="lt"><b>${L('Myths about emotions','خرافات عن المشاعر')}</b><small>${L('20 myths + challenges','٢٠ خرافة + ردود')}</small></span><span class="chev" dir="ltr">${chev}</span></button>`;
    b.innerHTML=h;
    document.getElementById('learnNav').innerHTML=`<div class="navin"><button class="next" onclick="closeLearn()">${L('Close','إغلاق')}</button></div>`;
  } else if(learn.view==='module'){
    const g=GROUPS[learn.gi];document.getElementById('learnTitle').textContent=grName(g);
    const lrow=si=>`<button class="lrow" onclick="learnSkill(${learn.gi},${si})"><span class="lt"><b>${skName(g.skills[si])}</b></span><span class="chev" dir="ltr">${chev}</span></button>`;
    let h=`<div class="modintro" style="border-inline-start-color:${g.color}">${L(MODULE_INFO[learn.gi][0],MODULE_INFO[learn.gi][1])}</div>`;
    const secs=MOD_GROUPS[learn.gi];
    if(secs)h+=secs.map(sec=>((sec.h[0]||sec.h[1])?`<div class="lhead">${L(sec.h[0],sec.h[1])}</div>`:'')+sec.idx.map(lrow).join('')).join('');
    else h+=g.skills.map((s,si)=>lrow(si)).join('');
    b.innerHTML=h;
    document.getElementById('learnNav').innerHTML=`<div class="navin"><button class="back" onclick="history.back()">${L('Back','رجوع')}</button></div>`;
  } else {
    const g=GROUPS[learn.gi],s=g.skills[learn.si],key=learn.gi+'_'+learn.si,info=SKILLS_INFO[key]||[],acro=ACRONYMS[key];
    document.getElementById('learnTitle').textContent=skName(s);
    let h=`<p class="step-q">${skName(s)}</p>`;
    if(info[0])h+=`<div class="infosec"><div class="ih">${t('iWhat')}</div><p>${L(info[0],info[1])}</p></div>`;
    if(key==='0_0')h+=`<div class="infosec"><div class="ih">${L('The three states of mind','حالات العقل الثلاثة')}</div>`+MINDSTATES.map(m=>`<div class="mindstate" style="border-inline-start-color:${m[0]}"><b>${L(m[1],m[2])}</b><span>${L(m[3],m[4])}</span></div>`).join('')+`</div>`;
    if(acro)h+=`<div class="infosec"><div class="ih">${L('What the letters mean','معنى الحروف')}</div>`+acro.map(a=>`<div class="acrorow"><div class="acrobadge">${a[0]}</div><div class="acrotxt"><b>${L(a[1],a[2])}</b>${L(a[3],a[4])}</div></div>`).join('')+`</div>`;
    if(info[2])h+=`<div class="infosec"><div class="ih">${t('iHow')}</div><p>${L(info[2],info[3])}</p></div>`;
    if(info[4])h+=`<div class="infosec"><div class="ih">${t('iWhen')}</div><p>${L(info[4],info[5])}</p></div>`;
    b.innerHTML=h;
    const ln=LAUNCH[key];
    const tryBtn=ln?`<button class="next" onclick="closeLearn();${ln}">${t('iTry')}</button>`:'';
    document.getElementById('learnNav').innerHTML=`<div class="navin"><button class="back" onclick="history.back()">${L('Back','رجوع')}</button>${tryBtn}</div>`;
  }
}

/* ===================== Myths about emotions ===================== */
const MYTHS=[
 ["There is a right way to feel in every situation.","فيه طريقة صح للإحساس في كل موقف.","Everyone responds differently. There is no single correct way.","كل شخص بيرد بشكل مختلف. مفيش طريقة واحدة صح."],
 ["Letting others know I feel bad is a weakness.","لو الناس عرفت إني حاسس بسوء يبقى ده ضعف.","Sharing how I feel is a healthy form of communication.","إني أشارك مشاعري ده تواصل صحي."],
 ["Negative feelings are bad and destructive.","المشاعر السلبية سيئة ومدمرة.","Negative feelings are natural and help me understand a situation.","المشاعر السلبية طبيعية وبتساعدني أفهم الموقف."],
 ["Being emotional means being out of control.","إني أكون عاطفي يعني فاقد السيطرة.","Being emotional means being a normal human being.","إني أكون عاطفي يعني إني إنسان طبيعي."],
 ["Some emotions are stupid.","بعض المشاعر غبية.","Every emotion is useful for understanding what I’m experiencing.","كل شعور مفيد عشان أفهم اللي بمرّ بيه."],
 ["All painful emotions come from a bad attitude.","كل المشاعر المؤلمة سببها تصرف أو مزاج غلط.","All painful emotions are natural responses to something.","كل المشاعر المؤلمة ردود طبيعية لحاجة."],
 ["If others don’t approve of my feelings, I shouldn’t feel them.","لو الناس مش موافقة على مشاعري، يبقى مش المفروض أحسها.","I have every right to feel as I do, whatever others think.","من حقي أحس زي ما أنا حاسس، مهما الناس فكرت."],
 ["Other people are the best judges of how I feel.","الناس التانية أحسن حد يحكم على إحساسي.","I am the best judge of how I feel; others can only guess.","أنا أحسن حد يحكم على إحساسي؛ غيري بيخمّن بس."],
 ["Painful emotions aren’t important and should be ignored.","المشاعر المؤلمة مش مهمة والمفروض أتجاهلها.","Painful emotions can be warning signs that something is off.","المشاعر المؤلمة ممكن تكون إنذار إن فيه حاجة غلط."],
 ["Extreme emotions get you further than regulating them.","المشاعر المتطرفة بتوصّلك أبعد من إنك تنظّمها.","Extreme emotions often cause trouble; regulating helps more.","المشاعر المتطرفة غالبًا بتعمل مشاكل؛ التنظيم بيساعد أكتر."],
 ["Creativity requires intense, out-of-control emotions.","الإبداع محتاج مشاعر شديدة وخارجة عن السيطرة.","I can be in control of my emotions and still be creative.","أقدر أتحكم في مشاعري وأفضل مبدع."],
 ["Drama is cool.","الدراما حلوة وجذابة.","I can be dramatic and still regulate my emotions.","أقدر أكون درامي وأنظّم مشاعري برضه."],
 ["It is inauthentic to try to change my emotions.","إني أحاول أغيّر مشاعري ده تزييف لنفسي.","Change is itself authentic; it’s part of life.","التغيير نفسه أصيل؛ وده جزء من الحياة."],
 ["Emotional truth is what counts, not factual truth.","الحقيقة العاطفية هي اللي تهم، مش حقيقة الوقائع.","Both emotional feeling and facts matter.","الإحساس العاطفي والحقايق الاتنين مهمين."],
 ["People should do whatever they feel like doing.","الناس المفروض تعمل اللي حاسة بيه أيًا كان.","Doing whatever I feel like can be ineffective.","إني أعمل اللي حاسس بيه ممكن يكون مش فعّال."],
 ["Acting on your emotions is the mark of a truly free person.","التصرف بناء على مشاعرك علامة الشخص الحر فعلًا.","The truly free person can regulate their emotions.","الشخص الحر فعلًا يقدر ينظّم مشاعره."],
 ["My emotions are who I am.","مشاعري هي أنا.","Emotions are partly, but not completely, who I am.","المشاعر جزء مني، بس مش كل اللي أنا هو."],
 ["My emotions are why people love me.","مشاعري هي سبب إن الناس بتحبني.","People will still love me if I regulate my emotions.","الناس هتفضل تحبني لو نظّمت مشاعري."],
 ["Emotions can just happen for no reason.","المشاعر ممكن تحصل من غير سبب.","Everything has a cause, even when I can’t see it.","كل حاجة ليها سبب، حتى لو مش شايفه."],
 ["Emotions should always be trusted.","المشاعر المفروض أثق فيها دايمًا.","Emotions should sometimes be trusted — not always.","المشاعر المفروض أثق فيها أحيانًا — مش دايمًا."],
];
const MYTHS_INTRO=[
  "In DBT, emotions aren’t “good” or “bad” — every emotion has a function and makes sense given its causes. But we all pick up <b>myths</b> about emotions (e.g. “negative feelings are bad,” “being emotional means being out of control”). These beliefs add a <i>second layer of suffering</i> and push us to suppress, judge, or over-trust our feelings.<br><br>The skill is to <b>catch each myth and answer it with a challenge</b> — a truer, more balanced statement. Below are 20 common myths, each with a challenge. Read them, then write your own challenge in your words — that’s what makes it stick.",
  "في الـDBT، المشاعر مش «حلوة» ولا «وحشة» — كل شعور ليه وظيفة وله معنى حسب أسبابه. بس كلنا بنتشرب <b>خرافات</b> عن المشاعر (زي «المشاعر السلبية وحشة»، «إنك تكون عاطفي يعني فاقد السيطرة»). المعتقدات دي بتزوّد <i>طبقة تانية من المعاناة</i>، وبتدفعنا نكبت مشاعرنا أو نحكم عليها أو نثق فيها زيادة.<br><br>المهارة إنك <b>تمسك كل خرافة وتردّ عليها برد</b> متوازن وأقرب للحقيقة. تحت هتلاقي ٢٠ خرافة شائعة، كل واحدة معاها رد. اقراهم، وبعدين اكتب ردّك بكلماتك إنت — ده اللي بيثبّت الفكرة.",
];
let myth={};
const esc=s=>String(s||'').replace(/</g,'&lt;');
function openMyths(){myth={step:'intro',i:0,mine:JSON.parse(localStorage.getItem('dbt_myths')||'{}'),custom:JSON.parse(localStorage.getItem('dbt_myths_custom')||'[]')};document.getElementById('myth').classList.add('show');renderMyth();}
function closeMyths(){document.getElementById('myth').classList.remove('show');render();}
function mythStart(){myth.step='card';myth.i=0;renderMyth();}
function mythTotal(){return MYTHS.length+myth.custom.length+1;}  // +1 = the "add your own" card
function mythSave(v){myth.mine[myth.i]=v;localStorage.setItem('dbt_myths',JSON.stringify(myth.mine));}
function mythCustomSet(ci,f,v){myth.custom[ci][f]=v;localStorage.setItem('dbt_myths_custom',JSON.stringify(myth.custom));}
function mythDel(ci){myth.custom.splice(ci,1);localStorage.setItem('dbt_myths_custom',JSON.stringify(myth.custom));myth.i=MYTHS.length+myth.custom.length;renderMyth();}
function mythAdd(){const mm=(document.getElementById('newMyth').value||'').trim();if(!mm)return toast(L('Write the myth first','اكتب الخرافة الأول'));
  myth.custom.push({m:mm,c:(document.getElementById('newCh').value||'').trim()});localStorage.setItem('dbt_myths_custom',JSON.stringify(myth.custom));
  myth.i=MYTHS.length+myth.custom.length-1;renderMyth();}
function mythGo(d){const tt=mythTotal();myth.i=(myth.i+d+tt)%tt;renderMyth();}
function renderMyth(){
  const b=document.getElementById('mythBody');b.scrollTop=0;
  if(myth.step==='intro'){
    document.getElementById('mythTitle').textContent=t('mythsTitle');
    document.getElementById('mythProg').style.width='0%';
    b.innerHTML=`<p class="step-q">🧠 ${t('mythsTitle')}</p><p class="step-h" style="font-size:15px;line-height:1.6">${L(MYTHS_INTRO[0],MYTHS_INTRO[1])}</p>`;
    document.getElementById('mythNav').innerHTML=`<div class="navin"><button class="back" onclick="closeMyths()">${L('Close','إغلاق')}</button><button class="next" onclick="mythStart()">${L('Start','ابدأ')} ${LANG==='ar'?'◂':'▸'}</button></div>`;
    return;
  }
  const total=mythTotal(),last=myth.i===total-1;
  document.getElementById('mythTitle').textContent=t('mythsTitle')+' · '+(myth.i+1)+'/'+total;
  document.getElementById('mythProg').style.width=((myth.i+1)/total*100)+'%';
  if(myth.i<MYTHS.length){
    const m=MYTHS[myth.i];
    b.innerHTML=`<p class="mythq">“${L(m[0],m[1])}”</p>
     <div class="mythch"><span class="cl">${t('mythChallenge')}</span>${L(m[2],m[3])}</div>
     <div class="lab" style="margin-top:16px">${t('myChallenge')}</div>
     <textarea placeholder="${t('myChPh')}" oninput="mythSave(this.value)">${esc(myth.mine[myth.i])}</textarea>`;
  } else if(myth.i<MYTHS.length+myth.custom.length){
    const ci=myth.i-MYTHS.length,c=myth.custom[ci];
    b.innerHTML=`<div class="lab">${L('Your myth','خرافتك')}</div>
     <textarea oninput="mythCustomSet(${ci},'m',this.value)">${esc(c.m)}</textarea>
     <div class="lab" style="margin-top:12px">${t('myChallenge')}</div>
     <textarea placeholder="${t('myChPh')}" oninput="mythCustomSet(${ci},'c',this.value)">${esc(c.c)}</textarea>
     <button class="canttell" style="background:#3b1d1d;border-color:#7f1d1d;color:#fca5a5" onclick="mythDel(${ci})">${L('🗑 Delete this myth','🗑 احذف الخرافة دي')}</button>`;
  } else {
    b.innerHTML=`<p class="step-q">➕ ${L('Add your own myth','ضيف خرافة من عندك')}</p>
     <p class="step-h">${L('A belief about emotions you want to challenge, in your own words. It’s saved on this device.','معتقد عن المشاعر عايز تتحدّاه، بكلامك إنت. بيتحفظ على الجهاز ده.')}</p>
     <div class="lab">${L('The myth / belief','الخرافة / المعتقد')}</div>
     <textarea id="newMyth" placeholder="${L('e.g. “If I cry, I’m weak.”','مثال: «لو عيّطت، يبقى أنا ضعيف.»')}"></textarea>
     <div class="lab" style="margin-top:12px">${L('Your challenge','ردّك عليها')}</div>
     <textarea id="newCh" placeholder="${t('myChPh')}"></textarea>
     <button class="ctfopen" style="background:var(--accent2)" onclick="mythAdd()">${L('Add this myth','ضيف الخرافة')}</button>`;
  }
  const backFn=myth.i===0?"myth.step='intro';renderMyth()":"mythGo(-1)";
  document.getElementById('mythNav').innerHTML=`<div class="navin"><button class="back" onclick="${backFn}">${L('Back','رجوع')}</button><button class="next" onclick="${last?'closeMyths()':'mythGo(1)'}">${last?L('Done','تمام'):L('Next','التالي')}</button></div>`;
}

/* ===================== DEAR MAN script composer ===================== */
const DEAR_ORDER=['intro','describe','express','assert','reinforce','negotiate','result'];
let dear={};
function openDear(){dear={step:'intro'};document.getElementById('dear').classList.add('show');renderDear();}
function closeDear(){document.getElementById('dear').classList.remove('show');render();}
function dearGo(s){dear.step=s;renderDear();document.getElementById('dearBody').scrollTop=0;}
function dearNext(){const i=DEAR_ORDER.indexOf(dear.step);if(i<DEAR_ORDER.length-1)dearGo(DEAR_ORDER[i+1]);}
function dearPrev(){const i=DEAR_ORDER.indexOf(dear.step);if(i>0)dearGo(DEAR_ORDER[i-1]);else closeDear();}
function dearNav(html){document.getElementById('dearNav').innerHTML=`<div class="navin">${html}</div>`;}
function dearScript(){
  const parts=[dear.describe,dear.express,dear.assert,dear.reinforce].map(x=>(x||'').trim()).filter(Boolean);
  let s=parts.join(' ');
  if((dear.negotiate||'').trim())s+=(s?'\n\n':'')+L('If that’s not possible: ','لو ده مش ممكن: ')+dear.negotiate.trim();
  return s;
}
function dearField(q,help,field,ph,ex){
  return `<p class="step-q">${q}</p><p class="step-h">${help}</p>
    <textarea placeholder="${ph}" oninput="dear.${field}=this.value">${dear[field]||''}</textarea>
    ${ex?`<p class="step-h" style="margin-top:10px">${ex}</p>`:''}`;
}
function renderDear(){
  const b=document.getElementById('dear'+'Body'),s=dear.step;
  document.getElementById('dearProg').style.width=(Math.max(0,DEAR_ORDER.indexOf(s))/(DEAR_ORDER.length-1)*100)+'%';
  document.getElementById('dearTitle').textContent=L('DEAR MAN script','رسالة DEAR MAN');
  let h='';
  if(s==='intro'){
    h=`<p class="step-q">${L('Build a DEAR MAN script','اكتب رسالة DEAR MAN')}</p>
    <p class="step-h">${L('DEAR MAN is the DBT skill for asking for something — or saying no — effectively. Fill in each part and you’ll get a clear message you can actually send or say. <b>D-E-A-R</b> is <i>what</i> you say; <b>M-A-N</b> is <i>how</i> you deliver it.','DEAR MAN هي مهارة الـDBT للطلب أو الرفض بفعالية. إملا كل جزء وهتطلع برسالة واضحة تقدر تبعتها أو تقولها فعلًا. <b>D-E-A-R</b> هو <i>اللي</i> بتقوله؛ <b>M-A-N</b> هو <i>إزاي</i> بتقوله.')}</p>`;
    dearNav(`<button class="next" onclick="dearNext()">${L('Start','ابدأ')} ${LANG==='ar'?'◂':'▸'}</button>`);b.innerHTML=h;return;
  }
  if(s==='describe')h=dearField(L('D · Describe','D · صِف'),L('State just the facts of the situation — no judgments or blame.','اذكر حقايق الموقف بس — من غير أحكام أو لوم.'),'describe',L('Just the facts…','الحقايق بس…'),L('e.g. “The last two times I asked for help, I didn’t get a reply.”','مثال: «آخر مرتين طلبت فيهم مساعدة، ماجاليش رد.»'));
  else if(s==='express')h=dearField(L('E · Express','E · عبّر'),L('Say how you feel using “I” statements — don’t blame or mind-read.','قول شعورك بصيغة «أنا» — من غير لوم أو قراءة أفكار.'),'express',L('“I feel…”','«أنا حاسس…»'),L('e.g. “I feel overwhelmed and a bit alone with this.”','مثال: «حاسس إني متحمّل أكتر من طاقتي وشويه لوحدي.»'));
  else if(s==='assert')h=dearField(L('A · Assert','A · أكّد'),L('Ask clearly for what you want, or say no clearly. Don’t expect them to read your mind.','اطلب بوضوح اللي عايزه، أو ارفض بوضوح. متستناش إنهم يقروا أفكارك.'),'assert',L('Your clear ask or no…','طلبك أو رفضك بوضوح…'),L('e.g. “I’d like us to split the chores this week.”','مثال: «نفسي نقسّم شغل البيت بينا الأسبوع ده.»'));
  else if(s==='reinforce')h=dearField(L('R · Reinforce','R · عزّز'),L('Tell them what’s in it for them — the positive effect of saying yes.','قول لهم الفايدة اللي هتعود عليهم — الأثر الإيجابي لو وافقوا.'),'reinforce',L('The benefit to them…','الفايدة ليهم…'),L('e.g. “It would really help me relax and have more energy for us.”','مثال: «ده هيساعدني أرتاح ويبقى عندي طاقة أكتر لينا.»'));
  else if(s==='negotiate')h=dearField(L('N · Negotiate (optional)','N · تفاوض (اختياري)'),L('What could you accept if they can’t fully say yes? Be willing to give to get.','إيه البديل اللي تقدر تقبله لو مش هيقدروا يوافقوا بالكامل؟ كن مستعد تدّي علشان تاخد.'),'negotiate',L('A fallback you’d accept…','بديل تقبله…'),L('e.g. “If this week is hard, can we start Monday?”','مثال: «لو الأسبوع ده صعب، نبدأ الإتنين؟»'));
  else if(s==='result'){
    state.skills['1_1']=true;save();
    h=`<p class="step-q">${L('Your DEAR MAN script','رسالتك بأسلوب DEAR MAN')}</p>
    <div class="sumbox">${(dearScript()||L('(fill in the parts)','(إملا الأجزاء)')).replace(/</g,'&lt;')}</div>
    <div class="lab" style="margin-top:16px">${L('Deliver it with — M · A · N','وصّلها بـ — M · A · N')}</div>
    <ul class="steplist">
      <li><b>Mindful</b> — ${L('stay on track; broken record, ignore attacks','فضل على هدفك؛ اسطوانة مشروخة، تجاهل الهجوم')}</li>
      <li><b>Appear confident</b> — ${L('steady voice, eye contact, upright posture','صوت ثابت، تواصل بالعين، وقفة معتدلة')}</li>
      <li><b>Negotiate</b> — ${L('be willing to give to get','كن مستعد تدّي علشان تاخد')}</li>
    </ul>
    <button class="ctfopen" style="background:var(--accent2)" onclick="dearToNotes()">${L('＋ Add to '+(curKey===todayKey()?'today':'this day')+'’s notes','＋ ضيف لملاحظات '+(curKey===todayKey()?'النهارده':'اليوم ده'))}</button>
    <button class="canttell" onclick="dearShareMsg()">${L('📲 Send the message (WhatsApp)','📲 ابعت الرسالة (واتساب)')}</button>

/* ===================== Chain analysis ===================== */
const CHAIN_ORDER=['intro','behavior','prompt','vuln','links','conseq','skills','repair','summary'];
let chain={};
function openChain(){chain={i:0};document.getElementById('chain').classList.add('show');renderChain();}
function closeChain(){document.getElementById('chain').classList.remove('show');render();}
function chainNext(){if(chain.i<CHAIN_ORDER.length-1){chain.i++;renderChain();document.getElementById('chainBody').scrollTop=0;}}
function chainPrev(){if(chain.i>0){chain.i--;renderChain();document.getElementById('chainBody').scrollTop=0;}else closeChain();}
function renderChain(){
  const id=CHAIN_ORDER[chain.i],b=document.getElementById('chainBody');
  document.getElementById('chainProg').style.width=(chain.i/(CHAIN_ORDER.length-1)*100)+'%';
  document.getElementById('chainTitle').textContent=L('Chain analysis','تحليل السلسلة');
  const navMid=`<div class="navin"><button class="back" onclick="chainPrev()">${L('Back','رجوع')}</button><button class="next" onclick="chainNext()">${L('Next','التالي')} ${LANG==='ar'?'◂':'▸'}</button></div>`;
  if(id==='intro'){
    b.innerHTML=`<p class="step-q">🔗 ${L('Chain analysis','تحليل السلسلة')}</p><p class="step-h">${L('Understand what led to a strong emotion or a behaviour you want to change — link by link — so you can spot where a skill breaks the chain next time.','افهم اللي أدّى لشعور قوي أو سلوك عايز تغيّره — حلقة حلقة — عشان تعرف فين ممكن مهارة تكسر السلسلة المرة الجاية.')}</p>`;
    document.getElementById('chainNav').innerHTML=`<div class="navin"><button class="next" onclick="chainNext()">${L('Start','ابدأ')} ${LANG==='ar'?'◂':'▸'}</button></div>`;return;
  }
  if(id==='summary'){
    b.innerHTML=`<p class="step-q">${L('Your chain','سلسلتك')}</p><div class="sumbox">${esc(chainSummary())}</div>
      <button class="ctfopen" style="background:var(--accent2)" onclick="chainToNotes()">${L('＋ Add to '+(curKey===todayKey()?'today':'this day')+'’s notes','＋ ضيف لملاحظات '+(curKey===todayKey()?'النهارده':'اليوم ده'))}</button>
      <button class="canttell" onclick="chainShare()">${L('📲 Send to my therapist (WhatsApp)','📲 ابعتها للمعالج (واتساب)')}</button>
      <button class="canttell" onclick="navigator.clipboard.writeText(chainSummary()).then(()=>toast(t('copied')))">${L('📋 Copy','📋 نسخ')}</button>`;
    document.getElementById('chainNav').innerHTML=`<div class="navin"><button class="back" onclick="chainPrev()">${L('Back','رجوع')}</button><button class="next" onclick="closeChain()">${L('Done','تمام')}</button></div>`;return;
  }
  const S={
    behavior:[L('What happened?','اللي حصل؟'),L('Describe the problem behaviour or the emotional episode you want to understand.','اوصف السلوك المشكلة أو نوبة الشعور اللي عايز تفهمها.')],
    prompt:[L('Prompting event','الحدث المحفّز'),L('What set it off? Just the facts — where, when, who, what.','إيه اللي شغّله؟ الحقايق بس — فين، إمتى، مين، إيه.')],
    vuln:[L('Vulnerability factors','عوامل القابلية'),L('What made you more vulnerable that day? (tired, hungry, sick, stressed, earlier events)','إيه اللي خلاك أكتر قابلية في اليوم ده؟ (تعب، جوع، مرض، توتر، أحداث قبلها)')],
    links:[L('The chain of links','سلسلة الحلقات'),L('Step by step from trigger to behaviour: thoughts, feelings, body sensations, urges, actions.','خطوة بخطوة من المحفّز للسلوك: أفكار، مشاعر، أحاسيس جسم، رغبات، أفعال.')],
    conseq:[L('Consequences','النتائج'),L('What followed — short-term and long-term, for you and others.','اللي حصل بعدها — على المدى القصير والبعيد، ليك وللناس.')],
    skills:[L('Where could a skill break the chain?','فين ممكن مهارة تكسر السلسلة؟'),L('At which link could a skill have helped? Which will you use next time?','عند أنهي حلقة كانت مهارة هتساعد؟ هتستخدم أنهي مهارة المرة الجاية؟')],
    repair:[L('Repair','الإصلاح'),L('Anything to repair or put right — with yourself or others.','أي حاجة محتاجة إصلاح أو تصحيح — مع نفسك أو مع غيرك.')],
  }[id];
  b.innerHTML=`<p class="step-q">${S[0]}</p><p class="step-h">${S[1]}</p><textarea oninput="chain.${id}=this.value">${esc(chain[id])}</textarea>`;
  document.getElementById('chainNav').innerHTML=navMid;
}
function chainSummary(){const O=['🔗 '+L('Chain analysis','تحليل السلسلة')+' — '+pretty(curKey)];
  const add=(lab,v)=>{if(v&&v.trim())O.push('\n'+lab+': '+v.trim());};
  add(L('What happened','اللي حصل'),chain.behavior);add(L('Prompting event','الحدث المحفّز'),chain.prompt);
  add(L('Vulnerability','القابلية'),chain.vuln);add(L('Links','الحلقات'),chain.links);
  add(L('Consequences','النتائج'),chain.conseq);add(L('Skill to break the chain','مهارة تكسر السلسلة'),chain.skills);
  add(L('Repair','الإصلاح'),chain.repair);return O.join('\n');}
function chainToNotes(){state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+chainSummary();save();render();toast(t('addedNotes'));closeChain();}
function chainShare(){const num=(cfg.wa||'').replace(/[^0-9]/g,'');location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(chainSummary());}

/* ===================== Opposite Action ===================== */
const OPPO_ORDER=['intro','emotion','urge','plan','summary'];
let oppo={};
function openOppo(){oppo={i:0};document.getElementById('oppo').classList.add('show');renderOppo();}
function closeOppo(){document.getElementById('oppo').classList.remove('show');render();}
function oppoNext(){const id=OPPO_ORDER[oppo.i];if(id==='emotion'&&!oppo.emotion)return toast(L('Pick an emotion first','اختار شعور الأول'));if(oppo.i<OPPO_ORDER.length-1){oppo.i++;renderOppo();document.getElementById('oppoBody').scrollTop=0;}}
function oppoPrev(){if(oppo.i>0){oppo.i--;renderOppo();document.getElementById('oppoBody').scrollTop=0;}else closeOppo();}
function oppoEmo(n){oppo.emotion=n;renderOppo();}
function renderOppo(){
  const id=OPPO_ORDER[oppo.i],b=document.getElementById('oppoBody');
  document.getElementById('oppoProg').style.width=(oppo.i/(OPPO_ORDER.length-1)*100)+'%';
  document.getElementById('oppoTitle').textContent=L('Opposite Action','فعل العكس');
  const navMid=`<div class="navin"><button class="back" onclick="oppoPrev()">${L('Back','رجوع')}</button><button class="next" onclick="oppoNext()">${L('Next','التالي')} ${LANG==='ar'?'◂':'▸'}</button></div>`;
  if(id==='intro'){
    b.innerHTML=`<p class="step-q">🔄 ${L('Opposite Action','فعل العكس')}</p><p class="step-h">${L('When an emotion doesn’t fit the facts — or acting on it won’t help — you can change it by acting opposite to its urge, fully. Not sure if it fits? Check the Facts first.','لما الشعور مش مناسب للحقايق — أو التصرف عليه مش هيساعد — تقدر تغيّره بإنك تعمل عكس رغبته، بالكامل. مش متأكد إنه مناسب؟ راجع الحقائق الأول.')}</p>
      <button class="canttell" onclick="closeOppo();openCTF()">${L('🧭 Check the Facts first','🧭 راجع الحقائق الأول')}</button>`;
    document.getElementById('oppoNav').innerHTML=`<div class="navin"><button class="next" onclick="oppoNext()">${L('Start','ابدأ')} ${LANG==='ar'?'◂':'▸'}</button></div>`;return;
  }
  if(id==='emotion'){
    b.innerHTML=`<p class="step-q">${L('Which emotion?','أنهي شعور؟')}</p><div class="emogrid">`+PRIMARY.map(e=>`<button class="${oppo.emotion===e[0]?'on':''}" onclick="oppoEmo('${e[0]}')">${L(e[0],e[1])}</button>`).join('')+`</div>`;
    document.getElementById('oppoNav').innerHTML=navMid;return;
  }
  if(id==='urge'){
    b.innerHTML=`<p class="step-q">${L('What’s the urge?','إيه الرغبة؟')}</p><p class="step-h">${L('What is this emotion pushing you to do? (hide, attack, avoid, give up…)','الشعور ده بيدفعك تعمل إيه؟ (تختفي، تهجم، تتجنّب، تستسلم…)')}</p><textarea oninput="oppo.urge=this.value">${esc(oppo.urge)}</textarea>`;
    document.getElementById('oppoNav').innerHTML=navMid;return;
  }
  if(id==='plan'){
    b.innerHTML=`<p class="step-q">${L('Act opposite — all the way','اعمل العكس — للآخر')}</p><p class="step-h">${L('What’s the opposite of that urge? Then do it fully — posture, face, voice, words, and thoughts — and keep going until the emotion shifts.','إيه عكس الرغبة دي؟ وبعدين اعملها بالكامل — الوقفة، الوش، الصوت، الكلام، والأفكار — وكمّل لغاية ما الشعور يتغير.')}</p><textarea oninput="oppo.opposite=this.value">${esc(oppo.opposite)}</textarea>`;
    document.getElementById('oppoNav').innerHTML=navMid;return;
  }
  state.skills['2_2']=true;save();
  b.innerHTML=`<p class="step-q">${L('Your opposite-action plan','خطة فعل العكس')}</p><div class="sumbox">${esc(oppoSummary())}</div>
    <button class="ctfopen" style="background:var(--accent2)" onclick="oppoToNotes()">${L('＋ Add to '+(curKey===todayKey()?'today':'this day')+'’s notes','＋ ضيف لملاحظات '+(curKey===todayKey()?'النهارده':'اليوم ده'))}</button>
    <button class="canttell" onclick="oppoShare()">${L('📲 Send to my therapist (WhatsApp)','📲 ابعتها للمعالج (واتساب)')}</button>`;
  document.getElementById('oppoNav').innerHTML=`<div class="navin"><button class="back" onclick="oppoPrev()">${L('Back','رجوع')}</button><button class="next" onclick="closeOppo()">${L('Done','تمام')}</button></div>`;
}
function oppoSummary(){const p=PRIMARY.find(x=>x[0]===oppo.emotion);const O=['🔄 '+L('Opposite Action','فعل العكس')+' — '+pretty(curKey)];
  if(p)O.push(L('Emotion','الشعور')+': '+L(p[0],p[1]));
  if((oppo.urge||'').trim())O.push('\n'+L('Urge','الرغبة')+': '+oppo.urge.trim());
  if((oppo.opposite||'').trim())O.push('\n'+L('Opposite action','الفعل العكسي')+': '+oppo.opposite.trim());
  return O.join('\n');}
function oppoToNotes(){state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+oppoSummary();save();render();toast(t('addedNotes'));closeOppo();}
function oppoShare(){const num=(cfg.wa||'').replace(/[^0-9]/g,'');location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(oppoSummary());}

if(location.hash==='#archive')showArchive();
