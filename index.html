<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>DBT Skills Diary</title>
<link rel="manifest" href="manifest.json?v=2" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#6366f1; --accent2:#22c55e; --line:#334155;
    --m:#38bdf8; --i:#f472b6; --e:#fbbf24; --s:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{cursor:pointer;font-family:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#111827,#0f172acc);
    backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .htext{flex:1;min-width:0}
  h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  .date{color:var(--muted);font-size:13px;margin-top:2px}
  .nav{flex:none;display:flex;gap:6px}
  .nav button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    width:38px;height:38px;border-radius:10px;font-size:18px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 140px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .panel h2{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  label.scale{display:block;margin:0 0 10px;color:var(--muted);font-size:13px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .seg button{flex:1;min-width:36px;padding:10px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:15px;font-weight:600}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:10px;font:inherit;resize:vertical;min-height:64px}
  .group{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%}
  .group h3{margin:0;font-size:15px;font-weight:700}
  .group .count{margin-inline-start:auto;color:var(--muted);font-size:13px}
  .skill{display:flex;align-items:center;gap:12px;padding:12px 12px;margin:7px 0;
    background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;
    transition:background .12s,border-color .12s}
  .skill.on{background:#14321f;border-color:var(--accent2)}
  .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);
    display:grid;place-items:center;font-size:15px;color:#fff;transition:.12s}
  .skill.on .box{background:var(--accent2);border-color:var(--accent2)}
  .skill .name{font-size:15px;font-weight:600;flex:1;min-width:0}
  .skill .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .skillrow{display:flex;gap:8px;margin:7px 0}
  .skillrow .skill{flex:1;margin:0}
  .skillgo{flex:none;width:52px;border:1px solid var(--line);border-radius:12px;cursor:pointer;
    background:var(--card2);color:var(--accent);font-size:28px;line-height:1;font-weight:400;
    display:flex;align-items:center;justify-content:center}
  .skillgo:active{background:var(--accent);color:#fff}
  .bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0b1220ee;backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:640px;margin:0 auto}
  .bar button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-size:15px;font-weight:700;color:#fff}
  .wa{background:#25d366;color:#04331a}
  .em{background:var(--accent)}
  .more{background:var(--card2);color:var(--ink);flex:0 0 52px}
  .menu{position:fixed;inset:0;z-index:30;background:#0008;display:none}
  .menu.show{display:block}
  .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:10px 14px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;
    max-height:80vh;overflow:auto}
  .sheet button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);
    color:var(--ink);padding:16px 4px;font-size:16px}
  .sheet button:last-child{border-bottom:0}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;
    padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px;margin:2px 2px 0}
  /* archive */
  .arow{display:flex;align-items:center;gap:12px;padding:14px 12px;margin:8px 0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .arow .ad{flex:1}
  .arow .ad b{font-size:15px}
  .arow .ad small{display:block;color:var(--muted);font-size:12px}
  .pill{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:20px;
    padding:6px 10px;font-size:13px;font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  /* lock */
  .lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  .lock.show{display:flex}
  .lock h2{margin:0;font-weight:700}
  .lock input{font-size:28px;letter-spacing:8px;text-align:center;width:200px;padding:12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
  .lock button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700}
  .lock .err{color:#f87171;font-size:14px;min-height:18px}
  /* check-the-facts wizard */
  .ctf{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  .ctf.show{display:flex}
  .ctf .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ctf .top h2{margin:0;font-size:16px;flex:1}
  .ctf .x{background:var(--card2);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:18px}
  .prog{height:4px;background:var(--card2)}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .ctf .body{flex:1;overflow:auto;padding:18px 16px 20px;max-width:640px;margin:0 auto;width:100%}
  .ctf .step-q{font-size:20px;font-weight:700;margin:0 0 6px}
  .ctf .step-h{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
  .ctf textarea{min-height:90px}
  .ctf .lab{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .chips button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:20px;font-size:14px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .emogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .emogrid button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:16px 10px;border-radius:12px;font-size:16px;font-weight:600;text-align:start}
  .emogrid button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .iscale{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .iscale button{flex:1;min-width:30px;padding:14px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:16px;font-weight:700}
  .iscale button.on{color:#fff}
  .iscale button.lo.on{background:var(--accent2);border-color:var(--accent2)}
  .iscale button.hi.on{background:#ef4444;border-color:#ef4444}
  .canttell{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:13px;border-radius:10px;font-size:15px}
  .canttell.on{background:#ef4444;border-color:#ef4444;color:#fff}
  .alert{background:#3b1d1d;border:1px solid #7f1d1d;border-radius:12px;padding:16px;margin:6px 0 2px}
  .alert h3{margin:0 0 8px;font-size:16px;color:#fca5a5}
  .alert ul{margin:8px 0 0;padding-left:18px}.alert li{margin:5px 0}
  .ctf .nav{border-top:1px solid var(--line);padding:0}
  .ctf .navin{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto;width:100%;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .ctf .nav button{flex:1;border:0;border-radius:12px;padding:0;height:52px;line-height:1;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .ctf .nav .back{background:var(--card2);color:var(--ink);flex:0 0 90px}
  .ctf .nav .next{background:var(--accent);color:#fff}
  .fitbtn{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);
    color:var(--ink);padding:15px;border-radius:12px;font-size:15px;margin:8px 0;font-weight:600}
  .fitbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fitbtn small{display:block;font-weight:400;color:var(--muted);margin-top:3px}.fitbtn.on small{color:#dbeafe}
  .ctfopen{display:block;width:100%;margin:12px 0;background:linear-gradient(90deg,#f59e0b,#ef4444);
    color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700}
  .sumbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;
    white-space:pre-wrap;font-size:14px;line-height:1.5}
  .installbar{display:none;align-items:center;gap:10px;max-width:640px;margin:10px auto 0;
    background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;border-radius:14px;padding:12px 14px}
  .installbar.show{display:flex}
  .installbar .it{flex:1;font-size:14px;font-weight:600;line-height:1.35}
  .installbar .yes{background:#fff;color:#4f46e5;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px;white-space:nowrap}
  .installbar .no{background:#ffffff33;color:#fff;border:0;border-radius:10px;width:34px;height:38px;font-size:16px}
  .practicebtn{display:block;width:100%;margin:4px 0 6px;background:linear-gradient(90deg,#0ea5e9,#6366f1);
    color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700}
  .mindgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
  .mindtile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 10px;min-height:128px;color:var(--ink)}
  .mindtile:active{border-color:var(--accent);background:var(--card2)}
  .mindtile .me{font-size:38px;line-height:1}
  .mindtile b{font-size:14px;line-height:1.25;font-weight:700}
  .breathwrap{display:flex;flex-direction:column;align-items:center;padding:24px 0 6px}
  .breathcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#38bdf8,#6366f1);
    transform:scale(.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:800}
  .bphase{font-size:20px;font-weight:700;margin-top:20px;text-align:center;min-height:26px}
  .btimer{font-size:46px;font-weight:800;text-align:center;margin:14px 0}
  .sensecount{font-size:72px;font-weight:800;text-align:center;color:var(--accent);line-height:1}
  .sensebig{font-size:22px;font-weight:700;text-align:center;margin:18px 10px 24px;line-height:1.4}
  .steplist{margin:10px 0;padding:0;list-style:none}
  .steplist li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin:8px 0;font-size:15px;line-height:1.45}
  .langbtn{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    height:38px;min-width:42px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;line-height:1}
  [dir=rtl] .sumbox{text-align:right}
</style>
</head>
<body>

<div class="lock" id="lock">
  <h2 id="lockTitle">🔒 DBT Diary</h2>
  <div class="hint" id="lockHint">Enter your passcode</div>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" />
  <div class="err" id="pinErr"></div>
  <button id="unlockBtn" onclick="tryUnlock()">Unlock</button>
</div>

<header>
  <div class="htext">
    <h1 id="title">DBT Skills Diary</h1>
    <div class="date" id="dateLine"></div>
  </div>
  <div class="nav">
    <button class="langbtn" id="langBtn" onclick="toggleLang()">ع</button>
    <button onclick="step(-1)" title="Previous day">‹</button>
    <button onclick="step(1)" title="Next day">›</button>
  </div>
</header>

<div class="installbar" id="installBar">
  <span class="it" id="installText">Add this to your home screen for one-tap access</span>
  <button class="yes" id="installYes" onclick="doInstall()">Add</button>
  <button class="no" onclick="hideInstall()">✕</button>
</div>

<div class="wrap" id="dayView">
  <div class="panel">
    <label class="scale"><span id="scaleLabel">How much did you use skills today?</span> <span class="hint" id="scaleHint">(0 = not at all · 7 = used them and they helped)</span></label>
    <div class="seg" id="useScale"></div>
  </div>
  <div id="skills"></div>
  <div class="panel">
    <h2 id="notesH2">Notes for my therapist</h2>
    <textarea id="notes" placeholder="Anything you want to add — urges, wins, what was hard…"></textarea>
  </div>
</div>

<div class="wrap" id="archiveView" style="display:none">
  <div id="archiveList"></div>
</div>

<div class="bar" id="dayBar">
  <button class="wa" id="waBtn" onclick="share('wa')">WhatsApp</button>
  <button class="em" id="emailBtn" onclick="share('email')">Email</button>
  <button class="more" onclick="openMenu()">⋯</button>
</div>

<div class="bar" id="archiveBar" style="display:none">
  <button class="em" id="backBtn" onclick="showDay()">← Back to entry</button>
</div>

<div class="menu" id="menu" onclick="if(event.target.id==='menu')closeMenu()">
  <div class="sheet" id="menuSheet"></div>
</div>

<div class="menu" id="remMenu" onclick="if(event.target.id==='remMenu')closeRem()">
  <div class="sheet" id="remSheet"></div>
</div>

<!-- Check the Facts guided wizard -->
<div class="ctf" id="ctf">
  <div class="top">
    <button class="x" onclick="closeCTF()">✕</button>
    <h2 id="ctfTitle">Check the Facts</h2>
  </div>
  <div class="prog"><i id="ctfProg"></i></div>
  <div class="body" id="ctfBody"></div>
  <div class="nav" id="ctfNav"></div>
</div>

<!-- Radical Acceptance guided wizard -->
<div class="ctf" id="ra">
  <div class="top">
    <button class="x" onclick="raClose()">✕</button>
    <h2 id="raTitle">Radical Acceptance</h2>
  </div>
  <div class="prog"><i id="raProg"></i></div>
  <div class="body" id="raBody"></div>
  <div class="nav" id="raNav"></div>
</div>

<!-- Mindfulness practice -->
<div class="ctf" id="mind">
  <div class="top">
    <button class="x" onclick="closeMind()">✕</button>
    <h2 id="mindTitle">Practice</h2>
  </div>
  <div class="body" id="mindBody"></div>
  <div class="nav" id="mindNav"></div>
</div>

<input type="file" id="fileIn" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
// Each skill: [en, sub_en, ar, sub_ar]. English name (index 0) is the stable key used for wizard launchers.
const GROUPS = [
  { name:"Mindfulness", ar:"اليقظة", color:"var(--m)", skills:[
    ["Wise mind","","العقل الحكيم",""],
    ["Observe","just notice","لاحِظ","مجرد ملاحظة"],
    ["Describe","put words on, just the facts","اوصِف","حُط الكلام، الحقايق بس"],
    ["Participate","enter into the experience","شارِك","ادخل في التجربة"],
    ["Non-judgmental","","من غير أحكام",""],
    ["One-mindfully","one thing at a time","بتركيز","حاجة واحدة في المرة"],
    ["Effectiveness","focus on what works","بفعالية","ركّز على اللي بيجيب نتيجة"] ]},
  { name:"Interpersonal Effectiveness", ar:"فعالية العلاقات", color:"var(--i)", skills:[
    ["Figure out interpersonal goals","","حدّد أهدافك في العلاقة",""],
    ["DEAR","Describe, Express, Assert, Reinforce","DEAR","صِف، عبّر، أكّد، عزّز"],
    ["MAN-Mindful","Broken Record, Ignore Attacks","MAN ـ بتركيز","اسطوانة مشروخة، تجاهل الهجوم"],
    ["MAN","Appear confident, Negotiate","MAN","اظهر بثقة، تفاوض"],
    ["GIVE","Gentle, Interested, Validate, Easy manner","GIVE","لُطف، اهتمام، تصديق، أسلوب هادي"],
    ["FAST","Fair, no-Apologies, Stick to values, Truthful","FAST","عادل، من غير اعتذار، تمسّك بقيمك، صادق"],
    ["Attend to relationships","","اهتم بعلاقاتك",""] ]},
  { name:"Emotion Regulation", ar:"تنظيم المشاعر", color:"var(--e)", skills:[
    ["Describing emotions","","وصف المشاعر",""],
    ["Check the facts","","مراجعة الحقائق",""],
    ["Opposite-to-emotion action","","فعل العكس",""],
    ["Problem solving","","حل المشكلة",""],
    ["Accumulate positives","positive events or valued actions","اجمع الإيجابيات (Accumulate Positives)","أحداث إيجابية أو أفعال ليها قيمة"],
    ["Build Mastery","do something that makes you feel competent","الإتقان والتمكن (Build Mastery)","اعمل حاجة تحسّسك بالكفاءة"],
    ["Cope ahead","rehearse coping with a hard situation in advance","الاستعداد المسبق (Cope Ahead)","اتمرّن على التعامل مع موقف صعب قبل ما يحصل"],
    ["PLEASE","Physical ills, Eating, Avoid drugs, Sleep, Exercise","تقليل القابلية للانفعال (PLEASE)","آلام جسمانية، أكل، ابعد عن المكيفات، نوم، رياضة"],
    ["Mindfulness of current emotion","","ملاحظة المشاعر الحالية",""] ]},
  { name:"Survival & Acceptance", ar:"تجاوز المحن والقبول", color:"var(--s)", skills:[
    ["STOP","Stop, Take a step back, Observe, Proceed mindfully","قف (STOP)","قف، ارجع خطوة، لاحظ، كمّل بوعي"],
    ["TIP","Temperature, Intense exercise, Progressive relax","TIP","حرارة/تلج، تمرين عنيف، استرخاء العضلات"],
    ["Pros and Cons","","المميزات والعيوب",""],
    ["Distract / Self-soothe / Improve the moment","","التشتيت / تهدئة الذات / تحسين اللحظة",""],
    ["Radical Acceptance","","القبول الجذري",""],
    ["Willingness","","الاستعداد والتقبّل (Willingness)",""],
    ["Mindfulness of current thoughts","","ملاحظة الأفكار الحالية",""],
    ["Half-smiling","","نص ابتسامة",""],
    ["Willing hands","","الأيدي المتقبلة",""] ]},
];

const cfg = JSON.parse(localStorage.getItem('dbt_cfg')||'{}');
let curKey;        // 'YYYY-MM-DD' currently shown
let state = {};
let view = 'day';  // 'day' | 'archive'

/* ---------- i18n (en / ar) ---------- */
let LANG = cfg.lang || 'en';
const T = {
  appTitle:['DBT Skills Diary','مذكرة مهارات DBT'],
  archive:['Archive','الأرشيف'],
  allDays:['All saved days','كل الأيام المحفوظة'],
  today:['Today · ','النهارده · '],
  yesterday:['Yesterday · ','إمبارح · '],
  scaleLabel:['How much did you use skills today?','قد إيه استخدمت مهاراتك في اليوم ده؟'],
  scaleHint:['(0 = not at all · 7 = used them and they helped)','(٠ = ولا مرة · ٧ = استخدمتها وساعدتني)'],
  notesH2:['Notes for my therapist','ملاحظات للمعالج'],
  notesPh:['Anything you want to add — urges, wins, what was hard…','أي حاجة عايز تضيفها — رغبات، إنجازات، اللي كان صعب…'],
  whatsapp:['WhatsApp','واتساب'],
  email:['Email','إيميل'],

function t(k){return T[k][LANG==='ar'?1:0];}
function loc(){return LANG==='ar'?'ar-EG':undefined;}
function skName(s){return LANG==='ar'?(s[2]||s[0]):s[0];}
function skSub(s){return LANG==='ar'?(s[3]||''):(s[1]||'');}
function grName(g){return LANG==='ar'?g.ar:g.name;}
function L(en,ar){return LANG==='ar'?ar:en;}                 // inline bilingual string
function locItem(list,en){const f=list.find(x=>x[0]===en);return f?L(f[0],f[1]):en;}

function buildMenu(){
  const items=[['mInstall','menuInstall()'],['mArchive','showArchive()'],['mCopy',"share('copy')"],['mWa','setTherapist()'],['mEmail','setEmail()'],
    ['mReminder','openRem()'],['mSetPin','setPin()'],['mRemovePin','removePin()'],['mExport','exportAll()'],

function pad(n){return String(n).padStart(2,'0');}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// You log the previous day, so the app opens on yesterday by default.
function defaultKey(){return shiftKey(todayKey(),-1);}
function keyToDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function pretty(k){return keyToDate(k).toLocaleDateString(loc(),{weekday:'long',month:'short',day:'numeric',year:'numeric'});}
function prettyShort(k){return keyToDate(k).toLocaleDateString(loc(),{weekday:'short',month:'short',day:'numeric'});}

/* ---------- passcode ---------- */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  if(!cfg.pinHash){document.getElementById('lock').classList.remove('show');return;}
  document.getElementById('lock').classList.add('show');
  document.getElementById('pinInput').focus();
}
async function tryUnlock(){
  const v=document.getElementById('pinInput').value;
  if(await sha(v)===cfg.pinHash){document.getElementById('lock').classList.remove('show');
    document.getElementById('pinInput').value='';}
  else{document.getElementById('pinErr').textContent=t('wrongPin');}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
async function setPin(){const v=prompt(t('pinPrompt'));
  if(v){cfg.pinHash=await sha(v);localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('pinSet'));}closeMenu();}
function removePin(){delete cfg.pinHash;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('pinRemoved'));closeMenu();}

/* ---------- day load/save ---------- */
function load(){
  state=JSON.parse(localStorage.getItem('dbt_'+curKey)||'{}');
  if(!state.skills)state.skills={};
  render();
}
function save(){localStorage.setItem('dbt_'+curKey,JSON.stringify(state));}

function render(){
  const rel=curKey===todayKey()?t('today'):curKey===defaultKey()?t('yesterday'):'';
  document.getElementById('dateLine').textContent=rel+pretty(curKey);
  let seg='';for(let i=0;i<=7;i++)seg+=`<button class="${state.use==i?'on':''}" onclick="setUse(${i})">${i}</button>`;
  document.getElementById('useScale').innerHTML=seg;
  let html='';
  GROUPS.forEach((g,gi)=>{
    const done=g.skills.filter((_,si)=>state.skills[gi+'_'+si]).length;
    html+=`<div class="group"><span class="dot" style="background:${g.color}"></span>
      <h3>${grName(g)}</h3><span class="count">${done}/${g.skills.length}</span></div>`;
    if(gi===0)html+=`<button class="practicebtn" onclick="openMindPicker()">${L('🧘 Practice mindfulness','🧘 تمارين اليقظة')}</button>`;
    g.skills.forEach((s,si)=>{const id=gi+'_'+si,on=state.skills[id]?'on':'';const sub=skSub(s);
      const row=`<div class="skill ${on}" onclick="toggle('${id}')"><div class="box">${state.skills[id]?'✓':''}</div>
        <div class="name">${skName(s)}${sub?`<span class="sub">${sub}</span>`:''}</div></div>`;
      if(s[0]==='Check the facts'||s[0]==='Describing emotions'){
        html+=`<div class="skillrow">${row}<button class="skillgo" aria-label="Open guided walkthrough" onclick="launchCTF('${id}')">❯</button></div>`;
      } else if(s[0]==='Radical Acceptance'){
        html+=`<div class="skillrow">${row}<button class="skillgo" aria-label="Open Radical Acceptance walkthrough" onclick="launchRA('${id}')">❯</button></div>`;
      } else { html+=row; }
    });
  });
  document.getElementById('skills').innerHTML=html;
  document.getElementById('notes').value=state.notes||'';
}
function toggle(id){state.skills[id]=!state.skills[id];save();render();}
function setUse(n){state.use=n;save();render();}
document.getElementById('notes').addEventListener('input',e=>{state.notes=e.target.value;save();});
function step(d){curKey=shiftKey(curKey,d);load();window.scrollTo(0,0);}
function shiftKey(k,d){const dt=keyToDate(k);dt.setDate(dt.getDate()+d);
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}

function showDay(){view='day';if(location.hash)history.replaceState(null,'','./');document.getElementById('dayView').style.display='';
  document.getElementById('archiveView').style.display='none';
  document.getElementById('dayBar').style.display='flex';
  document.getElementById('archiveBar').style.display='none';
  document.getElementById('title').textContent=t('appTitle');
  curKey=defaultKey();load();window.scrollTo(0,0);}
function showArchive(){view='archive';closeMenu();
  if(location.hash!=='#archive')history.replaceState(null,'','#archive');
  document.getElementById('dayView').style.display='none';
  document.getElementById('archiveView').style.display='';
  document.getElementById('dayBar').style.display='none';
  document.getElementById('archiveBar').style.display='flex';
  document.getElementById('title').textContent=t('archive');
  document.getElementById('dateLine').textContent=t('allDays');
  const keys=Object.keys(localStorage).filter(k=>/^dbt_\d{4}-\d{2}-\d{2}$/.test(k))
    .map(k=>k.slice(4)).sort().reverse();
  const list=document.getElementById('archiveList');
  if(!keys.length){list.innerHTML=`<div class="empty">${t('noDays')}</div>`;return;}
  list.innerHTML=keys.map(k=>{
    const s=JSON.parse(localStorage.getItem('dbt_'+k)||'{}');const sk=s.skills||{};
    const n=Object.values(sk).filter(Boolean).length;
    const skw=LANG==='ar'?(n+' مهارة'):(n+' skill'+(n===1?'':'s'));
    return `<div class="arow" onclick="openArchiveDay('${k}')">
      <div class="ad"><b>${prettyShort(k)}</b><small>${skw} · ${s.notes?t('hasNotes'):'—'}</small></div>
      <div class="pill">${s.use!=null?s.use+'/7':'–'}</div></div>`;
  }).join('');
  window.scrollTo(0,0);
}
function openArchiveDay(k){view='day';document.getElementById('dayView').style.display='';
  document.getElementById('archiveView').style.display='none';
  document.getElementById('dayBar').style.display='flex';
  document.getElementById('archiveBar').style.display='none';
  document.getElementById('title').textContent=t('appTitle');
  curKey=k;load();window.scrollTo(0,0);}

/* ---------- summary + share ---------- */
function summary(){
  const sep=LANG==='ar'?'، ':', ';
  let out=t('sumTitle')+pretty(curKey)+'\n';
  if(state.use!=null)out+=t('sumUsed')+state.use+'/7\n';out+='\n';let any=false;
  GROUPS.forEach((g,gi)=>{const used=g.skills.filter((s,si)=>state.skills[gi+'_'+si]).map(s=>skName(s));
    if(used.length){any=true;out+=grName(g)+': '+used.join(sep)+'\n';}});
  if(!any)out+=t('sumNoSkills')+'\n';
  if(state.notes&&state.notes.trim())out+='\n'+t('sumNotes')+state.notes.trim()+'\n';
  return out;
}
function share(how){const text=summary();
  if(how==='wa'){const num=(cfg.wa||'').replace(/[^0-9]/g,'');
    location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(text);}
  else if(how==='email'){location.href='mailto:'+(cfg.email||'')+'?subject='+
    encodeURIComponent(t('emailSubject')+pretty(curKey))+'&body='+encodeURIComponent(text);}
  else if(how==='copy'){navigator.clipboard.writeText(text).then(()=>toast(t('copied')));closeMenu();}
}
function setTherapist(){const v=prompt(t('waPrompt'),cfg.wa||'');
  if(v!=null){cfg.wa=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('saved'));}closeMenu();}
function setEmail(){const v=prompt(t('emailPrompt'),cfg.email||'');
  if(v!=null){cfg.email=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('saved'));}closeMenu();}

function exportAll(){
  const data={};Object.keys(localStorage).filter(k=>k.startsWith('dbt_')).forEach(k=>data[k]=localStorage.getItem(k));
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'dbt-diary-backup-'+todayKey()+'.json');
  closeMenu();toast(t('backupDl'));

document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);
    Object.keys(data).forEach(k=>{if(k.startsWith('dbt_'))localStorage.setItem(k,data[k]);});
    toast(t('backupRestored'));showDay();}catch(_){toast(t('cantRead'));}};
  r.readAsText(f);e.target.value='';
});

function openMenu(){document.getElementById('menu').classList.add('show');}
function closeMenu(){document.getElementById('menu').classList.remove('show');}

  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ===================== Check the Facts (guided) ===================== */
// [en, ar] pairs — English (index 0) is the stored key; display localized.
const PRIMARY=[['Fear','الخوف'],['Sadness','الحزن'],['Shame','الخزي'],['Guilt','الذنب'],['Happiness','السعادة'],['Disgust','القرف / الاشمئزاز'],['Anger','الغضب']];
const BODY=[['Tight chest','صدر مضغوط'],['Racing heart','قلب بيدق بسرعة'],['Hot / flushed','سخونة / احمرار'],['Tense muscles','عضلات مشدودة'],['Shaky','رعشة'],['Stomach knot','معدة مقبوضة'],['Heavy','تقل'],['Short of breath','ضيق نفس'],['Restless','مش مستقر'],['Numb','تنميل / خدر']];
const URGES=[['Withdraw / hide','انسحب / اختفي'],['Lash out','أهجم'],['Run / escape','أجري / أهرب'],['Cry','عياط'],['Shut down','أنغلق'],['Avoid it','أتجنّب'],['Seek reassurance','أدوّر على طمأنة'],['Apologize','أعتذر'],['Check / control','أتحكّم / أراقب'],['Numb out','أخدّر نفسي']];
const ORDER=['intro','emotion','intensity','event','interp','body','urges','threat','catastrophe','fit','summary'];
let ctf={};

function openCTF(){ctf={step:'intro',bodyChips:[],urgeChips:[]};document.getElementById('ctf').classList.add('show');renderCTF();}
function launchCTF(id){state.skills[id]=true;save();render();openCTF();}
function closeCTF(){document.getElementById('ctf').classList.remove('show');render();}
function gotoStep(s){ctf.step=s;renderCTF();document.getElementById('ctfBody').scrollTop=0;}
function triggered(){return ctf.cantTell||ctf.intensity>=8;}

function ctfNext(){
  const s=ctf.step;
  if(s==='emotion'&&!ctf.emotion){return toast(L('Pick an emotion first','اختار شعور الأول'));}
  if(s==='intensity'&&ctf.intensity==null&&!ctf.cantTell){return toast(L('Tap a number, or “Can’t tell”','دوس رقم، أو «مش قادر أحدد»'));}
  if(s==='intensity'){if(triggered()){ctf.dtFrom='intensity';return gotoStep('dt');}return gotoStep('event');}
  if(s==='dt'){return gotoStep('event');}
  const i=ORDER.indexOf(s); if(i>=0&&i<ORDER.length-1)gotoStep(ORDER[i+1]);
}
function ctfPrev(){
  const s=ctf.step;
  if(s==='dt')return gotoStep(ctf.dtFrom||'intensity');
  if(s==='event')return gotoStep((triggered()||ctf.cantName)?'dt':'intensity');
  const i=ORDER.indexOf(s); if(i>0)gotoStep(ORDER[i-1]); else closeCTF();
}
function ctfEmo(n){ctf.emotion=n;ctf.cantName=false;renderCTF();}
function ctfCantName(){ctf.cantName=true;ctf.emotion=null;ctf.dtFrom='emotion';gotoStep('dt');}
function ctfInt(n){ctf.intensity=n;ctf.cantTell=false;renderCTF();}
function ctfCant(){ctf.cantTell=!ctf.cantTell;ctf.intensity=null;renderCTF();}
function ctfChip(field,label){const a=ctf[field];const i=a.indexOf(label);i>=0?a.splice(i,1):a.push(label);renderCTF();}
function ctfFit(v){ctf.fit=v;renderCTF();}

function setNav(html){document.getElementById('ctfNav').innerHTML=`<div class="navin">${html}</div>`;}
function nav(extra){
  const back=`<button class="back" onclick="ctfPrev()">${L('Back','رجوع')}</button>`;
  setNav(back+(extra||`<button class="next" onclick="ctfNext()">${L('Next ▸','التالي ◂')}</button>`));
}
function chips(field,list){return `<div class="chips">`+list.map(l=>
  `<button class="${ctf[field].includes(l[0])?'on':''}" onclick="ctfChip('${field}','${l[0]}')">${L(l[0],l[1])}</button>`).join('')+`</div>`;}

function renderCTF(){
  const b=document.getElementById('ctfBody'); const s=ctf.step;
  const idx=Math.max(0,ORDER.indexOf(s==='dt'?'intensity':s));
  document.getElementById('ctfProg').style.width=(idx/(ORDER.length-1)*100)+'%';
  const CHECK=['threat','catastrophe','fit'];
  document.getElementById('ctfTitle').textContent =
    (s==='intro'||s==='summary')?L('Describe + Check the Facts','اوصف + راجع الحقائق')
    :CHECK.includes(s)?L('Check the Facts','مراجعة الحقائق'):L('Describe the Emotion','وصف المشاعر');
  let h='';
  if(s==='intro'){
    h=`<p class="step-q">${L('Describe the emotion, then check the facts.','اوصف المشاعر، وبعدين راجع الحقائق.')}</p>
    <p class="step-h">${L('Two DBT skills in one (Linehan). First you <b>describe the emotion</b> — what set it off, the body sensations, the urges. Then you <b>check the facts</b> — does the emotion, and how strong it is, actually fit the situation, or fit your <i>interpretation</i> of it? A few minutes. Nothing is sent anywhere unless you choose to at the end.','مهارتين DBT في واحدة. الأول <b>توصف المشاعر</b> — إيه اللي حصل، أحاسيس الجسم، الرغبات. وبعدين <b>تراجع الحقائق</b> — هل الشعور، وقد إيه هو قوي، فعلاً مناسب للموقف، ولا مناسب لـ<i>تفسيرك</i> ليه؟ دقايق قليلة. مفيش حاجة بتتبعت لحد إلا لو اخترت في الآخر.')}</p>`;
    setNav(`<button class="next" onclick="ctfNext()">${L('Start ▸','ابدأ ◂')}</button>`);
  }
  else if(s==='emotion'){
    h=`<p class="step-q">${L('What is the emotion you want to check?','إيه الشعور اللي عايز تراجعه؟')}</p>
    <p class="step-h">${L('Pick the one that fits best. (DBT primary emotions.)','اختار اللي بيوصفك أكتر. (المشاعر الأساسية في DBT)')}</p>
    <div class="emogrid">`+PRIMARY.map(e=>`<button class="${ctf.emotion===e[0]?'on':''}" onclick="ctfEmo('${e[0]}')">${L(e[0],e[1])}</button>`).join('')+`</div>
    <button class="canttell ${ctf.cantName?'on':''}" onclick="ctfCantName()">${L('I can’t name what I’m feeling','مش عارف أسمّي اللي حاسس بيه')}</button>
    <div class="lab">${L('A more specific word for it (optional)','كلمة أدق ليه (اختياري)')}</div>

  else if(s==='interp'){

    nav();
  }
  else if(s==='body'){

    <textarea placeholder="${L('What you feel pulled to do or say…','اللي حاسس إنك متدفع تعمله أو تقوله…')}" oninput="ctf.urgeText=this.value">${ctf.urgeText||''}</textarea>`;

    <textarea placeholder="${L('The threat/danger I’m assuming is…','التهديد/الخطر اللي بفترضه هو…')}" oninput="ctf.threat=this.value">${ctf.threat||''}</textarea>
    <div class="lab">${L('How likely is it to actually happen? (0–100%)','قد إيه احتمال إنه يحصل فعلاً؟ (٠–١٠٠٪)')}</div>
    <input class="canttell" style="text-align:start" inputmode="numeric" placeholder="${L('e.g. 20%','مثلاً ٢٠٪')}" value="${ctf.threatProb||''}" oninput="ctf.threatProb=this.value">
    <div class="lab">${L('What other outcomes are possible?','إيه النهايات التانية الممكنة؟')}</div>
    <textarea placeholder="${L('Other things that could happen instead…','حاجات تانية ممكن تحصل بدالها…')}" oninput="ctf.otherOutcomes=this.value">${ctf.otherOutcomes||''}</textarea>`;
    nav();
  }
  else if(s==='catastrophe'){
    h=`<p class="step-q">${L('What’s the catastrophe — and could you cope?','إيه الكارثة — وهتقدر تتعامل؟')}</p>
    <p class="step-h">${L('Picture the worst case. Then picture yourself actually coping with it (problem-solving, coping ahead, or radical acceptance).','تخيّل أسوأ احتمال. وبعدين تخيّل نفسك بتتعامل معاه فعلاً (حل المشكلة، الاستعداد المسبق، أو القبول الجذري).')}</p>
    <textarea placeholder="${L('Worst case that could realistically happen…','أسوأ حاجة ممكن تحصل فعلاً…')}" oninput="ctf.catastrophe=this.value">${ctf.catastrophe||''}</textarea>
    <div class="lab">${L('How I could cope even if it happened','ازاي ممكن أتعامل حتى لو حصلت')}</div>
    <textarea placeholder="${L('I could handle it by…','أقدر أتصرف بـ…')}" oninput="ctf.coping=this.value">${ctf.coping||''}</textarea>`;
    nav();
  }
  else if(s==='fit'){
    const opt=(v,t,d)=>`<button class="fitbtn ${ctf.fit===v?'on':''}" onclick="ctfFit('${v}')">${t}<small>${d}</small></button>`;

    ${opt('partly',L('🟡 The emotion fits, but the intensity doesn’t','🟡 الشعور مناسب لكن الشدة لأ'),L('Real concern, but turned up too high → check the facts, then act opposite to the extra intensity.','قلق حقيقي بس متعلّي أوي → راجع الحقايق، وبعدين اعمل العكس للشدة الزيادة.'))}

    setNav(`<button class="back" onclick="ctfPrev()">${L('Back','رجوع')}</button><button class="next" onclick="closeCTF()">${L('Done','تمام')}</button>`);
    b.innerHTML=h;return;

  b.innerHTML=h;
}

function ctfSummary(){
  const sep=LANG==='ar'?'، ':', ';
  const O=[]; O.push(L('🧭 Check the Facts — ','🧭 مراجعة الحقائق — ')+pretty(curKey));
  const emoP=PRIMARY.find(p=>p[0]===ctf.emotion);
  let e=ctf.cantName?L('couldn’t name it','مش متسمّي'):(emoP?L(emoP[0],emoP[1]):(ctf.emotion||'—')); if(ctf.emotionWord)e+=' ('+ctf.emotionWord+')';
  O.push(L('Emotion: ','الشعور: ')+e+'  ·  '+L('Intensity: ','الشدة: ')+(ctf.cantTell?L('hard to tell','صعب التحديد'):(ctf.intensity!=null?ctf.intensity+'/10':'—')));
  const add=(lab,v)=>{if(v&&String(v).trim())O.push('\n'+lab+': '+String(v).trim());};
  add(L('What happened (just the facts)','اللي حصل (الحقايق بس)'),ctf.event);
  add(L('My interpretation','تفسيري'),ctf.interp);
  add(L('Other interpretations','تفسيرات تانية'),ctf.otherInterp);
  const body=[...(ctf.bodyChips||[]).map(x=>locItem(BODY,x)),ctf.bodyText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Body sensations','أحاسيس الجسم'),body);
  const urge=[...(ctf.urgeChips||[]).map(x=>locItem(URGES,x)),ctf.urgeText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Action urges','الرغبات الملحة'),urge);
  if((ctf.threat||'').trim()){let th=ctf.threat.trim();if(ctf.threatProb)th+='  ('+L('likelihood: ','الاحتمال: ')+ctf.threatProb+')';O.push('\n'+L('Threat I’m assuming: ','التهديد اللي بفترضه: ')+th);}
  add(L('Other possible outcomes','نهايات تانية ممكنة'),ctf.otherOutcomes);
  add(L('Worst case','أسوأ احتمال'),ctf.catastrophe);
  add(L('How I could cope','ازاي أقدر أتعامل'),ctf.coping);
  const fitTxt={fits:L('The emotion fits the facts.','المشاعر مناسبة للحقائق.'),partly:L('The emotion fits, but its intensity doesn’t.','المشاعر مناسبة لكن شدتها لأ.'),doesnt:L('The emotion does NOT fit the facts.','المشاعر مش مناسبة للحقائق.')}[ctf.fit];
  if(fitTxt)O.push('\n'+L('Conclusion: ','الخلاصة: ')+fitTxt);
  return O.join('\n');
}
function ctfToNotes(){
  const t=ctfSummary();
  state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+t;
  save();render();toast(t('addedNotes'));closeCTF();
}
function ctfShare(){
  const num=(cfg.wa||'').replace(/[^0-9]/g,'');
  location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(ctfSummary());
}

/* ===================== Radical Acceptance (guided) ===================== */
const RA_ORDER=['intro','observe','asis','causes','whole','opposite','cope','body','grief','worth','proscons','summary'];
let ra={};
function launchRA(id){state.skills[id]=true;save();render();raOpen();}
function raOpen(){ra={i:0,bodyChips:[]};document.getElementById('ra').classList.add('show');raRender();}
function raClose(){document.getElementById('ra').classList.remove('show');render();}
function raSetNav(html){document.getElementById('raNav').innerHTML=`<div class="navin">${html}</div>`;}
function raChip(l){const a=ra.bodyChips;const k=a.indexOf(l);k>=0?a.splice(k,1):a.push(l);raRender();}
function raWhole(){ra.wholeSelf=!ra.wholeSelf;raRender();}
function raNext(){const id=RA_ORDER[ra.i];
  if(id==='observe'&&!(ra.reality||'').trim())return toast(L('Name the reality you’re fighting','سمّي الواقع اللي بتحاربه'));
  if(ra.i<RA_ORDER.length-1){ra.i++;raRender();document.getElementById('raBody').scrollTop=0;}}
function raPrev(){if(ra.i>0){ra.i--;raRender();document.getElementById('raBody').scrollTop=0;}else raClose();}

function raRender(){
  const id=RA_ORDER[ra.i];
  document.getElementById('raProg').style.width=(ra.i/(RA_ORDER.length-1)*100)+'%';
  document.getElementById('raTitle').textContent=L('Radical Acceptance','القبول الجذري');
  let h='';
  if(id==='intro'){
    h=`<p class="step-q">${L('🌳 Radical Acceptance','🌳 القبول الجذري')}</p>
    <p class="step-h">${L('Accepting reality fully — <b>as it is, right now</b> — when it isn’t the life you want. It is <b>not</b> approval, <b>not</b> love, <b>not</b> giving up, and <b>not</b> being against change. It’s letting go of the <i>fight</i> with reality, so you stop adding suffering on top of pain.','إنك تتقبّل الواقع بالكامل — <b>زي ما هو دلوقتي</b> — حتى لو مش الحياة اللي عايزها. هو <b>مش</b> موافقة، <b>مش</b> حب، <b>مش</b> استسلام، و<b>مش</b> ضد التغيير. هو إنك تبطّل <i>تتعارك</i> مع الواقع، عشان متزوّدش معاناة فوق الألم.')}</p>`;
    raSetNav(`<button class="next" onclick="raNext()">${L('Start ▸','ابدأ ◂')}</button>`);return done(h);
  }
  if(id==='observe'){
    h=`<p class="step-q">${L('What reality are you fighting?','إيه الواقع اللي بتحاربه؟')}</p>
    <p class="step-h">${L('Notice where you’re stuck on “this shouldn’t be happening.” Name the fact you’re refusing or struggling to accept.','لاحظ إنت فين عالق في «ده مكنش المفروض يحصل». سمّي الحقيقة اللي رافض أو بتتصعّب تتقبلها.')}</p>
    <textarea placeholder="${L('The thing I can’t / won’t accept is…','الحاجة اللي مش قادر/مش عايز أتقبلها هي…')}" oninput="ra.reality=this.value">${ra.reality||''}</textarea>`;}
  else if(id==='asis'){
    h=`<p class="step-q">${L('Reality is just as it is.','الواقع زي ما هو.')}</p>
    <p class="step-h">${L('The facts are already true, whether or not you approve. Remind yourself — in your own words.','الحقايق بقت حقيقة فعلاً، سواء وافقت أو لأ. فكّر نفسك — بكلامك إنت.')}</p>
    <textarea placeholder="${L('e.g. “I can’t change that this already happened. It is what it is right now.”','مثلاً: «مقدرش أغيّر إن ده حصل خلاص. هو كده دلوقتي.»')}" oninput="ra.ownWords=this.value">${ra.ownWords||''}</textarea>`;}
  else if(id==='causes'){
    h=`<p class="step-q">${L('What caused this reality?','إيه أسباب الواقع ده؟')}</p>
    <p class="step-h">${L('Every reality has a chain of causes — given them, it couldn’t be otherwise. Seeing the causes makes it easier to accept (not approve).','كل واقع ليه سلسلة أسباب — بسببها، مكنش ممكن يبقى غير كده. إنك تشوف الأسباب بيسهّل التقبّل (مش الموافقة).')}</p>
    <textarea placeholder="${L('The things that led to this…','الحاجات اللي أدّت لده…')}" oninput="ra.causes=this.value">${ra.causes||''}</textarea>`;}
  else if(id==='whole'){
    h=`<p class="step-q">${L('Accept with your whole self.','اتقبّل بكل كيانك.')}</p>

    <button class="canttell ${ra.wholeSelf?'on':''}" onclick="raWhole()">${ra.wholeSelf?'✓ ':''}${L('I took a moment to practice this','أخدت لحظة وعملت كده')}</button>`;}
  else if(id==='opposite'){
    h=`<p class="step-q">${L('Practice opposite action.','اعمل العكس.')}</p>
    <p class="step-h">${L('Fighting reality urges you to tense up, avoid, or lash out. The opposite is to <i>act as if you’ve already accepted it</i>. What would “acting accepted” look like right now?','محاربة الواقع بتدفعك تتشنّج أو تتجنّب أو تهجم. العكس هو إنك <i>تتصرّف كأنك متقبّله خلاص</i>. «التصرف كأنك متقبّل» هيبقى شكله إيه دلوقتي؟')}</p>

  else if(id==='cope'){
    h=`<p class="step-q">${L('Cope ahead.','استعد مسبقًا.')}</p>
    <p class="step-h">${L('Picture this reality continuing, or coming up again. Rehearse handling it skilfully.','تخيّل الواقع ده مستمر، أو بييجي تاني. اتمرّن إنك تتعامل معاه بمهارة.')}</p>
    <textarea placeholder="${L('If it stays this way / happens again, I’ll cope by…','لو فضل كده / حصل تاني، هتعامل بـ…')}" oninput="ra.copeAhead=this.value">${ra.copeAhead||''}</textarea>`;}
  else if(id==='body'){
    h=`<p class="step-q">${L('Attend to the body.','اهتم بالجسم.')}</p>
    <p class="step-h">${L('Where do you feel the resistance or the pain? Notice it without fighting it.','بتحس بالمقاومة أو الألم فين في جسمك؟ لاحظه من غير ما تحاربه.')}</p>
    <div class="chips">`+BODY.map(l=>`<button class="${ra.bodyChips.includes(l[0])?'on':''}" onclick="raChip('${l[0]}')">${L(l[0],l[1])}</button>`).join('')+`</div>
    <textarea placeholder="${L('Anything else you notice in your body…','أي حاجة تانية بتلاحظها في جسمك…')}" oninput="ra.bodyText=this.value">${ra.bodyText||''}</textarea>`;}
  else if(id==='grief'){
    h=`<p class="step-q">${L('Allow the feelings to rise.','سيب المشاعر تطلع.')}</p>
    <p class="step-h">${L('When you stop fighting, disappointment, sadness or grief often come. Let them be here — they’re part of accepting.','لما تبطّل تحارب، بييجي إحباط أو حزن أو أسى. سيبهم يكونوا موجودين — دول جزء من التقبّل.')}</p>
    <textarea placeholder="${L('What rises when I stop fighting…','اللي بيطلع لما أبطّل أحارب…')}" oninput="ra.grief=this.value">${ra.grief||''}</textarea>`;}
  else if(id==='worth'){
    h=`<p class="step-q">${L('Life can be worth living, even with pain.','الحياة ممكن تستاهل، حتى مع الألم.')}</p>
    <p class="step-h">${L('Name something that still makes life worth living — even now, even small.','سمّي حاجة لسه بتخلي الحياة تستاهل — حتى دلوقتي، حتى لو صغيرة.')}</p>
    <textarea placeholder="${L('Even with this, life is still worth living because…','حتى مع ده، الحياة لسه تستاهل عشان…')}" oninput="ra.worth=this.value">${ra.worth||''}</textarea>`;}
  else if(id==='proscons'){
    h=`<p class="step-q">${L('Pros and cons.','المميزات والعيوب.')}</p>
    <p class="step-h">${L('Weigh accepting reality against resisting it.','وازن بين إنك تتقبّل الواقع وبين إنك تقاومه.')}</p>
    <div class="lab">${L('Pros of accepting reality','مميزات إنك تتقبّل الواقع')}</div>
    <textarea placeholder="${L('What I gain by accepting…','اللي بكسبه لما أتقبّل…')}" oninput="ra.pros=this.value">${ra.pros||''}</textarea>
    <div class="lab">${L('Cons of resisting / refusing to accept','عيوب إنك تقاوم / ترفض التقبّل')}</div>
    <textarea placeholder="${L('What it costs me to keep fighting it…','اللي بيكلّفني إني أفضل أحارب…')}" oninput="ra.cons=this.value">${ra.cons||''}</textarea>`;}
  else if(id==='summary'){
    state.skills['3_4']=true;state.skills['3_2']=true;save();  // Radical Acceptance + Pros and Cons
    h=`<p class="step-q">${L('Here’s your reflection','دي خلاصتك')}</p>
    <div class="sumbox">${raSummary().replace(/</g,'&lt;')}</div>
    <button class="ctfopen" style="background:var(--accent2)" onclick="raToNotes()">${L('＋ Add to '+(curKey===todayKey()?'today':'this day')+'’s notes','＋ ضيف لملاحظات '+(curKey===todayKey()?'النهارده':'اليوم ده'))}</button>
    <button class="canttell" onclick="raShare()">${L('📲 Send this to my therapist (WhatsApp)','📲 ابعتها للمعالج (واتساب)')}</button>
    <button class="canttell" onclick="navigator.clipboard.writeText(raSummary()).then(()=>toast(t('copied')))">${L('📋 Copy','📋 نسخ')}</button>`;
    raSetNav(`<button class="back" onclick="raPrev()">${L('Back','رجوع')}</button><button class="next" onclick="raClose()">${L('Done','تمام')}</button>`);
    return done(h);
  }
  raSetNav(`<button class="back" onclick="raPrev()">${L('Back','رجوع')}</button><button class="next" onclick="raNext()">${L('Next ▸','التالي ◂')}</button>`);
  done(h);
  function done(html){document.getElementById('raBody').innerHTML=html;}
}

function raSummary(){
  const sep=LANG==='ar'?'، ':', ';
  const O=[L('🌳 Radical Acceptance — ','🌳 القبول الجذري — ')+pretty(curKey)];
  const add=(lab,v)=>{if(v&&String(v).trim())O.push('\n'+lab+': '+String(v).trim());};
  add(L('Reality I’m accepting','الواقع اللي بتقبله'),ra.reality);
  add(L('In my own words','بكلامي أنا'),ra.ownWords);
  add(L('Causes','الأسباب'),ra.causes);
  if(ra.wholeSelf)O.push('\n'+L('Practised accepting with the whole self (breath / half-smile / willing hands).','اتمرّنت على التقبّل بكل الكيان (نفس / نص ابتسامة / أيدي متقبلة).'));
  add(L('Opposite action','التصرف العكسي'),ra.opposite);
  add(L('Cope ahead','الاستعداد المسبق'),ra.copeAhead);
  const body=[...(ra.bodyChips||[]).map(x=>locItem(BODY,x)),ra.bodyText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Body sensations','أحاسيس الجسم'),body);
  add(L('Feelings I let rise','المشاعر اللي سيبتها تطلع'),ra.grief);
  add(L('Still worth living','لسه تستاهل'),ra.worth);
  add(L('Pros of accepting','مميزات التقبّل'),ra.pros);
  add(L('Cons of resisting','عيوب المقاومة'),ra.cons);
  return O.join('\n');
}
function raToNotes(){state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+raSummary();
  save();render();toast(t('addedNotes'));raClose();}
function raShare(){const num=(cfg.wa||'').replace(/[^0-9]/g,'');
  location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(raSummary());}

/* ---------- install / add to home screen ---------- */
let deferredPrompt=null;
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function maybeShowInstall(){
  if(cfg.hideInstall||isStandalone())return;
  const bar=document.getElementById('installBar'),yes=document.getElementById('installYes');
  if(deferredPrompt){yes.style.display='';document.getElementById('installText').textContent=t('installText');bar.classList.add('show');}
  else if(isIOS()){yes.style.display='none';document.getElementById('installText').textContent=t('installIOS');bar.classList.add('show');}
}
function hideInstall(){cfg.hideInstall=true;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));document.getElementById('installBar').classList.remove('show');}
async function doInstall(){if(!deferredPrompt){toast(isIOS()?t('installIOS'):t('installManual'));return;}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;hideInstall();}
function menuInstall(){closeMenu();if(deferredPrompt)return doInstall();toast(isStandalone()?t('installed'):isIOS()?t('installIOS'):t('installManual'));}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;maybeShowInstall();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;hideInstall();});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

/* ---------- daily push reminder ---------- */
const WORKER_URL='https://dbt-diary-reminder.amrabdelwahab.workers.dev';
const VAPID_PUBLIC='BHw5X_AeAf4KDA1ylK313KCurAAMsyfXhX5XDh-C73sOUqDHumfL6xyYY-IUwH_PC6taW5gGRDqMfw4EBya_rkA';
function urlB64ToUint8(b){const pad='='.repeat((4-b.length%4)%4);const s=(b+pad).replace(/-/g,'+').replace(/_/g,'/');const r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}
async function openRem(){closeMenu();const v=cfg.remTime||'09:00';
  let on=!!cfg.remOn;
  try{const reg=await navigator.serviceWorker.ready;on=!!(await reg.pushManager.getSubscription());}catch(_){}
  document.getElementById('remSheet').innerHTML=
    `<h2 style="margin:6px 4px 2px;font-size:18px">${t('remTitle')}</h2>
     <p class="hint" style="margin:0 4px 14px">${on?(t('remOnAt')+' '+v):t('remHint')}</p>
     <input type="time" id="remTime" value="${v}" style="width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:14px;border-radius:10px;font:inherit;font-size:20px;text-align:center;margin-bottom:12px">
     <button onclick="enablePush()" style="display:block;width:100%;background:var(--accent2);color:#04331a;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;margin-bottom:8px">${on?t('remUpdate'):t('remEnable')}</button>
     ${on?`<button onclick="disablePush()" style="display:block;width:100%;background:#3b1d1d;color:#fca5a5;border:1px solid #7f1d1d;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin-bottom:8px">${t('remOff')}</button>`:''}
     <button onclick="closeRem()" style="display:block;width:100%;background:var(--card2);color:var(--ink);border:0;border-radius:12px;padding:13px;font-size:15px">${t('mClose')}</button>`;
  document.getElementById('remMenu').classList.add('show');}
function closeRem(){document.getElementById('remMenu').classList.remove('show');}
async function disablePush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){await fetch(WORKER_URL+'/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe();}
    cfg.remOn=false;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));
    closeRem();toast(t('pushOff'));
  }catch(e){toast(t('pushErr')+(e.message||''));}
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){return toast(t('pushUnsupported'));}
  if(isIOS()&&!isStandalone()){closeRem();return toast(t('pushIOSInstall'));}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast(t('pushBlocked'));
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    const time=(document.getElementById('remTime')||{}).value||'09:00';
    const tz=-new Date().getTimezoneOffset();  // fallback fixed offset
    let tzName='';try{tzName=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(_){}
    const r=await fetch(WORKER_URL+'/subscribe',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({sub:sub.toJSON?sub.toJSON():sub,time,tz,tzName,lang:LANG})});
    if(!r.ok)throw new Error('server '+r.status);
    cfg.remTime=time;cfg.remOn=true;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));
    closeRem();toast(t('pushOn'));
  }catch(e){toast(t('pushErr')+(e.message||''));}
}

/* ===================== Mindfulness practice ===================== */
// type: breath | timer | senses | steps. skill: id to mark on Done. yt: YouTube id to embed. ytq: search query.
const EXERCISES=[
  { id:'box', emoji:'🌬️', skill:'0_5', type:'breath',
    title:['Box breathing','تنفّس الصندوق'],
    desc:['Calm your body: in 4 · hold 4 · out 4 · hold 4','هدّي جسمك: شهيق ٤ · ثبات ٤ · زفير ٤ · ثبات ٤'],
    phases:[['Breathe in','شهيق',4,'in'],['Hold','ثبات',4,'hold'],['Breathe out','زفير',4,'out'],['Hold','ثبات',4,'hold']],
    ytq:'box breathing 4-4-4-4 guided' },
  { id:'senses', emoji:'🖐️', skill:'0_1', type:'senses',
    title:['5-4-3-2-1 grounding','Grounding 5-4-3-2-1'],
    desc:['Anchor to now through your senses','اربط نفسك باللحظة عن طريق حواسك'],
    steps:[['5 things you can see','٥ حاجات تقدر تشوفها'],['4 things you can touch','٤ حاجات تقدر تلمسها'],
      ['3 things you can hear','٣ حاجات تقدر تسمعها'],['2 things you can smell','٢ حاجة تقدر تشمّها'],['1 thing you can taste','١ حاجة تقدر تتذوقها']],
    ytq:'5-4-3-2-1 grounding technique' },
  { id:'breath', emoji:'🫁', skill:'0_1', type:'timer', dur:120,
    title:['Observe your breath','لاحظ نفسك'],
    desc:['Rest attention on the breath; return gently when it wanders','حط انتباهك على النفس؛ ارجع بهدوء لما يسرح'],
    steps:[['Notice the breath coming in and going out','لاحظ النفس وهو داخل وخارج'],
      ['When your mind wanders, gently bring it back','لما عقلك يسرح، رجّعه بهدوء'],
      ['No need to control it — just watch','مش لازم تتحكم فيه — بس راقبه']],
    ytq:'mindful breathing meditation 2 minutes' },
  { id:'bodyscan', emoji:'🧎', skill:'0_1', type:'timer', dur:180,
    title:['Body scan','مسح الجسم'],
    desc:['Move attention slowly from head to toe','حرّك انتباهك ببطء من الراس للقدم'],
    steps:[['Start at the top of your head','ابدأ من أعلى راسك'],
      ['Move down slowly — face, neck, shoulders, arms, chest, legs…','انزل بالراحة — الوش، الرقبة، الكتفين، الذراعين، الصدر، الرجلين…'],
      ['Notice sensations without judging; soften where you can','لاحظ الأحاسيس من غير حكم؛ ليّن اللي تقدر عليه']],
    ytq:'short body scan meditation guided' },
  { id:'leaves', emoji:'🍃', skill:'0_1', type:'timer', dur:120,
    title:['Leaves on a stream','أوراق على نهر'],
    desc:['Let thoughts float by instead of holding on','سيب أفكارك تعدّي بدل ما تمسكها'],
    steps:[['Picture a gentle stream with leaves floating by','تخيّل نهر هادي وعليه أوراق بتعدّي'],
      ['Place each thought on a leaf and watch it drift away','حط كل فكرة على ورقة وسيبها تروح'],
      ['If you get carried off, come back to the stream','لو سرحت، ارجع للنهر']],
    ytq:'leaves on a stream defusion exercise' },
  { id:'wise', emoji:'☯️', skill:'0_0', type:'breath',
    title:['Wise Mind breathing','تنفّس العقل الحكيم'],
    desc:['In “Wise”, out “Mind” — settle into the still point','شهيق «حكيم»، زفير «عقل» — استقر في نقطة السكون'],
    phases:[['Breathe in — “Wise”','شهيق — «حكيم»',4,'in'],['Breathe out — “Mind”','زفير — «عقل»',6,'out']],
    ytq:'wise mind meditation dbt' },
  { id:'object', emoji:'🔍', skill:'0_1', type:'timer', dur:120,
    title:['Observe one thing','لاحظ حاجة واحدة'],
    desc:['Pick an object and explore it with your senses','اختار حاجة واستكشفها بحواسك'],
    steps:[['Pick a small object near you','اختار حاجة صغيرة جنبك'],
      ['Explore its colour, shape, texture, weight','استكشف لونها، شكلها، ملمسها، وزنها'],
      ['When words or judgments come, return to just sensing','لما ييجي كلام أو حكم، ارجع لمجرد الإحساس']],
    ytq:'mindful observation exercise object' },
  { id:'participate', emoji:'💃', skill:'0_3', type:'steps',
    title:['Throw yourself in','اندمج بالكامل'],
    desc:['Do one activity fully — become one with it','اعمل نشاط واحد بالكامل — وكن واحد معاه'],
    steps:[['Pick one simple activity (walk, wash dishes, dance)','اختار نشاط بسيط (مشي، غسيل، رقص)'],
      ['Throw yourself into it 100% — let go of watching yourself','اندمج فيه ١٠٠٪ — سيب مراقبة نفسك'],
      ['When you drift into thinking, dive back into doing','لما تسرح في التفكير، ارجع للفعل']],
    ytq:'participate fully mindfulness dbt' },
];
let mind={};
function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function openMindPicker(){mind={};document.getElementById('mind').classList.add('show');renderMindPicker();}
function closeMind(){clearInterval(mind.iv);document.getElementById('mind').classList.remove('show');render();}
function renderMindPicker(){
  clearInterval(mind.iv);
  document.getElementById('mindTitle').textContent=L('Mindfulness practice','تمارين اليقظة');
  document.getElementById('mindBody').innerHTML='<div class="mindgrid">'+EXERCISES.map((ex,i)=>
    `<button class="mindtile" onclick="openMindEx(${i})"><span class="me">${ex.emoji}</span><b>${L(ex.title[0],ex.title[1])}</b></button>`).join('')+'</div>';
  document.getElementById('mindNav').innerHTML=`<div class="navin"><button class="next" onclick="closeMind()">${L('Close','إغلاق')}</button></div>`;
}
function ytSearch(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
function openMindEx(i){clearInterval(mind.iv);mind.ex=EXERCISES[i];mind.bi=0;mind.si=0;mind.rem=mind.ex.dur||0;mind.running=false;renderMindEx();}
function renderMindEx(){
  const ex=mind.ex;document.getElementById('mindTitle').textContent=L(ex.title[0],ex.title[1]);
  let h=`<p class="step-q">${ex.emoji} ${L(ex.title[0],ex.title[1])}</p><p class="step-h">${L(ex.desc[0],ex.desc[1])}</p>`;
  if(ex.type==='breath'){
    h+=`<div class="breathwrap"><div class="breathcircle" id="mCircle"><span id="mCount"></span></div>
      <div class="bphase" id="mPhase">${L('Tap start','دوس ابدأ')}</div></div>
      <button class="ctfopen" style="background:var(--accent)" id="mStart" onclick="toggleBreath()">${L('Start','ابدأ')}</button>`;
  } else if(ex.type==='timer'){
    h+=`<ul class="steplist">`+ex.steps.map(s=>`<li>${L(s[0],s[1])}</li>`).join('')+`</ul>
      <div class="btimer" id="mTimer">${fmt(mind.rem)}</div>
      <button class="ctfopen" style="background:var(--accent)" id="mStart" onclick="toggleTimer()">${L('Start','ابدأ')}</button>`;
  } else if(ex.type==='senses'){
    h+=`<div class="sensecount" id="mSenseN">${ex.steps.length-mind.si}</div>
      <div class="sensebig" id="mSenseT">${L(ex.steps[mind.si][0],ex.steps[mind.si][1])}</div>
      <button class="ctfopen" style="background:var(--accent)" id="mNext" onclick="nextSense()">${mind.si<ex.steps.length-1?L('Next','التالي'):L('Finish','خلصت')}</button>`;
  } else {
    h+=`<ul class="steplist">`+ex.steps.map(s=>`<li>${L(s[0],s[1])}</li>`).join('')+`</ul>`;
  }
  if(ex.yt){h+=`<div style="margin-top:14px;border-radius:12px;overflow:hidden"><iframe width="100%" height="200" src="https://www.youtube.com/embed/${ex.yt}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;}
  else if(ex.ytq){h+=`<a href="${ytSearch(ex.ytq)}" target="_blank" rel="noopener" class="ctfopen" style="background:#ef4444;text-decoration:none;text-align:center;box-sizing:border-box">${L('▶ Watch a guided version','▶ شوف نسخة موجّهة بالفيديو')}</a>`;}
  document.getElementById('mindBody').innerHTML=h;
  document.getElementById('mindNav').innerHTML=`<div class="navin"><button class="back" onclick="renderMindPicker()">${L('Back','رجوع')}</button><button class="next" onclick="doneMind()">${L('Done','تمام')}</button></div>`;
}
function toggleBreath(){
  if(mind.running){mind.running=false;clearInterval(mind.iv);document.getElementById('mStart').textContent=L('Resume','استكمال');return;}
  mind.running=true;document.getElementById('mStart').textContent=L('Pause','إيقاف مؤقت');runPhase();
}
function runPhase(){
  if(!mind.running)return;const ph=mind.ex.phases[mind.bi];const secs=ph[2],mode=ph[3];
  const c=document.getElementById('mCircle');if(!c)return;
  c.style.transition='transform '+secs+'s '+(mode==='hold'?'linear':'ease-in-out');
  if(mode==='in')c.style.transform='scale(1)';else if(mode==='out')c.style.transform='scale(.55)';
  document.getElementById('mPhase').textContent=L(ph[0],ph[1]);
  let rem=secs;const cn=document.getElementById('mCount');cn.textContent=rem;
  clearInterval(mind.iv);mind.iv=setInterval(()=>{rem--;cn.textContent=rem>0?rem:'';
    if(rem<=0){clearInterval(mind.iv);mind.bi=(mind.bi+1)%mind.ex.phases.length;runPhase();}},1000);
}
function toggleTimer(){
  const sb=document.getElementById('mStart');
  if(mind.running){mind.running=false;clearInterval(mind.iv);sb.textContent=L('Resume','استكمال');return;}
  mind.running=true;sb.textContent=L('Pause','إيقاف مؤقت');clearInterval(mind.iv);
  mind.iv=setInterval(()=>{mind.rem--;const el=document.getElementById('mTimer');if(el)el.textContent=fmt(mind.rem);
    if(mind.rem<=0){clearInterval(mind.iv);mind.running=false;if(el)el.textContent=L('Done 🌸','تمام 🌸');if(sb)sb.style.display='none';}},1000);
}
function nextSense(){const ex=mind.ex;if(mind.si>=ex.steps.length-1)return doneMind();
  mind.si++;document.getElementById('mSenseN').textContent=ex.steps.length-mind.si;
  document.getElementById('mSenseT').textContent=L(ex.steps[mind.si][0],ex.steps[mind.si][1]);
  if(mind.si===ex.steps.length-1)document.getElementById('mNext').textContent=L('Finish','خلصت');}
function doneMind(){clearInterval(mind.iv);if(mind.ex&&mind.ex.skill){state.skills[mind.ex.skill]=true;save();render();}
  toast(L('Nice practice 🌸','تمرين جميل 🌸'));closeMind();}

curKey=defaultKey();load();applyLang();gate();
if(location.hash==='#archive')showArchive();
</script>
