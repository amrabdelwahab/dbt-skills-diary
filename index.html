<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>DBT Skills Diary</title>
<link rel="manifest" href="manifest.json?v=2" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#6366f1; --accent2:#22c55e; --line:#334155;
    --m:#38bdf8; --i:#f472b6; --e:#fbbf24; --s:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{cursor:pointer;font-family:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#111827,#0f172acc);
    backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .htext{flex:1;min-width:0}
  h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  .date{color:var(--muted);font-size:13px;margin-top:2px}
  .nav{flex:none;display:flex;gap:6px}
  .nav button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    width:38px;height:38px;border-radius:10px;font-size:18px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 140px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  .panel h2{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  label.scale{display:block;margin:0 0 10px;color:var(--muted);font-size:13px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .seg button{flex:1;min-width:36px;padding:10px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:15px;font-weight:600}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:10px;font:inherit;resize:vertical;min-height:64px}
  .group{margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%}
  .group h3{margin:0;font-size:15px;font-weight:700;min-width:0}
  .group .count{flex:none;color:var(--muted);font-size:13px}
  .ghinfo{background:none;border:0;color:var(--muted);font-size:17px;padding:0;line-height:1}
  .ghinfo:active{color:var(--accent)}
  .ghtrail{flex:none;margin-inline-start:auto;display:flex;align-items:center;gap:8px}
  .ghchips{flex:none;display:flex;gap:6px;margin-inline-start:4px}
  .ghchip{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:16px;
    padding:5px 9px;font-size:14px;line-height:1;display:inline-flex;align-items:center}
  .ghchip:active{background:var(--accent);border-color:var(--accent)}
  .skill{display:flex;align-items:center;gap:12px;padding:12px 12px;margin:7px 0;
    background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;
    transition:background .12s,border-color .12s}
  .skill.on{background:#14321f;border-color:var(--accent2)}
  .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);
    display:grid;place-items:center;font-size:15px;color:#fff;transition:.12s}
  .skill.on .box{background:var(--accent2);border-color:var(--accent2)}
  .skill .name{font-size:15px;font-weight:600;flex:1;min-width:0}
  .skill .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .skillrow{display:flex;gap:8px;margin:7px 0}
  .skillrow .skill{flex:1;margin:0}
  .skillgo{flex:none;width:52px;border:1px solid var(--line);border-radius:12px;cursor:pointer;
    background:var(--card2);color:var(--accent);font-size:28px;line-height:1;font-weight:400;
    display:flex;align-items:center;justify-content:center}
  .skillgo:active{background:var(--accent);color:#fff}
  .bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0b1220ee;backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:640px;margin:0 auto}
  .bar button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-size:15px;font-weight:700;color:#fff}
  .wa{background:#25d366;color:#04331a}
  .em{background:var(--accent)}
  .more{background:var(--card2);color:var(--ink);flex:0 0 52px}
  .menu{position:fixed;inset:0;z-index:30;background:#0008;display:none}
  .menu.show{display:block}
  .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:10px 14px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;
    max-height:80vh;overflow:auto}
  .sheet button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);
    color:var(--ink);padding:16px 4px;font-size:16px}
  .sheet button:last-child{border-bottom:0}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;
    padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px;margin:2px 2px 0}
  /* archive */
  .arow{display:flex;align-items:center;gap:12px;padding:14px 12px;margin:8px 0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .arow .ad{flex:1}
  .arow .ad b{font-size:15px}
  .arow .ad small{display:block;color:var(--muted);font-size:12px}
  .pill{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:20px;
    padding:6px 10px;font-size:13px;font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  /* lock */
  .lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
  .lock.show{display:flex}
  .lock h2{margin:0;font-weight:700}
  .lock input{font-size:28px;letter-spacing:8px;text-align:center;width:200px;padding:12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
  .lock button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700}
  .lock .err{color:#f87171;font-size:14px;min-height:18px}
  /* check-the-facts wizard */
  .ctf{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  .ctf.show{display:flex}
  .ctf .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .ctf .top h2{margin:0;font-size:16px;flex:1}
  .ctf .x{background:var(--card2);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:18px}
  .prog{height:4px;background:var(--card2)}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .ctf .body{flex:1;overflow:auto;padding:18px 16px 20px;max-width:640px;margin:0 auto;width:100%}
  .ctf .step-q{font-size:20px;font-weight:700;margin:0 0 6px}
  .ctf .step-h{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
  .ctf textarea{min-height:90px}
  .ctf .lab{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .chips button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:20px;font-size:14px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .emogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .emogrid button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:16px 10px;border-radius:12px;font-size:16px;font-weight:600;text-align:start}
  .emogrid button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .iscale{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .iscale button{flex:1;min-width:30px;padding:14px 0;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);border-radius:10px;font-size:16px;font-weight:700}
  .iscale button.on{color:#fff}
  .iscale button.lo.on{background:var(--accent2);border-color:var(--accent2)}
  .iscale button.hi.on{background:#ef4444;border-color:#ef4444}
  .canttell{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:13px;border-radius:10px;font-size:15px}
  .canttell.on{background:#ef4444;border-color:#ef4444;color:#fff}
  .alert{background:#3b1d1d;border:1px solid #7f1d1d;border-radius:12px;padding:16px;margin:6px 0 2px}
  .alert h3{margin:0 0 8px;font-size:16px;color:#fca5a5}
  .alert ul{margin:8px 0 0;padding-left:18px}.alert li{margin:5px 0}
  .ctf .nav{border-top:1px solid var(--line);padding:0}
  .ctf .navin{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto;width:100%;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .ctf .nav button{flex:1;border:0;border-radius:12px;padding:0;height:52px;line-height:1;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .ctf .nav .back{background:var(--card2);color:var(--ink);flex:0 0 90px}
  .ctf .nav .next{background:var(--accent);color:#fff}
  .fitbtn{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);
    color:var(--ink);padding:15px;border-radius:12px;font-size:15px;margin:8px 0;font-weight:600}
  .fitbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fitbtn small{display:block;font-weight:400;color:var(--muted);margin-top:3px}.fitbtn.on small{color:#dbeafe}
  .ctfopen{display:block;width:100%;margin:12px 0;background:linear-gradient(90deg,#f59e0b,#ef4444);
    color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700}
  .sumbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;
    white-space:pre-wrap;font-size:14px;line-height:1.5}
  .emchain{position:relative;margin:16px 0 6px;padding-inline-start:24px}
  .emchain::before{content:'';position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .emrow{position:relative;padding:7px 0}
  .emrow::before{content:'';position:absolute;inset-inline-start:-23px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--e);border:2px solid var(--bg)}
  .emrow b{font-size:14px}.emrow small{display:block;color:var(--muted);font-size:12px}
  .gauge{height:12px;border-radius:8px;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);position:relative;margin:14px 6px 20px}
  .gauge .mk{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--line)}
  .flowopt{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;color:var(--ink)}
  .flowopt.on{border-color:var(--accent);background:var(--card2)}
  .flowopt b{font-size:15px}.flowopt span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .flowopt.on span{color:#a5b4fc}
  .installbar{display:none;align-items:center;gap:10px;max-width:640px;margin:10px auto 0;
    background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;border-radius:14px;padding:12px 14px}
  .installbar.show{display:flex}
  .installbar .it{flex:1;font-size:14px;font-weight:600;line-height:1.35}
  .installbar .yes{background:#fff;color:#4f46e5;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px;white-space:nowrap}
  .installbar .no{background:#ffffff33;color:#fff;border:0;border-radius:10px;width:34px;height:38px;font-size:16px}
  .homehero{text-align:center;padding:26px 10px 10px}
  .homehero h1{margin:0;font-size:24px}
  .homehero p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .homecard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);
    border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:16px;padding:18px;margin:11px 0;color:var(--ink)}
  .homecard:active{background:var(--card2)}
  .homecard .hci{font-size:30px;flex:none}
  .homecard .hct b{font-size:17px;display:block}
  .homecard .hct small{color:var(--muted);font-size:13px;line-height:1.4}
  .homerow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .homemini{flex:1 1 0;min-width:104px;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 8px;font-size:13px;font-weight:700}
  .homemini:active{border-color:var(--accent)}
  .practicebtn{display:block;width:100%;margin:4px 0 6px;background:linear-gradient(90deg,#0ea5e9,#6366f1);
    color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700}
  .toolchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
  .toolchip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
    color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700}
  .toolchip:active{border-color:var(--accent);background:var(--accent);color:#fff}
  .srow{display:flex;align-items:stretch;gap:6px;margin:7px 0}
  .srow .skill{flex:1;margin:0;min-width:0}
  .srbtn{flex:none;width:42px;border:1px solid var(--line);border-radius:12px;background:var(--card2);
    color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
  .srbtn.go{color:var(--accent)}
  .srbtn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modebtn{display:block;width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:20px;font-size:17px;font-weight:700;margin:10px 0;text-align:start}
  .modebtn .ms{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:4px}
  .factor{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:9px 0}
  .flab{display:flex;align-items:center;gap:8px}
  .flab b{font-size:15px;flex:1}
  .fval{background:var(--accent);color:#fff;border-radius:8px;min-width:32px;text-align:center;padding:3px 6px;font-weight:800;font-size:14px}
  .fq{color:var(--muted);font-size:13px;margin:4px 0 10px;line-height:1.4}
  .factor input[type=range]{width:100%;accent-color:var(--accent)}
  .asktotal{position:sticky;bottom:0;background:#0b1220ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);
    margin:10px -16px -20px;padding:13px 16px;text-align:center;font-weight:800;font-size:16px}
  .bigscore{font-size:64px;font-weight:800;text-align:center;color:var(--accent);line-height:1;margin-top:6px}
  .bandbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0;text-align:center}
  .bandbox .bt{font-size:19px;font-weight:800}
  .lrow{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;color:var(--ink)}
  .lrow .lt{flex:1;min-width:0}.lrow .lt b{font-size:15px}
  .lrow .lt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .lrow .chev{color:var(--muted);font-size:20px;flex:none}
  .modintro{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--accent);
    border-radius:12px;padding:15px;margin:2px 0 14px;font-size:14.5px;line-height:1.65}
  .lhead{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 6px}
  .mindstate{border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--card)}
  .mindstate b{display:block;font-size:15px;margin-bottom:3px}
  .mindstate span{font-size:14px;color:var(--muted);line-height:1.5}
  .infosec{margin:16px 0}
  .infosec .ih{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .infosec p{margin:0;font-size:16px;line-height:1.55}
  .acrorow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
  .acrobadge{flex:none;min-width:40px;height:40px;padding:0 8px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .acrotxt{flex:1;font-size:14px;line-height:1.45;color:var(--muted)}
  .acrotxt b{display:block;font-size:15px;color:var(--ink);margin-bottom:1px}
  .mythq{font-size:21px;font-weight:800;line-height:1.45;margin:8px 0 16px}
  .mythch{background:#14321f;border:1px solid var(--accent2);border-radius:12px;padding:14px;font-size:15px;line-height:1.5}
  .mythch .cl{display:block;font-size:12px;color:#86efac;font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .mindgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
  .mindtile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 10px;min-height:128px;color:var(--ink)}
  .mindtile:active{border-color:var(--accent);background:var(--card2)}
  .mindtile .me{font-size:38px;line-height:1}
  .mindtile b{font-size:14px;line-height:1.25;font-weight:700}
  .breathwrap{display:flex;flex-direction:column;align-items:center;padding:24px 0 6px}
  .breathcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#38bdf8,#6366f1);
    transform:scale(.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:800}
  .bphase{font-size:20px;font-weight:700;margin-top:20px;text-align:center;min-height:26px}
  .btimer{font-size:46px;font-weight:800;text-align:center;margin:14px 0}
  .sensecount{font-size:72px;font-weight:800;text-align:center;color:var(--accent);line-height:1}
  .sensebig{font-size:22px;font-weight:700;text-align:center;margin:18px 10px 24px;line-height:1.4}
  .steplist{margin:10px 0;padding:0;list-style:none}
  .steplist li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin:8px 0;font-size:15px;line-height:1.45}
  .langbtn{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    height:38px;min-width:42px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;line-height:1}
  [dir=rtl] .sumbox{text-align:right}
</style>
</head>
<body>

<div class="lock" id="lock">
  <h2 id="lockTitle">🔒 DBT Diary</h2>
  <div class="hint" id="lockHint">Enter your passcode</div>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" />
  <div class="err" id="pinErr"></div>
  <button id="unlockBtn" onclick="tryUnlock()">Unlock</button>
</div>

<header>
  <div class="htext">
    <h1 id="title">DBT Skills Diary</h1>
    <div class="date" id="dateLine"></div>
  </div>
  <div class="nav">
    <button class="langbtn" id="homeBtn" onclick="showHome()" title="Home" aria-label="Home">🏠</button>

function t(k){return T[k][LANG==='ar'?1:0];}
function loc(){return LANG==='ar'?'ar-EG':undefined;}
function skName(s){return LANG==='ar'?(s[2]||s[0]):s[0];}
function skSub(s){return LANG==='ar'?(s[3]||''):(s[1]||'');}
function grName(g){return LANG==='ar'?g.ar:g.name;}
function L(en,ar){return LANG==='ar'?ar:en;}                 // inline bilingual string
function locItem(list,en){const f=list.find(x=>x[0]===en);return f?L(f[0],f[1]):en;}

function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.getElementById('langBtn').textContent=LANG==='ar'?'EN':'ع';
  document.getElementById('scaleLabel').textContent=t('scaleLabel');
  document.getElementById('scaleHint').textContent=t('scaleHint');
  document.getElementById('notesH2').textContent=t('notesH2');
  document.getElementById('notes').placeholder=t('notesPh');
  document.getElementById('waBtn').textContent=t('whatsapp');
  document.getElementById('emailBtn').textContent=t('email');
  document.getElementById('backBtn').textContent=t('backEntry');
  document.getElementById('lockTitle').textContent=t('lockTitle');
  document.getElementById('lockHint').textContent=t('lockHint');
  document.getElementById('unlockBtn').textContent=t('unlock');
  document.getElementById('installText').textContent=t('installText');
  document.getElementById('installYes').textContent=t('installYes');
  buildMenu();
  if(view==='home'){showHome();}
  else if(view==='archive'){showArchive();}
  else{document.getElementById('title').textContent=t('appTitle');render();}
  maybeShowInstall();
  try{caches.open('dbt-cfg').then(c=>c.put('/lang',new Response(LANG)));}catch(_){}  // let the SW localize push text
}
function toggleLang(){LANG=LANG==='ar'?'en':'ar';cfg.lang=LANG;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));applyLang();}
function buildMenu(){
  const items=[['mLearn','openLearn()'],['mInstall','menuInstall()'],['mArchive','showArchive()'],['mCopy',"share('copy')"],['mWa','setTherapist()'],['mEmail','setEmail()'],
    ['mReminder','openRem()'],['mSetPin','setPin()'],['mRemovePin','removePin()'],['mExport','exportAll()'],
    ['mImport','importAll()'],['mClose','closeMenu()']];
  document.getElementById('menuSheet').innerHTML=items.map(([k,fn])=>`<button onclick="${fn}">${t(k)}</button>`).join('');
}

function pad(n){return String(n).padStart(2,'0');}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// You log the previous day, so the app opens on yesterday by default.
function defaultKey(){return shiftKey(todayKey(),-1);}
function keyToDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function pretty(k){return keyToDate(k).toLocaleDateString(loc(),{weekday:'long',month:'short',day:'numeric',year:'numeric'});}
function prettyShort(k){return keyToDate(k).toLocaleDateString(loc(),{weekday:'short',month:'short',day:'numeric'});}

/* ---------- passcode ---------- */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  if(!cfg.pinHash){document.getElementById('lock').classList.remove('show');return;}
  document.getElementById('lock').classList.add('show');
  document.getElementById('pinInput').focus();
}
async function tryUnlock(){
  const v=document.getElementById('pinInput').value;
  if(await sha(v)===cfg.pinHash){document.getElementById('lock').classList.remove('show');
    document.getElementById('pinInput').value='';}
  else{document.getElementById('pinErr').textContent=t('wrongPin');}
}
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
async function setPin(){const v=prompt(t('pinPrompt'));
  if(v){cfg.pinHash=await sha(v);localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('pinSet'));}closeMenu();}
function removePin(){delete cfg.pinHash;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('pinRemoved'));closeMenu();}

/* ---------- day load/save ---------- */
function load(){
  state=JSON.parse(localStorage.getItem('dbt_'+curKey)||'{}');
  if(!state.skills)state.skills={};
  render();
}
function save(){localStorage.setItem('dbt_'+curKey,JSON.stringify(state));}

function render(){
  const rel=curKey===todayKey()?t('today'):curKey===defaultKey()?t('yesterday'):'';
  document.getElementById('dateLine').textContent=rel+pretty(curKey);
  let seg='';for(let i=0;i<=7;i++)seg+=`<button class="${state.use==i?'on':''}" onclick="setUse(${i})">${i}</button>`;
  document.getElementById('useScale').innerHTML=seg;
  let html='';
  GROUPS.forEach((g,gi)=>{
    const done=g.skills.filter((_,si)=>state.skills[gi+'_'+si]).length;
    const tm={0:['🧘 '+L('Practice','تمارين'),'openMindPicker()','#0ea5e9','#fff'],2:['🧠 '+L('Myths','خرافات'),'openMyths()','#f59e0b','#3b2a08']}[gi];
    const toolChip=tm?`<button class="ghchip" style="background:${tm[2]};border-color:${tm[2]};color:${tm[3]}" onclick="${tm[1]}">${tm[0]}</button>`:'';
    html+=`<div class="group"><span class="dot" style="background:${g.color}"></span><h3>${grName(g)}</h3>`+
      `<button class="ghinfo" onclick="openLearnModule(${gi})" aria-label="${L('Module guide','دليل الموديول')}">ⓘ</button>`+
      `<span class="ghtrail">${toolChip}<span class="count">${done}/${g.skills.length}</span></span></div>`;
    g.skills.forEach((s,si)=>{const id=gi+'_'+si,on=state.skills[id]?'on':'';const sub=skSub(s);const ln=LAUNCH[id];
      html+=`<div class="srow"><div class="skill ${on}" onclick="toggle('${id}')"><div class="box">${state.skills[id]?'✓':''}</div>
        <div class="name">${skName(s)}${sub?`<span class="sub">${sub}</span>`:''}</div></div>`+
        `<button class="srbtn" onclick="openLearnAt(${gi},${si})" aria-label="Read about this skill">ⓘ</button>`+
        (ln?`<button class="srbtn go" dir="ltr" onclick="${ln}" aria-label="Open guided tool">${LANG==='ar'?'◀':'▶'}</button>`:'')+`</div>`;
    });
  });
  document.getElementById('skills').innerHTML=html;
  document.getElementById('notes').value=state.notes||'';
}
function toggle(id){state.skills[id]=!state.skills[id];save();render();}
function setUse(n){state.use=n;save();render();}
document.getElementById('notes').addEventListener('input',e=>{state.notes=e.target.value;save();});

  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}

function card(ic,col,fn,t1,t2){return `<button class="homecard" style="border-inline-start-color:${col}" onclick="${fn}"><span class="hci">${ic}</span><span class="hct"><b>${t1}</b><small>${t2}</small></span></button>`;}

    +card('🧘','#0ea5e9','openMindPicker()',L('Practice mindfulness','تمارين اليقظة'),L('Guided breathing & grounding','تمارين تنفّس و Grounding موجّهة'))

function showArchive(){view='archive';closeMenu();
  if(location.hash!=='#archive')history.replaceState(null,'','#archive');
  document.getElementById('homeView').style.display='none';setHeader('archive');
  document.getElementById('dayView').style.display='none';
  document.getElementById('archiveView').style.display='';
  document.getElementById('dayBar').style.display='none';
  document.getElementById('archiveBar').style.display='flex';
  document.getElementById('title').textContent=t('archive');
  document.getElementById('dateLine').textContent=t('allDays');
  const keys=Object.keys(localStorage).filter(k=>/^dbt_\d{4}-\d{2}-\d{2}$/.test(k))
    .map(k=>k.slice(4)).sort().reverse();
  const list=document.getElementById('archiveList');
  if(!keys.length){list.innerHTML=`<div class="empty">${t('noDays')}</div>`;return;}
  list.innerHTML=keys.map(k=>{
    const s=JSON.parse(localStorage.getItem('dbt_'+k)||'{}');const sk=s.skills||{};
    const n=Object.values(sk).filter(Boolean).length;
    const skw=LANG==='ar'?(n+' مهارة'):(n+' skill'+(n===1?'':'s'));
    return `<div class="arow" onclick="openArchiveDay('${k}')">
      <div class="ad"><b>${prettyShort(k)}</b><small>${skw} · ${s.notes?t('hasNotes'):'—'}</small></div>
      <div class="pill">${s.use!=null?s.use+'/7':'–'}</div></div>`;
  }).join('');
  window.scrollTo(0,0);
}
function openArchiveDay(k){view='day';document.getElementById('dayView').style.display='';
  document.getElementById('homeView').style.display='none';setHeader('day');
  document.getElementById('archiveView').style.display='none';
  document.getElementById('dayBar').style.display='flex';
  document.getElementById('archiveBar').style.display='none';
  document.getElementById('title').textContent=t('appTitle');
  curKey=k;load();window.scrollTo(0,0);}

/* ---------- summary + share ---------- */
function summary(){
  const sep=LANG==='ar'?'، ':', ';
  let out=t('sumTitle')+pretty(curKey)+'\n';
  if(state.use!=null)out+=t('sumUsed')+state.use+'/7\n';out+='\n';let any=false;
  GROUPS.forEach((g,gi)=>{const used=g.skills.filter((s,si)=>state.skills[gi+'_'+si]).map(s=>skName(s));
    if(used.length){any=true;out+=grName(g)+': '+used.join(sep)+'\n';}});
  if(!any)out+=t('sumNoSkills')+'\n';
  if(state.notes&&state.notes.trim())out+='\n'+t('sumNotes')+state.notes.trim()+'\n';
  return out;
}
function share(how){const text=summary();
  if(how==='wa'){const num=(cfg.wa||'').replace(/[^0-9]/g,'');
    location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(text);}
  else if(how==='email'){location.href='mailto:'+(cfg.email||'')+'?subject='+
    encodeURIComponent(t('emailSubject')+pretty(curKey))+'&body='+encodeURIComponent(text);}
  else if(how==='copy'){navigator.clipboard.writeText(text).then(()=>toast(t('copied')));closeMenu();}
}
function setTherapist(){const v=prompt(t('waPrompt'),cfg.wa||'');
  if(v!=null){cfg.wa=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('saved'));}closeMenu();}
function setEmail(){const v=prompt(t('emailPrompt'),cfg.email||'');
  if(v!=null){cfg.email=v;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));toast(t('saved'));}closeMenu();}

/* ---------- backup / restore ---------- */
function exportAll(){
  const data={};Object.keys(localStorage).filter(k=>k.startsWith('dbt_')).forEach(k=>data[k]=localStorage.getItem(k));
  dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'dbt-diary-backup-'+todayKey()+'.json');
  closeMenu();toast(t('backupDl'));
}
function importAll(){closeMenu();document.getElementById('fileIn').click();}
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);
    Object.keys(data).forEach(k=>{if(k.startsWith('dbt_'))localStorage.setItem(k,data[k]);});
    toast(t('backupRestored'));showDay();}catch(_){toast(t('cantRead'));}};
  r.readAsText(f);e.target.value='';
});
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}

/* ---------- ui ---------- */
function openMenu(){document.getElementById('menu').classList.add('show');}
function closeMenu(){document.getElementById('menu').classList.remove('show');}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ===================== Check the Facts (guided) ===================== */
// [en, ar] pairs — English (index 0) is the stored key; display localized.
const PRIMARY=[['Fear','الخوف'],['Sadness','الحزن'],['Shame','الخزي'],['Guilt','الذنب'],['Happiness','السعادة'],['Disgust','القرف / الاشمئزاز'],['Anger','الغضب']];
const BODY=[['Tight chest','صدر مضغوط'],['Racing heart','قلب بيدق بسرعة'],['Hot / flushed','سخونة / احمرار'],['Tense muscles','عضلات مشدودة'],['Shaky','رعشة'],['Stomach knot','معدة مقبوضة'],['Heavy','تقل'],['Short of breath','ضيق نفس'],['Restless','مش مستقر'],['Numb','تنميل / خدر']];
const URGES=[['Withdraw / hide','انسحب / اختفي'],['Lash out','أهجم'],['Run / escape','أجري / أهرب'],['Cry','عياط'],['Shut down','أنغلق'],['Avoid it','أتجنّب'],['Seek reassurance','أدوّر على طمأنة'],['Apologize','أعتذر'],['Check / control','أتحكّم / أراقب'],['Numb out','أخدّر نفسي']];
const ORDER=['intro','emotion','intensity','vuln','event','interp','body','urges','after','threat','catastrophe','fit','summary'];
let ctf={};

function openCTF(){ctf={step:'intro',bodyChips:[],urgeChips:[]};document.getElementById('ctf').classList.add('show');renderCTF();}
function launchCTF(id){state.skills[id]=true;save();render();openCTF();}
function closeCTF(){document.getElementById('ctf').classList.remove('show');render();}
function gotoStep(s){ctf.step=s;renderCTF();document.getElementById('ctfBody').scrollTop=0;}
function triggered(){return ctf.cantTell||ctf.intensity>=8;}

function ctfNext(){
  const s=ctf.step;
  if(s==='emotion'&&!ctf.emotion){return toast(L('Pick an emotion first','اختار شعور الأول'));}
  if(s==='intensity'&&ctf.intensity==null&&!ctf.cantTell){return toast(L('Tap a number, or “Can’t tell”','دوس رقم، أو «مش قادر أحدد»'));}
  if(s==='intensity'){if(triggered()){ctf.dtFrom='intensity';return gotoStep('dt');}return gotoStep('vuln');}
  if(s==='dt'){return gotoStep('vuln');}
  const i=ORDER.indexOf(s); if(i>=0&&i<ORDER.length-1)gotoStep(ORDER[i+1]);
}
function ctfPrev(){
  const s=ctf.step;
  if(s==='dt')return gotoStep(ctf.dtFrom||'intensity');
  if(s==='vuln')return gotoStep((triggered()||ctf.cantName)?'dt':'intensity');
  const i=ORDER.indexOf(s); if(i>0)gotoStep(ORDER[i-1]); else closeCTF();
}
function ctfEmo(n){ctf.emotion=n;ctf.cantName=false;renderCTF();}
function ctfCantName(){ctf.cantName=true;ctf.emotion=null;ctf.dtFrom='emotion';gotoStep('dt');}
function ctfInt(n){ctf.intensity=n;ctf.cantTell=false;renderCTF();}
function ctfCant(){ctf.cantTell=!ctf.cantTell;ctf.intensity=null;renderCTF();}
function ctfChip(field,label){const a=ctf[field];const i=a.indexOf(label);i>=0?a.splice(i,1):a.push(label);renderCTF();}
function ctfFit(v){ctf.fit=v;renderCTF();}

function setNav(html){document.getElementById('ctfNav').innerHTML=`<div class="navin">${html}</div>`;}
function nav(extra){
  const back=`<button class="back" onclick="ctfPrev()">${L('Back','رجوع')}</button>`;
  setNav(back+(extra||`<button class="next" onclick="ctfNext()">${L('Next ▸','التالي ◂')}</button>`));
}
function chips(field,list){return `<div class="chips">`+list.map(l=>
  `<button class="${ctf[field].includes(l[0])?'on':''}" onclick="ctfChip('${field}','${l[0]}')">${L(l[0],l[1])}</button>`).join('')+`</div>`;}

function renderCTF(){
  const b=document.getElementById('ctfBody'); const s=ctf.step;
  const idx=Math.max(0,ORDER.indexOf(s==='dt'?'intensity':s));
  document.getElementById('ctfProg').style.width=(idx/(ORDER.length-1)*100)+'%';
  document.getElementById('ctfTitle').textContent=L('Work through an emotion','اشتغل على شعورك');
  let h='';
  if(s==='intro'){
    h=`<p class="step-q">${L('Work through an emotion','اشتغل على شعورك')}</p>
    <p class="step-h">${L('We’ll map the emotion (Linehan’s model), check whether it fits the facts, then pick the skill that fits. A few minutes — nothing is sent unless you choose to.','هنرسم الشعور (نموذج لينيهان)، ونشوف هل مناسب للحقائق، وبعدين نختار المهارة المناسبة. دقايق قليلة — مفيش حاجة بتتبعت إلا لو اخترت.')}</p>
    <div class="emchain">
      <div class="emrow"><b>${L('Vulnerability','القابلية')}</b><small>${L('what makes you prone','اللي بيخليك قابل')}</small></div>
      <div class="emrow"><b>${L('Prompting event','الحدث المحفّز')}</b><small>${L('the trigger','المحفّز')}</small></div>
      <div class="emrow"><b>${L('Interpretation','التفسير')}</b><small>${L('the story you tell','الحكاية اللي بتقولها')}</small></div>
      <div class="emrow"><b>${L('Emotion · body · urge','الشعور · الجسم · الرغبة')}</b><small>${L('what you feel & want to do','اللي بتحسه وعايز تعمله')}</small></div>
      <div class="emrow"><b>${L('Action · aftereffects','الفعل · التأثير بعدها')}</b><small>${L('what you did & what followed','اللي عملته واللي حصل بعدها')}</small></div>
    </div>`;
    setNav(`<button class="next" onclick="ctfNext()">${L('Start ▸','ابدأ ◂')}</button>`);
  }
  else if(s==='emotion'){
    h=`<p class="step-q">${L('What is the emotion you want to check?','إيه الشعور اللي عايز تراجعه؟')}</p>
    <p class="step-h">${L('Pick the one that fits best. (DBT primary emotions.)','اختار اللي بيوصفك أكتر. (المشاعر الأساسية في DBT)')}</p>
    <div class="emogrid">`+PRIMARY.map(e=>`<button class="${ctf.emotion===e[0]?'on':''}" onclick="ctfEmo('${e[0]}')">${L(e[0],e[1])}</button>`).join('')+`</div>
    <button class="canttell ${ctf.cantName?'on':''}" onclick="ctfCantName()">${L('I can’t name what I’m feeling','مش عارف أسمّي اللي حاسس بيه')}</button>
    <div class="lab">${L('A more specific word for it (optional)','كلمة أدق ليه (اختياري)')}</div>
    <input class="canttell" style="text-align:start" placeholder="${L('e.g. resentful, anxious, humiliated…','مثلاً: متضايق، قلقان، متهان…')}" value="${ctf.emotionWord||''}" oninput="ctf.emotionWord=this.value">`;
    nav();
  }
  else if(s==='intensity'){
    h=`<p class="step-q">${L('How intense is it, 0–10?','قد إيه شدته، من ٠ لـ ١٠؟')}</p>
    <p class="step-h">${L('0 = not at all · 10 = the most you’ve ever felt it.','٠ = ولا حاجة · ١٠ = أقوى ما حسيت بيه في حياتك.')}</p>
    <div class="gauge" dir="ltr">${ctf.intensity!=null?`<div class="mk" style="left:${ctf.intensity/10*100}%"></div>`:''}</div>
    <div class="iscale">`+Array.from({length:11},(_,n)=>
      `<button class="${n>=8?'hi':'lo'} ${ctf.intensity===n?'on':''}" onclick="ctfInt(${n})">${n}</button>`).join('')+`</div>
    <button class="canttell ${ctf.cantTell?'on':''}" onclick="ctfCant()">${L('I can’t tell how intense it is','مش قادر أحدد شدته')}</button>`;
    nav();
  }
  else if(s==='vuln'){
    h=`<p class="step-q">${L('What made you more vulnerable?','إيه اللي خلاك أكتر قابلية؟')}</p>
    <p class="step-h">${L('Things that lowered your resilience that day — tired, hungry, sick, stressed, or earlier events.','حاجات قلّلت مناعتك في اليوم ده — تعب، جوع، مرض، توتر، أو أحداث قبلها.')}</p>
    <textarea placeholder="${L('e.g. slept badly, skipped meals, a rough morning…','مثلاً: نمت وحش، فوّت وجبات، صباح متعب…')}" oninput="ctf.vuln=this.value">${ctf.vuln||''}</textarea>`;
    nav();
  }
  else if(s==='dt'){
    h=`<div class="alert"><h3>${L('⚠️ Let’s lower the intensity first','⚠️ خلينا نهدّي الشدة الأول')}</h3>
      <p style="margin:0">${L('When an emotion is this strong (or hard to read), the thinking brain is offline — Check the Facts won’t land yet. Use a <b>Distress Tolerance</b> skill to take the edge off, <i>then</i> come back to this.','لما الشعور يبقى بالقوة دي (أو صعب تقراه)، المخ المفكّر بيفصل — مراجعة الحقائق مش هتنفع دلوقتي. استخدم مهارة من <b>تجاوز المحن</b> عشان تخفّف، وبعدين ارجع.')}</p>
      <ul>
        <li>${L('<b>TIP</b> — cold water on your face / hold ice, or intense exercise for a few minutes, then paced breathing (out longer than in)','<b>TIP</b> — مياه باردة على وشك / امسك تلج، أو تمرين عنيف لكام دقيقة، وبعدين تنفّس بإيقاع (الزفير أطول من الشهيق)')}</li>
        <li>${L('<b>STOP</b> — Stop, Take a step back, Observe, Proceed mindfully','<b>STOP</b> — قف، ارجع خطوة، لاحظ، كمّل بوعي')}</li>
        <li>${L('<b>Distract & Self-soothe</b> — change activity; soothe your five senses','<b>التشتيت وتهدئة الذات</b> — غيّر النشاط؛ هدّي حواسك الخمسة')}</li>
      </ul></div>
    <p class="step-h">${L('Come back when you’re at roughly a 7 or below. You can continue now if you want, but it may be harder.','ارجع لما تبقى عند ٧ أو أقل. تقدر تكمّل دلوقتي لو حابب، بس ممكن يبقى أصعب.')}</p>`;
    nav(`<button class="next" onclick="ctfNext()">${L('I’ve eased it — continue ▸','خفّفتها — كمّل ◂')}</button>`);
  }
  else if(s==='event'){
    h=`<p class="step-q">${L('What actually happened?','إيه اللي حصل فعلاً؟')}</p>
    <p class="step-h">${L('Describe <b>only the facts you observed</b> — what you literally saw and heard, like a camera would. No judgments, no “they meant…”, no assumptions. That part comes next.','اوصف <b>الحقايق اللي لاحظتها بس</b> — اللي شفته وسمعته حرفيًا زي الكاميرا. من غير أحكام، من غير «هو قصده…»، من غير افتراضات. ده بييجي بعدين.')}</p>
    <textarea placeholder="${L('Just the observable facts: who, what, where, what was said/done…','الحقايق الملحوظة بس: مين، إيه، فين، اتقال/اتعمل إيه…')}" oninput="ctf.event=this.value">${ctf.event||''}</textarea>
    <p class="step-h" style="margin-top:10px">${L('✓ “He said ‘we’ll talk later’ and left the room.”<br>✗ “He blew me off because he doesn’t care.” (that’s an interpretation)','✓ «قال ‹هنتكلم بعدين› وخرج من الأوضة.»<br>✗ «تجاهلني عشان مش مهتم.» (ده تفسير)')}</p>`;
    nav();
  }
  else if(s==='interp'){
    h=`<p class="step-q">${L('What are your interpretations & assumptions?','إيه تفسيراتك وافتراضاتك؟')}</p>
    <p class="step-h">${L('The thoughts, meanings and assumptions you’re adding to the facts.','الأفكار والمعاني والافتراضات اللي بتضيفها على الحقايق.')}</p>
    <textarea placeholder="${L('What I’m telling myself it means…','اللي بقوله لنفسي إن ده معناه…')}" oninput="ctf.interp=this.value">${ctf.interp||''}</textarea>
    <div class="lab">${L('Now — what are other possible interpretations? (look at all sides)','دلوقتي — إيه التفسيرات التانية الممكنة؟ (بصّ لكل الجهات)')}</div>
    <textarea placeholder="${L('Other ways a reasonable person might read the same facts…','طرق تانية ممكن حد عاقل يقرا بيها نفس الحقايق…')}" oninput="ctf.otherInterp=this.value">${ctf.otherInterp||''}</textarea>`;
    nav();
  }
  else if(s==='body'){
    h=`<p class="step-q">${L('What do you notice in your body?','إيه اللي بتحس بيه في جسمك؟')}</p>
    <p class="step-h">${L('Tap any that fit; add your own.','دوس على اللي يناسبك؛ وضيف بتاعك.')}</p>${chips('bodyChips',BODY)}
    <textarea placeholder="${L('Anything else you feel in your body…','أي حاجة تانية حاساها في جسمك…')}" oninput="ctf.bodyText=this.value">${ctf.bodyText||''}</textarea>`;
    nav();
  }
  else if(s==='urges'){
    h=`<p class="step-q">${L('What is the emotion urging you to do?','الشعور بيدفعك تعمل إيه؟')}</p>
    <p class="step-h">${L('Every emotion has an action urge. Name it — you don’t have to act on it.','كل شعور ليه رغبة ملحة للتصرف. سمّيها — مش لازم تنفّذها.')}</p>${chips('urgeChips',URGES)}
    <textarea placeholder="${L('What you feel pulled to do or say…','اللي حاسس إنك متدفع تعمله أو تقوله…')}" oninput="ctf.urgeText=this.value">${ctf.urgeText||''}</textarea>`;
    nav();

  else if(s==='after'){

function ctfSummary(){
  const sep=LANG==='ar'?'، ':', ';
  const O=[]; O.push(L('🧭 Work through an emotion — ','🧭 اشتغل على شعورك — ')+pretty(curKey));
  const emoP=PRIMARY.find(p=>p[0]===ctf.emotion);
  let e=ctf.cantName?L('couldn’t name it','مش متسمّي'):(emoP?L(emoP[0],emoP[1]):(ctf.emotion||'—')); if(ctf.emotionWord)e+=' ('+ctf.emotionWord+')';
  O.push(L('Emotion: ','الشعور: ')+e+'  ·  '+L('Intensity: ','الشدة: ')+(ctf.cantTell?L('hard to tell','صعب التحديد'):(ctf.intensity!=null?ctf.intensity+'/10':'—')));
  const add=(lab,v)=>{if(v&&String(v).trim())O.push('\n'+lab+': '+String(v).trim());};
  add(L('Vulnerability','القابلية'),ctf.vuln);
  add(L('What happened (just the facts)','اللي حصل (الحقايق بس)'),ctf.event);
  add(L('My interpretation','تفسيري'),ctf.interp);
  add(L('Other interpretations','تفسيرات تانية'),ctf.otherInterp);
  const body=[...(ctf.bodyChips||[]).map(x=>locItem(BODY,x)),ctf.bodyText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Body sensations','أحاسيس الجسم'),body);
  const urge=[...(ctf.urgeChips||[]).map(x=>locItem(URGES,x)),ctf.urgeText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Action urges','الرغبات الملحة'),urge);
  add(L('What I did / after','اللي عملته / بعدها'),ctf.after);
  if((ctf.threat||'').trim()){let th=ctf.threat.trim();if(ctf.threatProb)th+='  ('+L('likelihood: ','الاحتمال: ')+ctf.threatProb+')';O.push('\n'+L('Threat I’m assuming: ','التهديد اللي بفترضه: ')+th);}
  add(L('Other possible outcomes','نهايات تانية ممكنة'),ctf.otherOutcomes);
  add(L('Worst case','أسوأ احتمال'),ctf.catastrophe);
  add(L('How I could cope','ازاي أقدر أتعامل'),ctf.coping);
  const fitTxt={fits:L('Fits the facts → problem-solve / act on it.','مناسبة للحقائق → حل المشكلة / اتصرف عليها.'),partly:L('Fits, but too intense → opposite action to the intensity.','مناسبة لكن متعلّية → فعل العكس للشدة.'),doesnt:L('Doesn’t fit the facts → opposite action.','مش مناسبة للحقائق → فعل العكس.'),accept:L('Real but can’t change it → radical acceptance.','حقيقية بس مش قابلة للتغيير → القبول الجذري.')}[ctf.fit];
  if(fitTxt)O.push('\n'+L('Conclusion: ','الخلاصة: ')+fitTxt);
  return O.join('\n');
}
function ctfToNotes(){
  const t=ctfSummary();
  state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+t;
  save();render();toast(t('addedNotes'));closeCTF();
}
function ctfShare(){
  const num=(cfg.wa||'').replace(/[^0-9]/g,'');
  location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(ctfSummary());
}

function raSummary(){
  const sep=LANG==='ar'?'، ':', ';

  add(L('In my own words','بكلامي أنا'),ra.ownWords);

  if(ra.wholeSelf)O.push('\n'+L('Practised accepting with the whole self (breath / half-smile / willing hands).','اتمرّنت على التقبّل بكل الكيان (نفس / نص ابتسامة / أيدي متقبلة).'));
  add(L('Opposite action','التصرف العكسي'),ra.opposite);
  add(L('Cope ahead','الاستعداد المسبق'),ra.copeAhead);
  const body=[...(ra.bodyChips||[]).map(x=>locItem(BODY,x)),ra.bodyText].filter(x=>x&&String(x).trim()).join(sep);
  add(L('Body sensations','أحاسيس الجسم'),body);
  add(L('Feelings I let rise','المشاعر اللي سيبتها تطلع'),ra.grief);
  add(L('Still worth living','لسه تستاهل'),ra.worth);
  add(L('Pros of accepting','مميزات التقبّل'),ra.pros);

  return O.join('\n');
}

function urlB64ToUint8(b){const pad='='.repeat((4-b.length%4)%4);const s=(b+pad).replace(/-/g,'+').replace(/_/g,'/');const r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}

async function disablePush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){await fetch(WORKER_URL+'/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe();}
    cfg.remOn=false;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));
    closeRem();toast(t('pushOff'));
  }catch(e){toast(t('pushErr')+(e.message||''));}
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){return toast(t('pushUnsupported'));}
  if(isIOS()&&!isStandalone()){closeRem();return toast(t('pushIOSInstall'));}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast(t('pushBlocked'));
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    const time=(document.getElementById('remTime')||{}).value||'09:00';
    const tz=-new Date().getTimezoneOffset();  // fallback fixed offset
    let tzName='';try{tzName=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(_){}
    const r=await fetch(WORKER_URL+'/subscribe',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({sub:sub.toJSON?sub.toJSON():sub,time,tz,tzName,lang:LANG})});
    if(!r.ok)throw new Error('server '+r.status);
    cfg.remTime=time;cfg.remOn=true;localStorage.setItem('dbt_cfg',JSON.stringify(cfg));
    closeRem();toast(t('pushOn'));
  }catch(e){toast(t('pushErr')+(e.message||''));}
}

function runPhase(){
  if(!mind.running)return;const ph=mind.ex.phases[mind.bi];const secs=ph[2],mode=ph[3];
  const c=document.getElementById('mCircle');if(!c)return;
  c.style.transition='transform '+secs+'s '+(mode==='hold'?'linear':'ease-in-out');
  if(mode==='in')c.style.transform='scale(1)';else if(mode==='out')c.style.transform='scale(.55)';
  document.getElementById('mPhase').textContent=L(ph[0],ph[1]);
  let rem=secs;const cn=document.getElementById('mCount');cn.textContent=rem;
  clearInterval(mind.iv);mind.iv=setInterval(()=>{rem--;cn.textContent=rem>0?rem:'';
    if(rem<=0){clearInterval(mind.iv);mind.bi=(mind.bi+1)%mind.ex.phases.length;runPhase();}},1000);

function toggleTimer(){

      <button class="modebtn" onclick="askMode('ask')"><b>${L('I want to ask for something','عايز أطلب حاجة')}</b><span class="ms">${L('How firmly should I ask?','أطلب بقوة قد إيه؟')}</span></button>
      <button class="modebtn" onclick="askMode('no')"><b>${L('I want to say no','عايز أرفض')}</b><span class="ms">${L('How firmly should I say no?','أرفض بقوة قد إيه؟')}</span></button>`;
    document.getElementById('askNav').innerHTML=`<div class="navin"><button class="next" onclick="closeAsk()">${L('Close','إغلاق')}</button></div>`;
    return;
  }
  if(ask.step==='score'){
    const F=ask.mode==='ask'?ASK_FACTORS:NO_FACTORS;
    document.getElementById('askProg').style.width='50%';
    document.getElementById('askTitle').textContent=ask.mode==='ask'?L('How firmly should I ask?','أطلب بقوة قد إيه؟'):L('How firmly should I say no?','أرفض بقوة قد إيه؟');
    b.innerHTML=`<p class="step-h">${L('Rate each 0–10. Higher total → '+(ask.mode==='ask'?'ask more firmly.':'refuse more firmly.'),'قيّم كل عامل من ٠ لـ ١٠. المجموع الأعلى → '+(ask.mode==='ask'?'تطلب بحزم أكتر.':'ترفض بحزم أكتر.'))}</p>`
      +F.map(f=>`<div class="factor"><div class="flab"><b>${L(f[1][0],f[1][1])}</b><span class="fval" id="fv_${f[0]}">${ask.scores[f[0]]}</span></div>
        <div class="fq">${L(f[2][0],f[2][1])}</div>
        <input type="range" min="0" max="10" value="${ask.scores[f[0]]}" oninput="setFactor('${f[0]}',this.value)"></div>`).join('')
      +`<div class="asktotal">${L('Total','المجموع')}: <span id="askTot">${askTotal()}</span> / 100</div>`;
    document.getElementById('askNav').innerHTML=`<div class="navin"><button class="back" onclick="ask.step='mode';renderAsk()">${L('Back','رجوع')}</button><button class="next" onclick="ask.step='result';renderAsk()">${L('See result','شوف النتيجة')} ${LANG==='ar'?'◂':'▸'}</button></div>`;
    return;
  }
  // result
  const tot=askTotal(),bd=askBand(tot,ask.mode);
  const short=ask.mode==='ask'?ASK_SHORT:NO_SHORT;
  document.getElementById('askProg').style.width='100%';
  document.getElementById('askTitle').textContent=L('Result','النتيجة');
  b.innerHTML=`<div class="bigscore">${tot}<span style="font-size:22px;color:var(--muted)">/100</span></div>
    <div class="bandbox"><div class="bt">${L(bd[0],bd[1])}</div></div>
    <div class="lab">${L('Quick gut-check','مراجعة سريعة')}</div>
    <ul class="steplist">`+short.map(s=>`<li>${L(s[0],s[1])}</li>`).join('')+`</ul>
    <button class="ctfopen" style="background:var(--accent)" onclick="closeAsk();openDear()">${L('🗣️ Next: build what to say — DEAR MAN','🗣️ بعدين: اكتب اللي هتقوله — DEAR MAN')}</button>
    <button class="ctfopen" style="background:var(--accent2)" onclick="askToNotes()">${L('＋ Add to '+(curKey===todayKey()?'today':'this day')+'’s notes','＋ ضيف لملاحظات '+(curKey===todayKey()?'النهارده':'اليوم ده'))}</button>
    <button class="canttell" onclick="askShare()">${L('📲 Send to my therapist (WhatsApp)','📲 ابعتها للمعالج (واتساب)')}</button>
    <button class="canttell" onclick="navigator.clipboard.writeText(askSummary()).then(()=>toast(t('copied')))">${L('📋 Copy','📋 نسخ')}</button>`;
  document.getElementById('askNav').innerHTML=`<div class="navin"><button class="back" onclick="ask.step='score';renderAsk()">${L('Back','رجوع')}</button><button class="next" onclick="doneAsk()">${L('Done','تمام')}</button></div>`;
}
function askSummary(){
  const F=ask.mode==='ask'?ASK_FACTORS:NO_FACTORS,tot=askTotal(),bd=askBand(tot,ask.mode);
  const head=ask.mode==='ask'?L('🤝 How strongly to ask','🤝 أطلب بقوة قد إيه'):L('🤝 How strongly to say no','🤝 أرفض بقوة قد إيه');
  const L1=[head+' — '+pretty(curKey), L('Total','المجموع')+': '+tot+'/100 → '+L(bd[0],bd[1]),''];
  F.forEach(f=>L1.push(L(f[1][0],f[1][1])+': '+ask.scores[f[0]]+'/10'));
  return L1.join('\n');
}
function askToNotes(){state.notes=(state.notes&&state.notes.trim()?state.notes.trim()+'\n\n':'')+askSummary();save();render();toast(t('addedNotes'));closeAsk();}
function askShare(){const num=(cfg.wa||'').replace(/[^0-9]/g,'');location.href=(num?'https://wa.me/'+num:'https://wa.me/')+'?text='+encodeURIComponent(askSummary());}
function doneAsk(){state.skills['1_0']=true;save();render();toast(L('Decision noted 🤝','اتسجّل القرار 🤝'));closeAsk();}

/* ===================== Learn the skills ===================== */
// keyed "gi_si": [whatEn, whatAr, howEn, howAr]
const SKILLS_INFO={
 '0_0':["The state where emotion mind and reasonable mind overlap — a calm, centered inner knowing that integrates both feeling and logic.","الحالة اللي العقل العاطفي والعقل المنطقي بيتقابلوا فيها — معرفة هادية ومتزنة جوّاك بتجمع بين الإحساس والمنطق.","Breathe down into your center, ask a clear question (“what’s the wise thing here?”), and wait for the steady answer that still feels true after the emotion settles.","خد نفس لجوّه ناحية مركزك، اسأل سؤال واضح («إيه الصح هنا؟»)، واستنى الرد الثابت اللي يفضل صح بعد ما المشاعر تهدأ.","Before any important or impulsive decision — especially when emotion pulls one way and logic the other.","قبل أي قرار مهم أو متهور — خصوصًا لما المشاعر تشدّك ناحية والمنطق ناحية تانية."],
 '0_1':["Paying attention to your inner and outer experience just as it is — thoughts, feelings, sights, sounds, sensations — without putting it into words yet.","إنك تدّي انتباه لتجربتك جوّه وبرّه زي ما هي — أفكار ومشاعر ومناظر وأصوات وأحاسيس — من غير ما تحطها في كلام لسه.","Use your five senses like a camera. Let experiences come and go without grabbing or pushing them; notice the urge to react, but just watch.","استخدم حواسك الخمسة زي الكاميرا. سيب التجارب تيجي وتروح من غير ما تمسكها أو تبعدها؛ لاحظ الرغبة في رد الفعل، بس راقب.","When you’re lost in your head, overwhelmed, or want to ground yourself in the present.","لما تبقى غارق في أفكارك، أو مرهَق، أو عايز ترجع للحظة الحالية."],
 '0_2':["Putting accurate words on what you observed — labeling facts only, and separating them from your interpretations and judgments.","إنك تحط كلام دقيق على اللي لاحظته — تسمّي الحقايق بس، وتفصلها عن تفسيراتك وأحكامك.","Say “a thought is here”, “I notice tightness in my chest”, “he said X”. Avoid “he’s rude” — that’s a judgment, not an observation.","قول «فيه فكرة موجودة»، «بلاحظ شد في صدري»، «هو قال كذا». بلاش «هو وقح» — دي حكم مش ملاحظة.","When emotions run high and you want to think clearly, or before reacting to what someone did.","لما المشاعر تعلى وعايز تفكر بوضوح، أو قبل ما ترد على تصرف حد."],
 '0_3':["Throwing yourself completely into the present activity, so there’s no separation between you and what you’re doing.","إنك ترمي نفسك بالكامل في النشاط الحالي، لدرجة إنه مفيش فاصل بينك وبين اللي بتعمله.","Drop self-consciousness and the running commentary; become one with the action — dancing, talking, washing dishes, even feeling an emotion fully.","سيب مراقبة نفسك والتعليق المستمر؛ وكن واحد مع الفعل — رقص، كلام، غسيل، حتى إحساسك بشعور بالكامل.","When you’re stuck overthinking or feel detached, and want to be fully alive in the moment.","لما تبقى عالق في تفكير زيادة أو حاسس بانفصال، وعايز تعيش اللحظة بالكامل."],
 '0_4':["Seeing reality without adding “good/bad” or “should/shouldn’t”. You still notice what’s helpful or harmful — you just drop the evaluative labels that fuel suffering.","إنك تشوف الواقع من غير ما تضيف «حلو/وحش» أو «المفروض/مش المفروض». لسه بتلاحظ المفيد والضار — بس بتسيب الأحكام التقييمية اللي بتزوّد المعاناة.","Catch a judgment, then re-state it as fact + consequence: “he’s an idiot” → “he forgot, and I felt let down”. Don’t judge yourself for judging.","امسك الحكم، وبعدين أعِد صياغته كحقيقة + نتيجة: «هو غبي» ← «هو نسي، وأنا حسّيت بخذلان». ومتحكمش على نفسك إنك حكمت.","When anger, contempt, or harsh self-criticism is building.","لما تلاحظ غضب أو احتقار أو نقد قاسي لنفسك بيكبر."],
 '0_5':["Doing one thing at a time, with full attention — the opposite of multitasking and autopilot.","إنك تعمل حاجة واحدة في المرة بكامل الانتباه — عكس تعدد المهام والطيّار الآلي.","Pick one task. When the mind drifts to the past, future, or another task, gently escort it back — again and again, without frustration.","اختار مهمة واحدة. لما العقل يسرح للماضي أو المستقبل أو مهمة تانية، رجّعه بهدوء — مرة ورا مرة، من غير تضايق.","When you feel scattered, anxious about everything at once, or can’t focus.","لما تحس إنك مشتت، أو قلقان من كل حاجة في وقت واحد، أو مش قادر تركّز."],
 '0_6':["Focusing on what actually works to meet your goal, rather than on what’s “fair”, “right”, or what “should” be.","إنك تركّز على اللي بيشتغل فعلًا عشان تحقق هدفك، بدل ما تركّز على اللي «عادل» أو «صح» أو «المفروض».","Ask “what gets me closer to my goal here?” Play by the rules of the situation; drop being right, revenge, and the “shoulds” that hurt you.","اسأل «إيه اللي هيقرّبني لهدفي هنا؟» امشي على قواعد الموقف؛ وسيب إنك صح، والانتقام، و«المفروض» اللي بيأذيك.","When clinging to being right or to principle is costing you the outcome you actually want.","لما تمسّكك بإنك صح أو بالمبدأ بيخسّرك النتيجة اللي إنت فعلًا عايزها."],
 '1_0':["Getting clear, before you act, on three things you want from an interaction: the objective, the relationship, and your self-respect.","إنك توضّح، قبل ما تتصرف، تلات حاجات عايزها من التفاعل: الهدف، العلاقة، واحترامك لذاتك.","Name each one, then rank them — which matters most here? That ranking tells you how hard to push and which skills to lead with.","سمّي كل واحدة، وبعدين رتّبهم — مين الأهم هنا؟ الترتيب ده بيقولك تضغط بقد إيه وتبدأ بأنهي مهارات.","Before any important conversation, request, or conflict.","قبل أي محادثة مهمة، أو طلب، أو خلاف."],
 '1_1':["The core DBT script for asking for something or saying no clearly and effectively: Describe, Express, Assert, Reinforce.","السكربت الأساسي في DBT للطلب أو الرفض بوضوح وفعالية: صِف، عبّر، أكّد، عزّز.","Describe the facts, Express how you feel with “I” statements, Assert your clear ask or no, Reinforce by naming the benefit to them of saying yes.","صِف الحقايق، عبّر عن شعورك بصيغة «أنا»، أكّد طلبك أو رفضك بوضوح، وعزّز بإنك تذكر الفايدة اللي هتعود عليهم لو وافقوا.","When you need to ask for something or refuse, and want to be heard without damaging the relationship.","لما تحتاج تطلب حاجة أو ترفض، وعايز تتسمع من غير ما تضر العلاقة."],
 '1_2':["Staying focused on your goal during the conversation, even when the other person resists or distracts (the “Mindful” of DEAR MAN).","إنك تفضل مركّز على هدفك أثناء المحادثة، حتى لو الطرف التاني قاوم أو شتّت (جزء الـ«Mindful» في DEAR MAN).","Broken record: calmly repeat your ask in the same words. Ignore attacks, guilt-trips, and side-topics — don’t take the bait; return to your point.","اسطوانة مشروخة: كرّر طلبك بهدوء بنفس الكلمات. تجاهل الهجوم ولوم الضمير والمواضيع الجانبية — متاخدش الطُعم، ارجع لنقطتك.","When someone keeps deflecting, arguing, or trying to make you feel guilty.","لما حد يفضل يراوغ أو يخانق أو يحاول يحسّسك بالذنب."],
 '1_3':["Appearing confident and being willing to negotiate (the “Appear confident” and “Negotiate” of DEAR MAN).","إنك تظهر بثقة وتكون مستعد تتفاوض («اظهر بثقة» و«تفاوض» في DEAR MAN).","Use a steady voice, eye contact, and upright posture (even if you don’t feel it). Offer alternatives, ask for their ideas, and find a workable middle.","استخدم صوت ثابت وتواصل بالعين ووقفة معتدلة (حتى لو مش حاسس بكده). اعرض بدائل، اسأل عن أفكارهم، والاقي حل وسط ينفع.","When you might be dismissed if you seem unsure, or when a flat yes/no won’t work and you need give-and-take.","لما ممكن يتجاهلوك لو بانت عليك حيرة، أو لما «أيوة/لأ» الجامدة مش هتنفع وتحتاج أخذ وعطا."],
 '1_4':["Keeping the relationship healthy while you pursue your goal: Gentle, Interested, Validate, Easy manner.","إنك تحافظ على العلاقة صحية وإنت بتسعى لهدفك: لُطف، اهتمام، تصديق، أسلوب هادي.","Be Gentle (no attacks/threats/judging), Interested (listen, don’t interrupt), Validate their feelings and view, and use an Easy manner (warmth or light humor).","كن لطيف (من غير هجوم/تهديد/حكم)، مهتم (اسمع من غير ما تقاطع)، صدّق مشاعرهم ووجهة نظرهم، واستخدم أسلوب هادي (دفا أو خفة دم).","When the relationship matters as much as, or more than, the immediate ask.","لما العلاقة تهمّك بقدر الطلب أو أكتر."],
 '1_5':["Keeping your self-respect in an interaction: Fair, no (excessive) Apologies, Stick to values, Truthful.","إنك تحافظ على احترامك لذاتك في التفاعل: عادل، من غير اعتذار زايد، تمسّك بقيمك، صادق.","Be fair to yourself and them, don’t over-apologize for existing or asking, hold your values under pressure, and stay honest (no exaggerating or acting helpless).","كن عادل مع نفسك ومعاهم، متعتذرش زيادة على إنك موجود أو بتطلب، اتمسك بقيمك تحت الضغط، وفضل صادق (من غير مبالغة أو تمثيل عجز).","When you tend to cave, over-apologize, or abandon your values to keep someone happy.","لما تبقى بتستسلم، أو تعتذر زيادة، أو تسيب قيمك عشان ترضي حد."],
 '1_6':["Actively tending to relationships over time so they stay strong — building new ones, maintaining good ones, and repairing or ending harmful ones.","إنك تهتم بعلاقاتك مع الوقت عشان تفضل قوية — تبني جديدة، تحافظ على الكويسة، وتصلّح أو تنهي المؤذية.","Stay in regular contact, balance giving and taking, address small problems before they grow, and don’t let resentment pile up silently.","فضل على تواصل منتظم، وازن العطا والأخذ، عالج المشاكل الصغيرة قبل ما تكبر، ومتسيبش الغل يتراكم في صمت.","Ongoing, not only in crises — especially when a relationship is drifting or strain is building.","بشكل مستمر، مش في الأزمات بس — خصوصًا لما العلاقة تبدأ تبعد أو التوتر يكبر."],
 '2_0':["Understanding an emotion by breaking it into its parts: the prompting event, your interpretation, body sensations, the action urge, and the aftereffects.","إنك تفهم الشعور عن طريق تقسيمه لأجزاءه: الحدث المحفّز، تفسيرك، أحاسيس الجسم، الرغبة في التصرف، والتأثير بعده.","Walk the emotion through the model and name each part. Naming and mapping an emotion lowers its intensity and its grip on you.","مشّي الشعور خلال النموذج وسمّي كل جزء. إن إنك تسمّي وتفهم الشعور بيقلل شدّته وسيطرته عليك.","When you feel a strong or confusing emotion and want to understand what’s really going on.","لما تحس بشعور قوي أو مش واضح وعايز تفهم اللي بيحصل فعلًا."],
 '2_1':["Testing whether an emotion (and its intensity) fits the actual facts, or whether it fits your interpretation of the facts.","إنك تختبر هل الشعور (وشدّته) مناسب للحقايق الفعلية، ولا مناسب لتفسيرك للحقايق.","Separate facts from assumptions, consider other interpretations, check if you’re assuming a threat, then ask: does my emotion fit the facts?","افصل الحقايق عن الافتراضات، فكّر في تفسيرات تانية، اتأكد لو بتفترض تهديد، وبعدين اسأل: هل شعوري مناسب للحقايق؟","When an emotion feels too big for the situation, or is driven by “what if” and assumptions.","لما الشعور يبان أكبر من الموقف، أو يكون مدفوع بـ«لو» والافتراضات."],
 '2_2':["When an emotion doesn’t fit the facts (or acting on it won’t help), deliberately doing the opposite of what it urges — fully.","لما الشعور مش مناسب للحقايق (أو التصرف عليه مش هيساعد)، إنك تعمل عكس اللي بيدفعك له — بالكامل.","Name the urge (hide, attack, avoid), then do its opposite with your whole body — posture, face, voice, actions — and keep going until the emotion shifts.","سمّي الرغبة (تختفي، تهجم، تتجنّب)، وبعدين اعمل عكسها بكل جسمك — الوقفة، الوش، الصوت، الأفعال — وكمّل لغاية ما الشعور يتغير.","When a justified-but-unhelpful or unjustified emotion (fear, shame, unwarranted anger) is steering you wrong.","لما شعور مبرر-بس-مش-مفيد أو غير مبرر (خوف، خزي، غضب في غير محله) بيوجّهك غلط."],
 '2_3':["When the facts themselves are the problem (the emotion fits), changing the situation to reduce the painful events.","لما الحقايق نفسها هي المشكلة (والشعور مناسب)، إنك تغيّر الموقف عشان تقلل الأحداث المؤلمة.","Define the problem, set a realistic goal, brainstorm many solutions, pick one, plan the steps, try it, then evaluate and adjust.","حدّد المشكلة، حُط هدف واقعي، اعمل عصف ذهني لحلول كتير، اختار واحد، خطّط الخطوات، جرّب، وبعدين قيّم وعدّل.","When a real, solvable situation keeps triggering the same painful emotion.","لما موقف حقيقي وقابل للحل بيفضل يثير نفس الشعور المؤلم."],
 '2_4':["Building positive emotions on purpose — pleasant events in the short term, and a life aligned with your values in the long term.","إنك تبني مشاعر إيجابية بقصد — أحداث لطيفة على المدى القصير، وحياة متوافقة مع قيمك على المدى الطويل.","Do one pleasant thing daily and savor it. Long-term: take small steps toward your goals and values, tend to relationships, and avoid avoiding.","اعمل حاجة لطيفة كل يوم واستمتع بيها. وعلى المدى الطويل: خطوات صغيرة ناحية أهدافك وقيمك، واهتم بعلاقاتك، وبلاش تجنّب.","To lower your baseline vulnerability to negative emotions — especially in low mood or burnout.","عشان تقلل قابليتك الأساسية للمشاعر السلبية — خصوصًا في المزاج المنخفض أو الإرهاق."],
 '2_5':["Doing things that build a real sense of competence, achievement, and control over your life.","إنك تعمل حاجات بتبني إحساس حقيقي بالكفاءة والإنجاز والتحكم في حياتك.","Each day do something a little challenging but doable — a skill, a task, learning — and increase the difficulty gradually as you improve.","كل يوم اعمل حاجة فيها تحدي بسيط بس ممكنة — مهارة، مهمة، تعلّم — وزوّد الصعوبة بالتدريج وإنت بتتحسّن.","When you feel helpless, stuck, or down on yourself.","لما تحس بالعجز، أو إنك عالق، أو متضايق من نفسك."],
 '2_6':["Mentally rehearsing a difficult situation in advance, so you’re prepared and less likely to be hijacked by emotion.","إنك تتمرّن ذهنيًا على موقف صعب قبل ما يحصل، عشان تبقى جاهز وأقل عرضة إن المشاعر تخطفك.","Picture the situation vividly, imagine yourself using your skills and coping well step by step, troubleshoot what could go wrong, then relax.","تخيّل الموقف بوضوح، وتخيّل نفسك بتستخدم مهاراتك وبتتعامل كويس خطوة بخطوة، توقّع اللي ممكن يبوظ، وبعدين استرخي.","Before a known stressful event — a confrontation, exam, social situation, or trigger.","قبل حدث ضاغط معروف — مواجهة، امتحان، موقف اجتماعي، أو محفّز."],
 '2_7':["Reducing your vulnerability to Emotion Mind by taking care of your body — an unbalanced body makes emotions harder to manage.","إنك تقلل قابليتك للعقل العاطفي عن طريق العناية بجسمك — الجسم غير المتوازن بيخلّي المشاعر أصعب في الإدارة.","Treat PhysicaL illness, balanced Eating, Avoid mood-altering substances, balanced Sleep, and Exercise — small consistent habits, not perfection.","عالج الأمراض، أكل متوازن، ابعد عن المكيفات، نوم متوازن، ورياضة — عادات بسيطة ثابتة، مش كمال.","Daily, as a foundation — and the first thing to check when you’re unusually reactive.","كل يوم، كأساس — وأول حاجة تراجعها لما تلاقي نفسك متهيّج أكتر من العادة."],
 '2_8':["Staying present with an emotion — experiencing it fully without acting on it, suppressing it, or judging it.","إنك تفضل حاضر مع الشعور — تعيشه بالكامل من غير ما تتصرف عليه أو تكبته أو تحكم عليه.","Observe it like a wave — notice where it sits in your body and let it rise, crest, and fall. You can feel an emotion without becoming it.","لاحظه زي الموجة — لاحظ مكانه في جسمك وسيبه يعلى ويوصل قمته وينزل. تقدر تحس بالشعور من غير ما تبقى هو.","When an emotion feels unbearable and you’re tempted to escape or act impulsively.","لما الشعور يبان لا يُحتمَل وتبقى متغري إنك تهرب أو تتصرف بتهور."],
 '3_0':["An emergency brake for crisis moments, so you don’t make things worse with an impulsive reaction.","فرملة طوارئ للحظات الأزمة، عشان متبوّظش الموضوع أكتر برد فعل متهور.","Stop (freeze, don’t react) · Take a step back (physically or mentally) · Observe what’s happening inside and out · Proceed mindfully from wise mind.","قف (اتجمّد، متردّش) · ارجع خطوة (جسديًا أو ذهنيًا) · لاحظ اللي بيحصل جوّه وبرّه · كمّل بوعي من العقل الحكيم.","The instant you feel a strong urge to lash out, flee, or do something you’ll regret.","في اللحظة اللي تحس فيها برغبة قوية إنك تهجم أو تهرب أو تعمل حاجة هتندم عليها."],
 '3_1':["Fast, body-based skills that lower extreme emotional arousal within minutes by changing your body chemistry.","مهارات سريعة معتمدة على الجسم بتقلل الانفعال الشديد في دقايق عن طريق تغيير كيمياء جسمك.","Temperature (cold water on the face / hold ice), Intense exercise (burn energy for a few minutes), Paced breathing (exhale longer than you inhale), Paired muscle relaxation.","الحرارة (مياه باردة على الوش / امسك تلج)، تمرين عنيف (احرق طاقة لكام دقيقة)، تنفّس بإيقاع (الزفير أطول من الشهيق)، استرخاء العضلات.","At very high arousal (panic, rage, urge to self-harm) when you can’t think straight.","في الانفعال العالي جدًا (هلع، غضب شديد، رغبة في إيذاء النفس) لما متقدرش تفكر صح."],
 '3_2':["Weighing the pros and cons of acting on a crisis urge versus resisting it, to make a wise-mind decision.","إنك توازن مميزات وعيوب إنك تنفّذ رغبة الأزمة مقابل إنك تقاومها، عشان تاخد قرار من العقل الحكيم.","List the pros and cons of giving in to the urge, and of resisting it. Usually the cons of acting are far bigger than they feel in the moment.","اكتب مميزات وعيوب إنك تستسلم للرغبة، ومميزات وعيوب إنك تقاومها. غالبًا عيوب التنفيذ أكبر بكتير مما بتبان في اللحظة.","When a strong urge (quit, use, lash out, run) is pulling at you and you have a moment to think.","لما رغبة قوية (تسيب، تتعاطى، تهجم، تجري) بتشدّك وعندك لحظة تفكر."],
 '3_3':["Three families of crisis-survival skills to get through a painful moment without making it worse.","تلات مجموعات من مهارات النجاة في الأزمة عشان تعدّي لحظة مؤلمة من غير ما تزوّدها سوء.","Distract (ACCEPTS), Self-soothe your five senses, and Improve the moment (imagery, meaning, prayer, relaxation, one-thing, vacation, encouragement).","شتّت (ACCEPTS)، هدّي حواسك الخمسة، وحسّن اللحظة (تخيّل، معنى، دعاء، استرخاء، حاجة واحدة، إجازة ذهنية، تشجيع).","When you can’t fix or accept the situation yet, but need to survive the next hour without harm.","لما متقدرش تحل أو تتقبّل الموقف لسه، بس محتاج تعدّي الساعة الجاية من غير أذى."],
 '3_4':["Accepting reality completely — facts, causes, and all — to stop the extra suffering that comes from fighting what’s already true. Acceptance is not approval.","إنك تقبل الواقع بالكامل — الحقايق والأسباب وكل حاجة — عشان توقف المعاناة الزيادة اللي بتيجي من محاربة اللي حصل خلاص. القبول مش موافقة.","Notice you’re fighting reality, remind yourself “it is what it is”, consider the causes, and accept with mind, body, and spirit — as often as needed.","لاحظ إنك بتحارب الواقع، فكّر نفسك «هو كده»، اعتبر الأسباب، واقبل بعقلك وجسمك وروحك — على قد ما تحتاج.","When something painful can’t be changed and fighting it only adds suffering (grief, loss, the past).","لما حاجة مؤلمة متتغيّرش ومحاربتها بتزوّد المعاناة بس (حزن، فقد، الماضي)."],
 '3_5':["Doing what the situation effectively needs, openly and wholeheartedly — the opposite of willfulness (refusing, “I won’t”, sitting on your hands).","إنك تعمل اللي الموقف محتاجه فعليًا، بانفتاح وبكل قلبك — عكس العناد (الرفض، «مش هعمل»، إنك تتفرّج).","Notice willfulness, then choose to participate in reality as it is. Open hands and an open posture help signal willingness to your mind.","لاحظ العناد، وبعدين اختار تشارك في الواقع زي ما هو. فتح الإيدين والوقفة المنفتحة بيساعدوا يبعتوا إشارة الاستعداد للعقل.","When you’re stuck refusing, resisting, or saying “this shouldn’t have to be this way”.","لما تبقى عالق في الرفض أو المقاومة أو «ده مكنش المفروض يكون كده»."],
 '3_6':["Observing thoughts as just thoughts — mental events that come and go — rather than facts, truths, or commands you must obey.","إنك تلاحظ الأفكار كمجرد أفكار — أحداث ذهنية بتيجي وتروح — مش حقايق أو أوامر لازم تنفّذها.","Watch thoughts arise and pass, like leaves on a stream or clouds. Label “I’m having the thought that…”. You’re the sky, not the weather.","راقب الأفكار وهي بتظهر وتعدّي، زي أوراق على نهر أو سحب. سمّي «عندي فكرة إن…». إنت السما، مش الجو.","When you’re fused with painful or intrusive thoughts and treating them as the truth.","لما تبقى ملتصق بأفكار مؤلمة أو اقتحامية وبتعاملها كأنها الحقيقة."],
 '3_7':["Accepting reality through your body — a slight, relaxed smile that signals acceptance to your brain and softens resistance.","إنك تقبل الواقع عن طريق جسمك — ابتسامة خفيفة مرتاحة بتبعت إشارة قبول لمخك وبتليّن المقاومة.","Relax your face fully, then turn the corners of your lips up just slightly. The serene, gentle face changes how you feel inside.","ريّح وشك بالكامل، وبعدين ارفع أطراف شفايفك شوية بس. الوش الهادي بيغيّر إحساسك من جوّه.","When you’re tense or fighting a reality you need to accept; pairs well with Radical Acceptance.","لما تبقى متوتر أو بتحارب واقع محتاج تتقبّله؛ بيتماشى كويس مع القبول الجذري."],
 '3_8':["Accepting reality through your body — open, unclenched hands with palms up, signaling openness instead of fight.","إنك تقبل الواقع عن طريق جسمك — أيدي مفتوحة غير مقبوضة وراحتها لفوق، بتبعت إشارة انفتاح بدل القتال.","Unclench your fists, drop your shoulders, and turn your palms open and upward. The willing posture lowers anger and resistance.","افتح قبضتك، نزّل كتفك، وخلي راحة إيدك مفتوحة ولفوق. الوضعية المتقبّلة بتقلل الغضب والمقاومة.","When you notice clenched fists, tension, or willful resistance in your body.","لما تلاحظ قبضة مقبوضة أو توتر أو عناد في جسمك."],
};

const MODULE_INFO=[
 ["<b>Mindfulness</b> is the foundation of every other DBT skill: paying attention, on purpose, to the present moment — without judging it. It splits into the <b>“What” skills</b> (Observe, Describe, Participate — what you do) and the <b>“How” skills</b> (Non-judgmentally, One-mindfully, Effectively — how you do them), all centred on <b>Wise Mind</b>. The point isn’t to empty your mind; it’s to notice your experience so you can respond instead of react. You can’t change an emotion you haven’t noticed — so start here, with short daily practice.","<b>اليقظة</b> هي أساس كل مهارة تانية في الـDBT: إنك تدّي انتباهك، بقصد، للحظة الحالية — من غير ما تحكم عليها. وهي بتنقسم لـ<b>مهارات «ماذا»</b> (لاحظ، صِف، شارك — اللي بتعمله) و<b>مهارات «كيف»</b> (من غير أحكام، بتركيز، بفعالية — إزاي بتعمله)، وكلها مرتكزة على <b>العقل الحكيم</b>. الفكرة مش إنك تفضّي دماغك؛ الفكرة إنك تلاحظ تجربتك عشان ترُد بدل ما تتفاعل بتهور. مش هتقدر تغيّر شعور إنت مش واخد بالك منه — فابدأ من هنا، بتمرين يومي قصير."],
 ["<b>Interpersonal Effectiveness</b> helps you ask for what you want, say no, and handle conflict — while keeping the relationship and your self-respect. The flow: get clear on your <b>goal</b>, decide <b>how firmly</b> to push (the ask/say-no tool), and choose <b>what to say</b> (DEAR MAN). Remember the three aims: <b>DEAR MAN</b> gets the objective, <b>GIVE</b> protects the relationship, <b>FAST</b> protects your self-respect — emphasise whichever matters most this time.","<b>فعالية العلاقات</b> بتساعدك تطلب اللي عايزه، وترفض، وتتعامل مع الخلاف — وإنت محافظ على العلاقة وعلى احترامك لذاتك. الترتيب: وضّح <b>هدفك</b>، قرر تضغط <b>بقوة قد إيه</b> (أداة الطلب/الرفض)، واختار <b>اللي هتقوله</b> (DEAR MAN). افتكر التلات أهداف: <b>DEAR MAN</b> بيحقق الهدف، <b>GIVE</b> بيحمي العلاقة، <b>FAST</b> بيحمي احترامك لذاتك — ركّز على الأهم في المرة دي."],
 ["<b>Emotion Regulation</b> helps you understand, reduce, and change difficult emotions — and grow positive ones. The path: first <b>understand</b> the emotion (Describing emotions, Check the facts), then <b>change</b> it if it doesn’t fit the facts or doesn’t help (Opposite action, Problem solving), and <b>lower your vulnerability</b> over time (Accumulate positives, Build mastery, Cope ahead, PLEASE). Emotions aren’t the enemy — each one has a job. The goal is balance, not numbness.","<b>تنظيم المشاعر</b> بيساعدك تفهم وتقلل وتغيّر المشاعر الصعبة — وتنمّي الإيجابية. الطريق: الأول <b>افهم</b> الشعور (وصف المشاعر، مراجعة الحقائق)، وبعدين <b>غيّره</b> لو مش مناسب للحقايق أو مش مفيد (فعل العكس، حل المشكلة)، و<b>قلّل قابليتك</b> مع الوقت (اجمع الإيجابيات، الإتقان، الاستعداد المسبق، العناية بالجسم). المشاعر مش عدوّك — كل شعور ليه وظيفة. الهدف التوازن، مش التبلّد."],
 ["<b>Survival &amp; Acceptance</b> (Distress Tolerance) is for moments of intense pain you can’t fix or change right now. <b>Crisis skills</b> (STOP, TIP, Pros &amp; Cons, Distract/Self-soothe/Improve) get you through the moment without making it worse. <b>Acceptance skills</b> (Radical Acceptance, Willingness, Mindfulness of thoughts, Half-smiling, Willing hands) help you stop fighting reality, so pain doesn’t harden into endless suffering. Reach for these when problem-solving isn’t possible yet.","<b>تجاوز المحن والقبول</b> للحظات الألم الشديد اللي مش قادر تحلها أو تغيّرها دلوقتي. <b>مهارات الأزمة</b> (STOP، TIP، المميزات والعيوب، التشتيت/تهدئة الذات/تحسين اللحظة) بتعدّيك اللحظة من غير ما تزوّدها سوء. <b>مهارات القبول</b> (القبول الجذري، الاستعداد والتقبّل، ملاحظة الأفكار، نص ابتسامة، الأيدي المتقبلة) بتساعدك تبطّل تحارب الواقع، عشان الألم ما يتحوّلش لمعاناة بلا نهاية. الجأ لها لما حل المشكلة لسه مش ممكن."],
];

// Three states of mind, shown on the Wise Mind page: [borderColor, titleEn, titleAr, descEn, descAr]
const MINDSTATES=[
  ['#38bdf8','Reasonable Mind','العقل المنطقي','Cool, logical, task-focused — planning, facts, and reason. Useful, but on its own it can miss what matters emotionally.','هادي، منطقي، مركّز على المهمة — تخطيط وحقايق ومنطق. مفيد، بس لوحده ممكن يفوته اللي مهم عاطفيًا.'],
  ['#f472b6','Emotional Mind','العقل العاطفي','Hot, mood-driven, ruled by feelings and urges. Powerful and important, but on its own it can act impulsively and make things worse.','ساخن، متحكّم فيه المزاج، بتسيطر عليه المشاعر والرغبات. قوي ومهم، بس لوحده ممكن يتصرف بتهور ويزوّد الأمور سوء.'],
  ['#34d399','Wise Mind','العقل الحكيم','The overlap of the two — where reason and emotion meet, plus intuition. Calm, centered, and it knows what truly fits.','تقاطع الاتنين — حيث يلتقي المنطق والعاطفة ويُضاف لهم الحدس. هادي، متّزن، وعارف اللي مناسب فعلًا.'],
